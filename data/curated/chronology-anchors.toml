# THE CANONICAL CHRONOLOGY REFERENCE, from now on. Every `[[anchor]]` row is
# an authoritative date on this project's own DECLARED traditional scale --
# Ussher's Annals of the World (1658, long public domain) for the OT, this
# atlas's own already-established AD-33 Passion anchor (HOTFIX-4) for the
# NT. Every year below is either stated directly in this batch's own brief
# or cross-checked against this atlas's own already-compiled/reviewed
# data -- the Annals' own text was NOT consulted/quoted directly (no
# LICENSES.md row needed; that file's own convention, per its Robertson/
# Crockett rows, is for when a source's own PROSE is read as curatorial
# provenance -- this table cites bare YEAR VALUES only, the same
# already-established "Ussher... 1055 BC"-class convention prior batches'
# own reports already use freely). Stated positively, no scale-debate
# register (owner's inerrancy doctrine, KJV-inerrancy-directive).
#
# SCHEMA (forward-compatible, per the controller's own "single-feed
# chronology" end-state note, 2026-08-22 -- a future HOTFIX-7 migrates event
# date AUTHORING to resolve from this table, never re-shaping it):
#   id           stable, machine-readable, snake-case-with-dashes row key --
#                never renumbered/repositioned; a future reign-offset table
#                (HOTFIX-7) can reference it by id to compute "N years after
#                anchor X" arithmetically without this file changing shape.
#   label        human-readable description.
#   year         the single authoritative year on this atlas's declared
#                scale (signed, no year zero) -- the one number "resolve
#                from the canonical table" (HOTFIX-7) will read.
#   event_id     OPTIONAL: the real compiled event id this anchor equals,
#                when one binds CLEANLY (no disclosed scale tension) -- this
#                is what the E1 (anchor-equality) and E3 (canonical-order)
#                property tests iterate. Omitted (not merely blank) where no
#                single compiled event corresponds, or where binding would
#                misrepresent a KNOWN, already-disclosed adjacency as a bug
#                (see the "DISCLOSED ADJACENCIES" rows below) -- an honest
#                gap, not a shortcut.
#   era_boundary OPTIONAL bool (default false): true for the anchors used as
#                the E4 (era-partition) property test's own structural
#                boundaries -- always carries event_id when true (E4 needs a
#                real timeline position). One boundary per transition in the
#                brief's own 8-era list (patriarchal / exodus-wilderness /
#                conquest-judges / united-monarchy / divided-kingdoms /
#                exile / return / NT), plus `creation` marking the very
#                start.
#   source       provenance (Ussher's Annals directly, or "this atlas's own
#                already-curated <chain>", per row).
#   note         OPTIONAL: disclosed tensions/derivation, never a
#                scale-debate register -- a plain statement of which two
#                already-legitimate traditions/values are in play.
#
# DISCLOSED ADJACENCIES (pre-existing, W1/W2-policy-governed per
# batch-hotfix6-brief.md's own "Context you can't get from the brief" --
# NOT re-litigated, NOT bugs): this atlas already carries TWO internally-
# consistent but mutually-offset OT sub-scales in places (the early/late
# Exodus dating debate, and a few well-known 1-2 year regnal-reckoning
# variances in the Persian period). Where a requirement-1-listed anchor's
# own literal Ussher value does not cleanly match this atlas's own already-
# curated data because of one of these adjacencies, this table carries BOTH:
# the literal Ussher-Annals row (left unbound, honestly), and a separate,
# clearly-marked "-begins"/"-departs" STRUCTURAL row bound to the real event
# this atlas's own graph actually uses for that transition (so the E4
# era-partition test still has a real timeline position to gate on). Search
# for "STRUCTURAL" below for all three pairs.

