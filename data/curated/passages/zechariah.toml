# Batch W4 (whole-Bible titled verse containers, fourth run: the Prophets).
# Zechariah, in the SAME `[[event]]` schema every other `passages/*.toml`
# file uses. KIND POLICY: see obadiah.toml's own header note.
#
# RECONCILIATION: one pre-existing bare Theographic event touches this book
# -- `theo-246` ("Prophecies of Zechariah," all 211 verses, -520). LAYER-0,
# not heading-worthy today; every container below stays well under the 0.8
# jaccard sweep floor against it (largest, 23/211 = 0.109).
#
# GRANULARITY/KIND, the book's own well-recognized two-part structure:
# chapters 1-8 ("First Zechariah") carry the text's OWN explicit
# day/month/regnal-year date-stamps throughout (1:1, 1:7, 7:1) -- this
# slice's own EVENT-kind case, matching Haggai's contemporaneous setting
# (the same "second year of Darius," reused/interpolated from theo-246's
# own -520; chapters 7-8's own explicit 'fourth year of Darius' is a
# simple, text-explicit two-year forward count from that same anchor, the
# same discipline data/curated/passages/1samuel.toml's own 'twenty years
# after the ark's own capture' precedent already establishes -- never an
# independently fresh Ussher derivation). The EIGHT NIGHT VISIONS
# (1:7-6:8) are split per-vision, the master brief's own named 'Daniel's
# visions per vision' granularity; the crowning of Joshua (6:9-15) is a
# real, narrated sign-act in the same dated setting. Chapters 9-14 ("Second
# Zechariah," two 'burdens,' 9:1 and 12:1) carry NO text-explicit date --
# GENERAL-kind, per this file's own header policy. PLACE (Part 1 only):
# Jerusalem throughout -- explicit via Zerubbabel/Joshua the high priest's
# own presence and the temple's own rebuilding, the same setting Haggai
# shares.

# --- Part 1: dated (1:1-8:23), EVENT-kind -------------------------------

[[event]]
id = "zec_call_to_repentance"
label = "Turn ye unto me, saith the Lord of hosts, and I will turn unto you"
kind = "event"
from_year = -520
to_year = -520
order_key = 1
places = ["jerusalem"]
verses = ["ZEC.1.1-6"]
atlas_section = "Zechariah pericope (this project's own sectioning, CC0 -- no external PD source claimed): Zechariah 1:1-6, dated the eighth month of the second year of Darius -- an opening call not to be as the fathers, who did not hearken to the former prophets."
ref_note = "Date: 'the eighth month, in the second year of Darius' (1:1), interpolated from the pre-existing theo-246. Place: Jerusalem, implicit throughout via this book's own shared setting with Haggai."

