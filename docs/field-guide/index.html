<title>Bible Explorer Field Guide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#EFF1F4; --card:#F7F8FA; --ink:#1F232B; --muted:#5B6473; --rule:#D3D8E0; --rule-soft:#E4E8EE;
  --accent:#2E4F9E; --accent-ink:#FFFFFF; --rust:#B7472A; --rust-soft:#F3E3DD; --test:#4F7A3C; --test-soft:#E3EEDC;
  --l1:#8A6D1F; --l2:#2E4F9E; --l3:#5A3E8F; --focus:#2E4F9E;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif; --sans:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif; --mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#15181E; --card:#1C2027; --ink:#E6E9EF; --muted:#9AA3B2; --rule:#2C323C; --rule-soft:#232830;
  --accent:#8FA8E8; --accent-ink:#0F1420; --rust:#E0805F; --rust-soft:#3A2620; --test:#8FBF78; --test-soft:#22301C;
  --l1:#D6B25A; --l2:#8FA8E8; --l3:#B69AE6; --focus:#8FA8E8; color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#15181E; --card:#1C2027; --ink:#E6E9EF; --muted:#9AA3B2; --rule:#2C323C; --rule-soft:#232830;
  --accent:#8FA8E8; --accent-ink:#0F1420; --rust:#E0805F; --rust-soft:#3A2620; --test:#8FBF78; --test-soft:#22301C;
  --l1:#D6B25A; --l2:#8FA8E8; --l3:#B69AE6; --focus:#8FA8E8; color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
code,.mono{font-family:var(--mono);font-size:.92em}
p code{background:var(--card);border:1px solid var(--rule-soft);border-radius:3px;padding:0 .3em}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0;text-wrap:balance}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:300px minmax(0,1fr) 320px;height:100%;min-height:0}
.rail{border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0;background:var(--paper)}
.main{min-width:0;overflow:auto;padding-block:28px 64px;padding-inline:40px}
.side{border-left:1px solid var(--rule);overflow:auto;padding:24px 20px 48px;background:var(--paper)}
.rail-head{padding:18px 16px 10px;border-bottom:1px solid var(--rule)}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{font-size:19px;font-weight:600;white-space:nowrap}
.brand small{color:var(--muted);font-family:var(--mono);font-size:11px}
.search{margin-top:12px;position:relative}
.search input{width:100%;padding:8px 10px 8px 30px;border:1px solid var(--rule);border-radius:6px;background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.search svg{position:absolute;left:9px;top:9px;width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2}
.rail-tabs{display:flex;gap:4px;padding:8px 12px 0}
.rail-tabs button{padding:6px 10px;border-radius:6px 6px 0 0;font-weight:500;color:var(--muted);border-bottom:2px solid transparent}
.rail-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tree{overflow:auto;flex:1;padding:8px 8px 40px}
.tree ul{list-style:none;margin:0;padding:0}
.tree li{margin:0}
.node{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:5px 8px;border-radius:5px;font-size:13.5px;line-height:1.3}
.node:hover{background:var(--card)}
.node[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.node[aria-current="true"] .n-meta{color:inherit;opacity:.8}
.node .chev{width:14px;flex:none;color:var(--muted);transition:transform .15s}
.node[aria-expanded="true"] .chev{transform:rotate(90deg)}
.node .n-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .n-meta{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none}
.tree .area>.node{font-weight:600;font-family:var(--serif);font-size:14px;padding-block:7px}
.tree .group>.node{color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.03em;text-transform:uppercase}
.tree .file>.node{padding-left:34px;font-family:var(--mono);font-size:12.5px}
.tree .group ul .file>.node{padding-left:34px}
.tree [hidden]{display:none!important}
.count-pill{font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:9px;border:1px solid var(--rule);color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- gauge ---------- */
.gauge{display:flex;align-items:stretch;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--card);margin:18px 0 26px}
.gauge button{flex:1;padding:10px 12px;text-align:left;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:2px}
.gauge button:last-child{border-right:0}
.gauge .g-n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.gauge .g-t{font-weight:600;font-size:13.5px}
.gauge .g-s{font-size:12px;color:var(--muted)}
.gauge button[aria-pressed="true"]{background:var(--paper);box-shadow:inset 0 -3px 0 var(--gcol)}
.gauge button[aria-pressed="true"] .g-n{color:var(--gcol)}
.gauge button[data-l="1"]{--gcol:var(--l1)} .gauge button[data-l="2"]{--gcol:var(--l2)} .gauge button[data-l="3"]{--gcol:var(--l3)}

/* ---------- article ---------- */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted);font-size:13px}
.crumbs button{color:var(--accent);padding:0}
.crumbs .sep{opacity:.6}
.title{margin-top:10px;font-size:30px}
.title.mono{font-family:var(--mono);font-weight:500;font-size:22px;word-break:break-all}
.role{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--muted);margin-top:8px;max-width:65ch}
.ruler{display:flex;align-items:center;gap:10px;margin-top:14px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.ruler .bar{height:6px;flex:1;max-width:320px;background:var(--rule-soft);border-radius:3px;overflow:hidden}
.ruler .bar i{display:block;height:100%;background:var(--accent);opacity:.7}
.prose{max-width:66ch;font-size:16px;line-height:1.65}
.prose p{margin:0 0 1em}
.prose ul{margin:0 0 1em;padding-left:1.2em}
.level-tag{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid;margin-bottom:10px}
.level-tag[data-l="1"]{color:var(--l1);border-color:var(--l1)} .level-tag[data-l="2"]{color:var(--l2);border-color:var(--l2)} .level-tag[data-l="3"]{color:var(--l3);border-color:var(--l3)}
.section{margin-top:34px}
.section h2{font-size:18px;margin-bottom:10px;display:flex;align-items:baseline;gap:10px}
.section h2 small{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400}
.items{width:100%;border-collapse:collapse;font-size:14px}
.items th{text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--rule)}
.items td{padding:8px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
.items td:first-child{font-family:var(--mono);white-space:nowrap}
.items .ln{font-family:var(--mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.kind{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--card);border:1px solid var(--rule);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:12px;padding:3px 9px;border-radius:12px;border:1px solid var(--rule);background:var(--card);color:var(--ink)}
.chip.concept{border-color:color-mix(in srgb,var(--rust) 45%,transparent);background:var(--rust-soft);color:var(--rust)}
.chip.concept:hover{background:var(--rust);color:#fff}
.chip.link{color:var(--accent)}
.chip.link:hover{background:var(--accent);color:var(--accent-ink)}
.chip.dead{color:var(--muted);cursor:default}
.tests{background:var(--test-soft);border-left:3px solid var(--test);padding:10px 14px;border-radius:0 6px 6px 0;font-size:14px}
.gotchas{border:1px dashed var(--rule);border-radius:6px;padding:10px 14px 10px 28px;margin:0}
.tour{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:40px;padding-top:16px;border-top:1px solid var(--rule);font-size:13.5px;flex-wrap:wrap}
.tour button{padding:7px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--card)}
.tour button:disabled{opacity:.4;cursor:default}
.tour .pos{color:var(--muted);font-family:var(--mono);font-size:12px}
.tour .trail{display:flex;gap:3px;flex:1;min-width:120px}
.tour .trail i{flex:1;height:4px;border-radius:2px;background:var(--rule)}
.tour .trail i.done{background:var(--accent)}
.tour .trail i.now{background:var(--rust)}

/* ---------- side panel ---------- */
.side h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-family:var(--sans);font-weight:600;margin:22px 0 8px}
.side h3:first-child{margin-top:0}
.side .list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.side .list button{text-align:left;font-family:var(--mono);font-size:12.5px;color:var(--accent);word-break:break-all;padding:2px 0}
.side .list .dead{color:var(--muted);font-family:var(--mono);font-size:12.5px}
.side .list .ki{display:grid;grid-template-columns:1fr auto;gap:4px 8px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--rule-soft)}
.side .list .ki b{font-family:var(--mono);font-weight:500}
.side .list .ki span{color:var(--muted);grid-column:1/-1;font-size:12.5px}
.stat{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--rule-soft)}
.stat b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}

/* ---------- home ---------- */
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:22px}
.area-card{border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:16px 16px 14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:150px}
.area-card:hover{border-color:var(--accent)}
.area-card h3{font-size:16px}
.area-card .lang{font-family:var(--mono);font-size:11px;color:var(--muted)}
.area-card p{margin:0;font-size:13.5px;color:var(--muted);flex:1}
.area-card .meta{display:flex;gap:10px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.flow{margin-top:30px;border:1px solid var(--rule);border-radius:8px;padding:16px 18px;background:var(--card);overflow-x:auto}
.flow ol{display:flex;gap:8px;list-style:none;margin:0;padding:0;align-items:center;min-width:700px}
.flow li{font-family:var(--mono);font-size:12px;padding:6px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);white-space:nowrap}
.flow li.arrow{border:0;background:none;color:var(--muted);padding:0}
.flow li button{color:var(--accent)}

/* ---------- glossary sheet ---------- */
.sheet{position:fixed;inset:0;display:none;z-index:20}
.sheet[open]{display:block}
.sheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.sheet .panel{position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--paper);border-left:1px solid var(--rule);overflow:auto;padding:24px 28px 48px;box-shadow:-12px 0 40px rgba(0,0,0,.15)}
.sheet .close{position:absolute;top:14px;right:16px;padding:6px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--card)}
.sheet h2{font-size:24px;margin-top:6px}
.sheet .fam{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.sheet pre{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.5}
.gloss-list{list-style:none;margin:0;padding:0 8px 40px}
.gloss-list li button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:6px 8px;border-radius:5px;font-size:13.5px}
.gloss-list li button:hover{background:var(--card)}
.gloss-list li button span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.gloss-list .fam-head{padding:12px 8px 4px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---------- responsive ---------- */
.rail-toggle{display:none}
@media (max-width:1180px){
  .app{grid-template-columns:280px minmax(0,1fr)}
  .side{display:none}
  .side-inline{display:block}
}
@media (min-width:1181px){ .side-inline{display:none} }
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:0 20% 0 0;z-index:10;transform:translateX(-100%);transition:transform .2s;box-shadow:8px 0 30px rgba(0,0,0,.2)}
  .rail.open{transform:none}
  .rail-toggle{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--card);margin-bottom:14px}
  .main{padding-inline:18px;padding-block:18px 56px}
  .title{font-size:24px}
  .gauge button .g-s{display:none}
}
</style>

<div class="app" id="app">
  <nav class="rail" id="rail" aria-label="Codebase tree">
    <div class="rail-head">
      <div class="brand"><h1><button id="home-btn" style="font:inherit;padding:0">Field Guide</button></h1><small id="brand-stats">loading</small></div>
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search files, types, functions" aria-label="Search files, types, functions" autocomplete="off">
      </div>
    </div>
    <div class="rail-tabs" role="tablist">
      <button role="tab" id="tab-files" aria-selected="true">Files</button>
      <button role="tab" id="tab-gloss" aria-selected="false">Rust glossary</button>
    </div>
    <div class="tree" id="tree" role="tree"></div>
    <ul class="gloss-list" id="gloss-list" hidden></ul>
  </nav>

  <main class="main" id="main" tabindex="-1">
    <button class="rail-toggle" id="rail-toggle" aria-controls="rail" aria-expanded="false">☰ Files</button>
    <div id="content"></div>
  </main>

  <aside class="side" id="side" aria-label="Context"></aside>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="scrim" id="sheet-scrim"></div>
  <div class="panel" id="sheet-panel"></div>
</div>

<script src="data.js"></script>
<script>
(function(){
  const D = window.EXPLORER || {areas:[], glossary:{primer_order:[], entries:[]}};
  const LEVELS = [
    {n:1, t:"Plain English",  s:"what it is for, no jargon",           key:"l1"},
    {n:2, t:"New to Rust",    s:"how it works, concepts introduced",   key:"l2"},
    {n:3, t:"Every detail",   s:"types, laws, invariants, file:line", key:"l3"},
  ];
  // ---------- state ----------
  const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
  let level = store.get("fg-level", 1);
  let expanded = new Set(store.get("fg-expanded", []));
  let current = null;      // {type:"home"} | {type:"area", area} | {type:"file", path}
  let tour = null;         // {area, i}

  // ---------- index ----------
  const byPath = new Map(), areaOf = new Map(), groupOf = new Map();
  const glossByTag = new Map((D.glossary.entries||[]).map(e=>[e.tag,e]));
  let totalFiles=0, totalLines=0;
  for (const a of D.areas){
    for (const f of a.files){ byPath.set(f.path,f); areaOf.set(f.path,a); totalFiles++; totalLines += (f.lines||0); }
    for (const g of (a.groups||[])) for (const p of g.paths) groupOf.set(p,g);
  }
  const maxLines = Math.max(1, ...[...byPath.values()].map(f=>f.lines||0));
  document.getElementById("brand-stats").textContent = `${totalFiles} files · ${totalLines.toLocaleString()} lines`;

  // ---------- helpers ----------
  const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  function inline(s){ // escape, then `code` spans and **bold**
    return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  }
  function prose(text){
    const parts = String(text||"").split(/\n{2,}|\n(?=[-*] )/);
    return parts.map(p=>{
      const lines = p.split("\n").filter(l=>l.trim().length);
      if (lines.length && lines.every(l=>/^\s*[-*] /.test(l))) return "<ul>"+lines.map(l=>"<li>"+inline(l.replace(/^\s*[-*] /,""))+"</li>").join("")+"</ul>";
      return "<p>"+inline(p.trim()).replace(/\n/g,"<br>")+"</p>";
    }).join("");
  }
  const slug = p => p.replace(/[^A-Za-z0-9]+/g,"-");
  const base = p => p.split("/").pop();
  function setHash(h){ if (location.hash !== "#"+h) history.replaceState(null,"","#"+h); }

  // ---------- tree ----------
  function buildTree(){
    const t = document.getElementById("tree");
    t.innerHTML = D.areas.map(a=>{
      const id = "a-"+slug(a.area);
      const open = expanded.has(id);
      const groups = (a.groups && a.groups.length) ? a.groups : [{name:"Files", paths:a.files.map(f=>f.path)}];
      return `<ul><li class="area" role="treeitem" aria-expanded="${open}">
        <button class="node" data-area="${esc(a.area)}" aria-expanded="${open}" data-id="${id}">
          <span class="chev">▸</span><span class="n-label" title="${esc(a.title||a.area)}">${esc(a.area)}</span><span class="count-pill">${a.files.length}</span></button>
        <ul ${open?"":"hidden"}>${groups.map(g=>{
          const gid = id+"-g-"+slug(g.name); const gopen = expanded.has(gid) || groups.length===1;
          return `<li class="group" role="treeitem" aria-expanded="${gopen}">
            <button class="node" data-group="${gid}" aria-expanded="${gopen}" title="${esc(g.note||"")}"><span class="chev">▸</span><span class="n-label">${esc(g.name)}</span><span class="n-meta">${g.paths.length}</span></button>
            <ul ${gopen?"":"hidden"}>${g.paths.map(p=>{ const f=byPath.get(p); if(!f) return ""; return `<li class="file" role="treeitem" data-path="${esc(p)}" data-search="${esc((p+" "+(f.role||"")+" "+(f.key_items||[]).map(k=>k.name).join(" ")).toLowerCase())}">
              <button class="node" data-file="${esc(p)}" title="${esc(f.role||"")}"><span class="n-label">${esc(base(p))}</span><span class="n-meta">${f.lines||""}</span></button></li>`;}).join("")}</ul></li>`;
        }).join("")}</ul></li></ul>`;
    }).join("");
  }
  document.getElementById("tree").addEventListener("click", e=>{
    const b = e.target.closest("button.node"); if(!b) return;
    if (b.dataset.file){ show({type:"file", path:b.dataset.file}); closeRail(); return; }
    const li = b.parentElement, ul = li.querySelector(":scope > ul");
    const open = b.getAttribute("aria-expanded")!=="true";
    b.setAttribute("aria-expanded", open); li.setAttribute("aria-expanded", open); ul.hidden = !open;
    const id = b.dataset.id || b.dataset.group; if (open) expanded.add(id); else expanded.delete(id); store.set("fg-expanded",[...expanded]);
    if (b.dataset.area && open) show({type:"area", area:b.dataset.area});
  });
  function revealInTree(path){
    const li = document.querySelector(`.tree li.file[data-path="${CSS.escape(path)}"]`); if(!li) return;
    document.querySelectorAll(".tree .node[aria-current]").forEach(n=>n.removeAttribute("aria-current"));
    li.querySelector(".node").setAttribute("aria-current","true");
    let p = li.parentElement;
    while (p && p.id!=="tree"){ if (p.tagName==="UL" && p.hidden){ p.hidden=false; const btn=p.previousElementSibling; if(btn){btn.setAttribute("aria-expanded","true"); const id=btn.dataset.id||btn.dataset.group; if(id) expanded.add(id);} } p=p.parentElement; }
    store.set("fg-expanded",[...expanded]);
    li.scrollIntoView({block:"nearest"});
  }
  // search
  document.getElementById("search").addEventListener("input", e=>{
    const q = e.target.value.trim().toLowerCase();
    const files = document.querySelectorAll(".tree li.file");
    if (!q){ files.forEach(li=>li.hidden=false); document.querySelectorAll(".tree li.group > ul, .tree li.area > ul").forEach(ul=>{ const b=ul.previousElementSibling; ul.hidden = b.getAttribute("aria-expanded")!=="true"; }); return; }
    files.forEach(li=>{ li.hidden = !li.dataset.search.includes(q); });
    document.querySelectorAll(".tree li.group").forEach(g=>{ const any=[...g.querySelectorAll("li.file")].some(li=>!li.hidden); g.hidden=!any; if(any) g.querySelector(":scope > ul").hidden=false; });
    document.querySelectorAll(".tree li.area").forEach(a=>{ const any=[...a.querySelectorAll("li.file")].some(li=>!li.hidden); a.hidden=!any; if(any) a.querySelector(":scope > ul").hidden=false; });
  });
  document.getElementById("search").addEventListener("keydown", e=>{
    if (e.key==="Enter"){ const first=[...document.querySelectorAll(".tree li.file")].find(li=>!li.hidden && !li.closest("[hidden]")); if(first){ show({type:"file", path:first.dataset.path}); closeRail(); } }
  });

  // ---------- gauge ----------
  function gaugeHTML(){
    return `<div class="gauge" role="group" aria-label="Depth of explanation">${LEVELS.map(L=>`<button data-l="${L.n}" aria-pressed="${level===L.n}"><span class="g-n">LEVEL ${L.n} · key ${L.n}</span><span class="g-t">${L.t}</span><span class="g-s">${L.s}</span></button>`).join("")}</div>`;
  }
  document.addEventListener("click", e=>{
    const b = e.target.closest(".gauge button"); if(!b) return;
    level = +b.dataset.l; store.set("fg-level", level); render(); if (document.getElementById("sheet").open) renderSheet(currentTag);
  });

  // ---------- rendering ----------
  function linkChip(p){ return byPath.has(p) ? `<button class="chip link" data-goto="${esc(p)}">${esc(p)}</button>` : `<span class="chip dead" title="not one of the explained files">${esc(p)}</span>`; }
  function conceptChips(tags){ return (tags||[]).map(t=> glossByTag.has(t) ? `<button class="chip concept" data-gloss="${esc(t)}">${esc(t)}</button>` : `<span class="chip dead">${esc(t)}</span>`).join(""); }

  function renderFile(f){
    const a = areaOf.get(f.path), g = groupOf.get(f.path);
    const L = LEVELS[level-1];
    const pct = Math.max(2, Math.round(100*(f.lines||0)/maxLines));
    const order = a.reading_order||[]; const idx = order.indexOf(f.path);
    const html = `
      <div class="crumbs"><button data-home>Field Guide</button><span class="sep">›</span><button data-area="${esc(a.area)}">${esc(a.title||a.area)}</button>${g?`<span class="sep">›</span><span>${esc(g.name)}</span>`:""}</div>
      <h1 class="title mono">${esc(f.path)}</h1>
      <p class="role">${esc(f.role||"")}</p>
      <div class="ruler"><span>${(f.lines||0).toLocaleString()} lines</span><span class="bar"><i style="width:${pct}%"></i></span><span>longest file ${maxLines.toLocaleString()}</span></div>
      ${gaugeHTML()}
      <div class="prose"><span class="level-tag" data-l="${L.n}">${esc(L.t)}</span>${prose(f[L.key])}</div>
      ${(f.key_items&&f.key_items.length)?`<div class="section"><h2>What lives here <small>${f.key_items.length} items</small></h2><div style="overflow-x:auto"><table class="items"><thead><tr><th>Name</th><th>Kind</th><th>What it does</th><th class="ln">Line</th></tr></thead><tbody>${f.key_items.map(k=>`<tr><td>${esc(k.name)}</td><td><span class="kind">${esc(k.kind||"")}</span></td><td>${inline(k.what||"")}</td><td class="ln">${k.line??""}</td></tr>`).join("")}</tbody></table></div></div>`:""}
      ${(f.concepts&&f.concepts.length)?`<div class="section"><h2>Rust concepts on this page <small>click one for the glossary</small></h2><div class="chips">${conceptChips(f.concepts)}</div></div>`:""}
      ${f.tests?`<div class="section"><h2>How it is tested</h2><div class="tests">${inline(f.tests)}</div></div>`:""}
      ${(f.gotchas&&f.gotchas.length)?`<div class="section"><h2>Easy to trip on</h2><ul class="gotchas">${f.gotchas.map(x=>`<li>${inline(x)}</li>`).join("")}</ul></div>`:""}
      <div class="side-inline">${sideHTML(f)}</div>
      ${order.length?`<div class="tour"><button data-tour="-1" ${idx<=0?"disabled":""}>‹ Previous in ${esc(a.title||a.area)}</button><span class="trail" aria-hidden="true">${order.map((p,i)=>`<i class="${i<idx?"done":i===idx?"now":""}"></i>`).join("")}</span><span class="pos">${idx>=0?idx+1:"–"} of ${order.length} in the reading order</span><button data-tour="1" ${idx<0||idx>=order.length-1?"disabled":""}>Next ›</button></div>`:""}`;
    document.getElementById("content").innerHTML = html;
    document.getElementById("side").innerHTML = sideHTML(f);
    revealInTree(f.path);
    setHash(`file=${encodeURIComponent(f.path)}`);
    document.title = `${base(f.path)} · Bible Explorer Field Guide`;
  }
  function sideHTML(f){
    const dep = f.depends_on||[], used = f.used_by||[];
    return `<h3>At a glance</h3>
      <div class="stat"><span>Lines</span><b>${(f.lines||0).toLocaleString()}</b></div>
      <div class="stat"><span>Named items</span><b>${(f.key_items||[]).length}</b></div>
      <div class="stat"><span>Depends on</span><b>${dep.length}</b></div>
      <div class="stat"><span>Used by</span><b>${used.length}</b></div>
      <h3>Depends on</h3>${dep.length?`<ul class="list">${dep.map(p=>`<li>${byPath.has(p)?`<button data-goto="${esc(p)}">${esc(p)}</button>`:`<span class="dead">${esc(p)}</span>`}</li>`).join("")}</ul>`:`<p style="color:var(--muted);font-size:13px;margin:0">Nothing inside this repo.</p>`}
      <h3>Used by</h3>${used.length?`<ul class="list">${used.map(p=>`<li>${byPath.has(p)?`<button data-goto="${esc(p)}">${esc(p)}</button>`:`<span class="dead">${esc(p)}</span>`}</li>`).join("")}</ul>`:`<p style="color:var(--muted);font-size:13px;margin:0">No known callers in the repo (a test, a binary, or an entry point).</p>`}`;
  }
  function renderArea(a){
    const L = LEVELS[level-1];
    const lines = a.files.reduce((s,f)=>s+(f.lines||0),0);
    const order = a.reading_order||[];
    const html = `
      <div class="crumbs"><button data-home>Field Guide</button><span class="sep">›</span><span>${esc(a.kind||"")}</span></div>
      <h1 class="title">${esc(a.title||a.area)}</h1>
      <div class="ruler"><span>${a.files.length} files</span><span>·</span><span>${lines.toLocaleString()} lines</span><span>·</span><span>${esc(a.language||"")}</span></div>
      ${gaugeHTML()}
      <div class="prose"><span class="level-tag" data-l="${L.n}">${esc(L.t)}</span>${prose((a.overview||{})[L.key])}</div>
      ${order.length?`<div class="section"><h2>Reading order <small>start here, in this order</small></h2><ol style="padding-left:1.4em;margin:0;line-height:1.9">${order.map(p=>`<li><button class="chip link" data-goto="${esc(p)}">${esc(p)}</button> <span style="color:var(--muted);font-size:13px">${esc((byPath.get(p)||{}).role||"")}</span></li>`).join("")}</ol><p style="margin-top:12px"><button class="chip link" data-goto="${esc(order[0])}">Begin the tour ›</button></p></div>`:""}
      ${(a.groups||[]).map(g=>`<div class="section"><h2>${esc(g.name)} <small>${g.paths.length} files</small></h2>${g.note?`<p style="color:var(--muted);margin:0 0 10px;max-width:66ch">${inline(g.note)}</p>`:""}<div class="chips">${g.paths.map(p=>linkChip(p)).join("")}</div></div>`).join("")}`;
    document.getElementById("content").innerHTML = html;
    document.getElementById("side").innerHTML = `<h3>${esc(a.title||a.area)}</h3>${(a.groups||[]).map(g=>`<div class="stat"><span>${esc(g.name)}</span><b>${g.paths.length}</b></div>`).join("")}<h3>Levels</h3><p style="font-size:13px;color:var(--muted);margin:0">Every file and area is written three times. Press <b>1</b>, <b>2</b>, <b>3</b> to switch depth anywhere; the choice sticks.</p>`;
    document.querySelectorAll(".tree .node[aria-current]").forEach(n=>n.removeAttribute("aria-current"));
    setHash(`area=${encodeURIComponent(a.area)}`);
    document.title = `${a.title||a.area} · Bible Explorer Field Guide`;
  }
  function firstSentence(s){ const m = String(s||"").match(/^[^.!?]*[.!?]/); return m?m[0]:String(s||"").slice(0,140); }
  function renderHome(){
    const L = LEVELS[level-1];
    const html = `
      <div class="eyebrow">A field guide to the code</div>
      <h1 class="title">Bible Explorer, file by file</h1>
      <p class="role">${totalFiles} files and ${totalLines.toLocaleString()} lines across the Rust server, the shared types crate, the Blazor client, the tests, the contracts and the data pipeline — each explained three times, from plain English to every detail.</p>
      ${gaugeHTML()}
      <div class="prose"><span class="level-tag" data-l="${L.n}">${esc(L.t)}</span>${prose(HOME[L.key])}</div>
      <div class="flow" aria-label="How data flows through the system"><div class="eyebrow" style="margin-bottom:10px">The pipeline, left to right</div><ol>
        <li>data/raw + data/curated</li><li class="arrow">→</li><li><button data-area="server/atlas-etl">atlas-etl</button></li><li class="arrow">→</li><li>data/compiled/*.json</li><li class="arrow">→</li><li><button data-area="server/atlas-graph (src)">atlas-graph-compile</button></li><li class="arrow">→</li><li>graph.bin + exports</li><li class="arrow">→</li><li><button data-area="server/atlas-server + atlas-cli">atlas-server</button></li><li class="arrow">→</li><li><button data-area="client">Blazor client</button></li>
      </ol></div>
      <div class="home-grid">${D.areas.map(a=>{ const lines=a.files.reduce((s,f)=>s+(f.lines||0),0); return `<button class="area-card" data-area="${esc(a.area)}"><span class="lang">${esc(a.kind||"")} · ${esc(a.language||"")}</span><h3>${esc(a.title||a.area)}</h3><p>${esc(firstSentence((a.overview||{}).l1))}</p><span class="meta"><span>${a.files.length} files</span><span>${lines.toLocaleString()} lines</span></span></button>`;}).join("")}</div>`;
    document.getElementById("content").innerHTML = html;
    const primer = (D.glossary.primer_order||[]).slice(0,12);
    document.getElementById("side").innerHTML = `<h3>Start here</h3><ul class="list"><li><button data-goto="graph-types/src/lib.rs">graph-types/src/lib.rs</button></li><li><button data-goto="graph-types/src/store.rs">graph-types/src/store.rs</button></li><li><button data-goto="server/atlas-server/src/main.rs">server/atlas-server/src/main.rs</button></li></ul>
      <h3>Rust primer, in order</h3><div class="chips">${primer.map(t=>`<button class="chip concept" data-gloss="${esc(t)}">${esc(t)}</button>`).join("")}</div>
      <h3>Keys</h3><p style="font-size:13px;color:var(--muted);margin:0"><b>1 2 3</b> depth · <b>[ ]</b> previous / next in a reading order · <b>/</b> search · <b>Esc</b> close the glossary</p>`;
    document.querySelectorAll(".tree .node[aria-current]").forEach(n=>n.removeAttribute("aria-current"));
    setHash(""); document.title = "Bible Explorer Field Guide";
  }
  const HOME = {
    l1: `**What this is.** Bible Explorer is one big connected map of everything in the Bible and a few books about it: every verse, every place, every event, every kingdom's borders, Luther's Small Catechism, the Book of Concord, and Kretzmann's commentary. All of it lives in one structure called the graph: things (nodes) joined by typed connections (edges). The Rust programs on the left build that graph from open datasets and answer questions about it; the Blazor client on the right is the reader and the map you actually see.

**How to use this guide.** Pick a crate or folder from the tree on the left. Each area opens with an overview and a reading order; each file opens with an explanation at the depth you chose above. Rust words you have not met yet are highlighted; click one and the glossary explains it at the same three depths.`,
    l2: `**Shape of the codebase.** \`graph-types/\` defines the vocabulary: node kinds, edge relations, ids, text positions, chronology, and the \`GraphQuery\` trait that every storage backend must implement. \`server/atlas-etl\` parses raw datasets into intermediate JSON. \`server/atlas-graph\` turns that JSON into the typed graph, runs the laws, and serialises \`graph.bin\`. \`server/atlas-server\` is the axum HTTP API; \`server/atlas-cli\` is the same graph on the command line. \`server/atlas-core\` is the older data model the map still composes from. \`client/\` is C# and Razor.

**Rust concepts you will meet everywhere:** \`struct\` and \`enum\` for data, \`trait\` for shared behaviour, \`Option\` and \`Result\` instead of null and exceptions, \`BTreeMap\` when order must be deterministic, \`Arc\` for shared read-only data, and the \`?\` operator for passing errors upward. Each is in the glossary.`,
    l3: `**Architecture in one paragraph.** One compiled artifact (\`data/compiled/graph.bin\`, bincode over deterministically ordered DTOs, \`FORMAT_VERSION\` checked at load) holds ~92k nodes and ~1.2M edge-index entries; \`GraphService::from_artifact\` decodes it and builds indexes in ~1.3 s. Serving binds only to \`GraphQuery\` (five methods) for the graph endpoints, while \`/api/scene\` still composes from the legacy \`AtlasData\` that \`atlas_data_overlay\` rebuilds through the port at boot (the disclosed 751 MiB footprint the relational-artifact migration retires). Laws are Rust tests over the in-memory \`Graph\`: admission (\`assert_answers_match\`), determinism, containment forest, attestation exclusivity, provenance resolution, byte-pinned scene responses, and a versioned contract suite in Gherkin over both HTTP and CLI transports.

**Conventions to know:** ids are human-readable interned strings with a content hash as a secondary index; every authored row carries provenance and an optional justification; every adapter writes into the same \`Graph\` struct; \`graph-types\` is zero-dependency because a sibling map project path-depends on it.`
  };

  // ---------- glossary ----------
  let currentTag = null;
  function buildGlossList(){
    const fams = {};
    for (const e of (D.glossary.entries||[])) (fams[e.family||"other"] ||= []).push(e);
    const famName = {"rust-language":"Rust · language","rust-std":"Rust · standard library","rust-ecosystem":"Rust · crates and tooling","rust-testing":"Rust · testing","csharp-blazor":"C# and Blazor","web-testing":"Web testing","web":"Web"};
    const order = ["rust-language","rust-std","rust-ecosystem","rust-testing","csharp-blazor","web-testing","web"];
    const keys = [...order.filter(k=>fams[k]), ...Object.keys(fams).filter(k=>!order.includes(k))];
    document.getElementById("gloss-list").innerHTML = keys.map(k=>`<li class="fam-head">${esc(famName[k]||k)}</li>`+fams[k].sort((x,y)=>x.tag.localeCompare(y.tag)).map(e=>`<li><button data-gloss="${esc(e.tag)}">${esc(e.title||e.tag)}<span>${esc(e.tag)}</span></button></li>`).join("")).join("");
  }
  function renderSheet(tag){
    const e = glossByTag.get(tag); if(!e) return;
    currentTag = tag;
    const L = LEVELS[level-1];
    const text = e[L.key]||"";
    const withCode = text.split(/```/); // code fences from the writer, if any
    const body = withCode.map((seg,i)=> i%2 ? `<pre>${esc(seg.replace(/^\w+\n/,""))}</pre>` : prose(seg)).join("");
    document.getElementById("sheet-panel").innerHTML = `<button class="close" id="sheet-close">Close · Esc</button>
      <div class="fam">${esc(e.family||"")} · ${esc(e.tag)}</div><h2 id="sheet-title">${esc(e.title||e.tag)}</h2>${gaugeHTML()}
      <div class="prose"><span class="level-tag" data-l="${L.n}">${esc(L.t)}</span>${body}</div>
      ${(e.see_also&&e.see_also.length)?`<div class="section"><h2>See also</h2><div class="chips">${conceptChips(e.see_also)}</div></div>`:""}
      ${usedIn(tag)}`;
    const sh = document.getElementById("sheet"); sh.setAttribute("open",""); sh.open = true;
    document.getElementById("sheet-close").focus();
  }
  function usedIn(tag){
    const files = [...byPath.values()].filter(f=>(f.concepts||[]).includes(tag)).slice(0,14);
    if (!files.length) return "";
    return `<div class="section"><h2>Files that use it <small>${files.length} shown</small></h2><div class="chips">${files.map(f=>`<button class="chip link" data-goto="${esc(f.path)}">${esc(f.path)}</button>`).join("")}</div></div>`;
  }
  function closeSheet(){ const sh=document.getElementById("sheet"); sh.removeAttribute("open"); sh.open=false; currentTag=null; }
  document.getElementById("sheet-scrim").addEventListener("click", closeSheet);
  document.addEventListener("click", e=>{
    if (e.target.id==="sheet-close") closeSheet();
    const g = e.target.closest("[data-gloss]"); if (g){ renderSheet(g.dataset.gloss); return; }
    const go = e.target.closest("[data-goto]"); if (go){ closeSheet(); show({type:"file", path:go.dataset.goto}); return; }
    const ar = e.target.closest("[data-area]:not(.node)"); if (ar){ show({type:"area", area:ar.dataset.area}); return; }
    if (e.target.closest("[data-home]") || e.target.id==="home-btn"){ show({type:"home"}); return; }
    const t = e.target.closest("[data-tour]"); if (t && current && current.type==="file"){ const a=areaOf.get(current.path); const o=a.reading_order||[]; const i=o.indexOf(current.path)+(+t.dataset.tour); if(o[i]) show({type:"file", path:o[i]}); }
  });

  // rail tabs
  document.getElementById("tab-files").addEventListener("click", ()=>{ setTab("files"); });
  document.getElementById("tab-gloss").addEventListener("click", ()=>{ setTab("gloss"); });
  function setTab(which){
    const files = which==="files";
    document.getElementById("tab-files").setAttribute("aria-selected", files);
    document.getElementById("tab-gloss").setAttribute("aria-selected", !files);
    document.getElementById("tree").hidden = !files; document.getElementById("gloss-list").hidden = files;
  }
  // rail drawer (phones)
  const railBtn = document.getElementById("rail-toggle");
  railBtn.addEventListener("click", ()=>{ const r=document.getElementById("rail"); const open=!r.classList.contains("open"); r.classList.toggle("open", open); railBtn.setAttribute("aria-expanded", open); });
  function closeRail(){ document.getElementById("rail").classList.remove("open"); railBtn.setAttribute("aria-expanded","false"); }

  // keys
  document.addEventListener("keydown", e=>{
    if (e.target.matches("input,textarea")) { if (e.key==="Escape") e.target.blur(); return; }
    if (e.key==="Escape"){ closeSheet(); return; }
    if (e.key==="/"){ e.preventDefault(); document.getElementById("search").focus(); return; }
    if (["1","2","3"].includes(e.key)){ level=+e.key; store.set("fg-level",level); render(); if(currentTag) renderSheet(currentTag); return; }
    if ((e.key==="[" || e.key==="]") && current && current.type==="file"){ const a=areaOf.get(current.path); const o=a.reading_order||[]; const i=o.indexOf(current.path)+(e.key==="]"?1:-1); if(o[i]) show({type:"file", path:o[i]}); }
  });

  // ---------- routing ----------
  function show(view){ current = view; render(); document.getElementById("main").scrollTop = 0; }
  function render(){
    if (!current || current.type==="home") return renderHome();
    if (current.type==="area"){ const a = D.areas.find(x=>x.area===current.area); return a ? renderArea(a) : renderHome(); }
    const f = byPath.get(current.path); return f ? renderFile(f) : renderHome();
  }
  function fromHash(){
    const h = new URLSearchParams(location.hash.replace(/^#/,""));
    if (h.get("file") && byPath.has(h.get("file"))) return {type:"file", path:h.get("file")};
    if (h.get("area")) return {type:"area", area:h.get("area")};
    return {type:"home"};
  }
  window.addEventListener("hashchange", ()=>{ current = fromHash(); render(); });

  buildTree(); buildGlossList(); current = fromHash(); render();
  const start = (h)=>{}; window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
