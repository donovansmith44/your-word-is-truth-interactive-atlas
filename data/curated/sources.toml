# The Sources page's own curated single source of truth (batch-s-brief.md,
# "document our sources for everything and give it a dedicated page on the
# site"). `server/atlas-etl/src/bin/gen_sources.rs` compiles this 1:1 into
# `data/compiled/sources.json`, which `GET /api/sources` serves and the
# client's `Sources.razor` page renders directly -- "the page renders from
# data, not hardcoded duplicate prose" (requirement 3).
#
# EVERY [[source]] entry below corresponds to exactly one row of
# LICENSES.md's own "## Per-source table" -- `licenses_row_key` is a
# literal substring of that row's own Source-column text, checked
# bidirectionally by `atlas_etl::sources::validate_against_licenses`
# (both `gen_sources` and `server/atlas-etl/tests/sources_validate.rs`
# run this check, so a LICENSES.md row added without a matching entry
# here -- or vice versa -- fails loud, at generation time AND under
# `cargo test --workspace`). `licenses_row_key` is never rendered on the
# page itself.
#
# Wording throughout is deliberately POSITIVE (the KJV inerrancy
# directive's own tone rule, which this file follows exactly as the app's
# reader does): every entry describes what a source IS and what this
# project BUILT from it, never a comparative/critical register. License
# wording is copied from LICENSES.md, never upgraded or embellished
# (citation-integrity rule -- no license overclaimed).

