# Hasmonean Judea: the Maccabean revolt's own kingdom, grown far beyond
# Yehud -- Galilee, Samaria, Idumea, and Perea (across the Jordan) all
# annexed by John Hyrcanus/Alexander Jannaeus. Ends with Pompey's conquest
# (63 BC). Fix round 1 (M3): fetched
# en.wikisource.org/wiki/1911_Encyclopaedia_Britannica/Galilee and
# .../Idumaea 2026-08-20 to ground this era. Galilee's own article gives a
# precise boundary ("bounded S. by Samaria and the Carmel range, E. by the
# Jordan, N. by the Leontes (Litani), and W. by the Mediterranean and part
# of Phoenicia") that this ring's own northern extent approximates.
# Idumaea's article confirms that by Josephus's OWN (i.e. this era's
# contemporary) usage, "Idumaea" meant the territory southwest of the Dead
# Sea (Gobalitis/Amalekitis/Akrabatine), not the older, Transjordanian Edom
# southeast of it -- confirms this ring's own southward CISJORDAN bulge
# (not a Transjordan-Edom extension) is the historically correct reading of
# "Idumea annexed." Also fetched .../Maccabees, which does not itemize
# Hyrcanus/Jannaeus's specific conquests, so the overall extent otherwise
# remains general historical-geography knowledge; shape confirmed
# unchanged.
