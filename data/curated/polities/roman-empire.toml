# roman-empire.toml -- Rome; shapes are approximate, drawn for
# recognizability. One polity id spanning Republic into Empire -- the era
# NAME changes ("Roman Republic" -> "Roman Empire") but the id stays
# "roman-empire" throughout, so the plate keeps one hue across the growth
# from Mediterranean power to the empire Paul travels and writes to.
id = "roman-empire"

# The Roman Republic at the height of its own Mediterranean expansion
# (after the Punic Wars and Pompey's eastern settlement, before Actium):
# Italy (INCLUDING the peninsula proper, not just Rome's own immediate
# hinterland -- omitting it was a real defect a previous fix round on this
# exact kind of shape had to catch and correct), Greece, western Anatolia,
# a Levant client-state fringe (Judea under Hyrcanus II), and North Africa
# after Carthage's fall (146 BC). Egypt stays independent (Ptolemaic)
# through this whole era -- see egypt.toml.
[[era]]
name = "Roman Republic"
from = -200
to = -31
ref_note = "fetched en.wikipedia.org/wiki/Roman_Empire 2026-08-19 for the Mediterranean-rim extent this era's own successor inherits; Republic-era specifics (Italy, Greece, Punic Wars-era North Africa) from general historical-geography knowledge"
