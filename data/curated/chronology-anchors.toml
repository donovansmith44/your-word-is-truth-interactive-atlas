# SCHEMA (forward-compatible, per the controller's own "single-feed
# chronology" end-state note, 2026-08-22 -- a future HOTFIX-7 migrates event
# date AUTHORING to resolve from this table, never re-shaping it):
#   id           stable, machine-readable, snake-case-with-dashes row key --
#                never renumbered/repositioned; a future reign-offset table
#                (HOTFIX-7) can reference it by id to compute "N years after
#                anchor X" arithmetically without this file changing shape.
#   label        human-readable description.
#   year         the single authoritative year on this atlas's declared
#                scale (signed, no year zero) -- the one number "resolve
#                from the canonical table" (HOTFIX-7) will read.
#   event_id     OPTIONAL: the real compiled event id this anchor equals (or
#                is DEFERRED against -- see below), when one binds at all.
#                Bound + not deferred is what the E1 (anchor-equality) and
#                E3 (canonical-order) property tests iterate as a live
#                equality claim. Omitted (not merely blank) where no single
#                compiled event corresponds, or where binding would
#                misrepresent a genuinely DISCLOSED ADJACENCY as a bug (see
#                that section below -- today, Exodus only). A row CAN bind
#                without living up to E1's own plain-equality claim: see
#                `atlas_core::chronology::ANCHOR_DEFERRALS` and the "TYPED
#                DEFERRALS" section below for the other, time-bounded case.
#   era_boundary OPTIONAL bool (default false): true for the anchors used as
#                the E4 (era-partition) property test's own structural
#                boundaries -- always carries event_id when true (E4 needs a
#                real timeline position). One boundary per transition in the
#                brief's own 8-era list (patriarchal / exodus-wilderness /
#                conquest-judges / united-monarchy / divided-kingdoms /
#                exile / return / NT), plus `creation` marking the very
#                start.
#   source       provenance (Ussher's Annals directly, or "this atlas's own
#                already-curated <chain>", per row).
#   note         OPTIONAL: disclosed tensions/derivation, never a
#                scale-debate register -- a plain statement of which two
#                already-legitimate traditions/values are in play.
#
# DISCLOSED ADJACENCIES vs. TYPED DEFERRALS -- two DIFFERENT concepts, not
# to be confused (owner sequencing redirect, 2026-08-22):
#
# A DISCLOSED ADJACENCY (pre-existing, W1/W2-policy-governed per
# batch-hotfix6-brief.md's own "Context you can't get from the brief" --
# NOT re-litigated, NOT a bug) is a genuine, legitimate, standing tension
# where this atlas SHIPS its own declared Ussher value and discloses a
# real alternative in prose. Exactly ONE such pair exists in this table --
# Exodus, below (search for "STRUCTURAL" to find its own bound companion
# row, "exodus-departs"). Its own literal row is deliberately left
# UNBOUND (no `event_id`) -- E1 never even asks it a question.
#
# A TYPED DEFERRAL (`atlas_core::chronology::ANCHOR_DEFERRALS`) is
# different: the shipped value is NOT a legitimate alternative -- it is
# W2-era authoring DRIFT the controller's own fix-round-1 ruling already
# named as such, but which the owner then ruled should NOT be hand-
# corrected now (re-dating events by hand today is wasted work ahead of
# HOTFIX-7's own single-feed migration, which deletes every inline year
# literal and resolves dates from this table directly). A deferred row
# DOES bind (`event_id` set, so the deferral has something concrete to
# reference) and its own `year` is the canonical value the data will
# become -- E1 reports every deferral by name, still verifying the
# deferral's own recorded shipped-value claim stays honest, never
# silently equating it to a real pass. Four rows carry this typing today
# (jerusalem-falls, cyrus-decree, temple-finished, ezra-returns) -- search
# for "DEFERRED" below.

