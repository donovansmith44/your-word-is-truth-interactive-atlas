# land-mask.toml -- Batch R requirement 1 ("borders become part of the
# plate"): ONE hand-drawn land/coastline mask for the eastern-Mediterranean
# plate, used ONLY to clip polity washes (map.js's BorderLayer) so they never
# spill into open sea -- never rendered as its own visible layer. Stored like
# the polity rings (data/curated/polities/*.toml): one file, plain
# [lat, lon] coordinate lists, a comment per region naming what it covers and
# how it was drawn, easily hand-editable/reversible per the same discipline
# design-direction.md's Borders THIRD REVISION asks of polity rings.
#
# COORDINATES ARE OUR OWN APPROXIMATIONS -- general geographic knowledge of
# well-known coastal cities/landmarks (Beirut, Alexandria, the Nile Delta,
# the Persian Gulf's own shores, etc.), hand-typed against that knowledge,
# NOT traced from any copyrighted vector coastline dataset (CC0, see
# LICENSES.md). "Enough vertices to make the coastline RECOGNIZABLE," not
# survey-grade -- the same bar the polity rings are held to. Every ring was
# checked with the same ring-simplicity algorithm atlas-etl runs at ETL time
# (atlas_etl::polities::ring_is_simple) before being committed here.
#
# Six independent regions (rings), most-detailed first: the brief's own
# explicit ask is a "recognizable Levant/Nile/Mesopotamia coastline," so the
# Levant/Sinai/Egypt/Anatolia ring (region 1) and the Mesopotamia/Persian
# Gulf ring (region 2) carry the most points and the most careful coastal
# tracing; the three peripheral regions (Persia's own eastern reach,
# southern Europe, North Africa west of Egypt) exist only so the curated
# polities that reach that far (Alexander's empire, Persia, the Seleucids,
# Parthia, Rome) aren't clipped away on THEIR OWN legitimate territory --
# they are deliberately coarser, generous rather than precise, erring on the
# side of extra "land" rather than clipping real polity wash. A `<clipPath>`
# unions every ring's own filled area (SVG's own documented behavior for
# multiple children of one clipPath), so these six regions need no shared
# edges or matching seams -- deliberate overlap where two regions meet (e.g.
# region 1's Anatolia edge and region 4's Aegean edge) is safe and used
# freely to guarantee no gap.
#
# Known, deliberate simplifications (honestly disclosed, not oversights):
# the Gulf of Aqaba is not traced as its own notch (too narrow to matter at
# this app's own hand-drawn scale); Arabia's own landmass is never included
# at all (no curated polity has ever had territory there) -- only enough of
# the Red Sea's/Persian Gulf's OWN shorelines nearest Egypt/Mesopotamia/
# Persia are traced to keep those two seas correctly excluded; the Black Sea
# and Caspian Sea are not excluded (no curated polity reaches them either);
# region 4 (southern Europe) is a rough sketch, not a precise trace of
# Iberia/Gaul/Italy/Greece's own coastlines -- Roman Empire's own hand-drawn
# ring already approximates its own territory, and this mask's only job
# there is "don't clip it," not "look like an atlas of Europe."

