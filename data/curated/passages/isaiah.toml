[[event]]
id = "isa_isaiahs_call_vision"
label = "Isaiah's own call: Here am I; send me"
kind = "event"
from_year = -758
to_year = -758
places = ["jerusalem"]
verses = ["ISA.6.1-13"]
atlas_section = "Isaiah pericope (this project's own sectioning, CC0): Isaiah 6, dated 'the year that king Uzziah died' -- the vision of the Lord high and lifted up, the seraphim crying 'Holy, holy, holy,' Isaiah's own unclean lips touched with a live coal, and his own answer to the call: 'here am I; send me,' followed by the Lord's own hard word that the people would hear but not understand, until cities lie waste."
ref_note = "Date: 'in the year that king Uzziah died' (6:1), reused from the pre-existing theo-218 ('Death of Uzziah,' -758) -- see this file's own header note."

[[event]]
