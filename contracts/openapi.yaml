# Generated by `cargo run -p atlas-contract --bin export_contract` from the Rust that serves it; do not edit.
openapi: 3.1.0
info:
  title: Bible Atlas API
  description: The Bible Atlas HTTP API, generated from the Rust that serves it. The `x-atlas-relations` extension lists every relation this atlas joins two nodes by, each with the label its forward and its inverse neighbours are asked for and the words each is displayed by, so a consumer builds its own vocabulary from that list rather than writing one out.
  version: 0.27.0
paths:
  /api/books:
    get:
      tags:
      - reading
      summary: The books of the canon in order, each with the verse count of every one of its chapters.
      operationId: books
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CanonBook'
  /api/catechism/item/{id}:
    get:
      tags:
      - catechism
      summary: 'One catechism item in full: its own words, its explanation, the chief part it belongs to, and every proof verse with the verse text spelled out.'
      description: |-
        `{id}` is an item id handed back by `/api/catechism/{sref}` or by a verse's
        own catechism list; an id naming no item is `not_found`.
      operationId: catechism_item
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatechismItem'
        '404':
          description: Nothing in this atlas answers to that reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: The request was well formed but this atlas's own data for it is incomplete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/catechism/{sref}:
    get:
      tags:
      - catechism
      summary: The catechism items that cite a verse or a span, each named and tied to the question it was cited under.
      description: |-
        `{sref}` is `BOOK.CHAPTER.VERSE` or a same-chapter span such as `GEN.1.1-5`;
        a book-only or chapter-only reference is `bad_ref`. A reference no item cites
        answers an empty list, and each `id` fetches the whole item from
        `/api/catechism/item/{id}`.
      operationId: catechism_for_span
      parameters:
      - name: sref
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatechismRef'
        '400':
          description: The reference, window or query could not be read; the body's `code` is `bad_ref`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Nothing in this atlas answers to that reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: The request was well formed but this atlas's own data for it is incomplete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/chapter/{cref}:
    get:
      tags:
      - reading
      summary: 'One chapter of Scripture verse by verse: the text, the places and people named in it, its heading where it opens one, and how many cross references start at it.'
      description: |-
        `{cref}` is `BOOK.CHAPTER`, such as `EXO.14`; a book-only or verse-shaped
        segment is `bad_ref`. A chapter number past the end of the book is not an
        error -- the response carries an empty `verses` list.
      operationId: chapter
      parameters:
      - name: cref
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'
        '400':
          description: The reference, window or query could not be read; the body's `code` is `bad_ref`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Nothing in this atlas answers to that reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: The request was well formed but this atlas's own data for it is incomplete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/contents/{corpus}:
    get:
      tags:
      - contents
      summary: 'The contents of one corpus as a two-level tree: its books or documents, and each one''s chapters or articles.'
      description: |-
        `{corpus}` is `bible` or `concord`; anything else is `not_found`. Every entry
        carries the reference to open for it, how many members it holds, and, for a
        book, which half of the canon it belongs to.
      operationId: contents
      parameters:
      - name: corpus
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contents'
        '404':
          description: Nothing in this atlas answers to that reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: The request was well formed but this atlas's own data for it is incomplete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/contract:
    get:
      tags:
      - meta
      summary: The schema versions of the compiled data set behind the responses.
      operationId: contract
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
  /api/elements:
    get:
      tags:
      - graph
      summary: Nodes and edges of the graph by id, many in one request, each answered in the order asked.
      description: '`ids` lists node ids (the form `/api/node/{id}` takes) and edge ids (the id an edge page carries for its edge), separated by commas: `ids=Event:ab_ur,LocatedAt:…`. Each id is answered by its own record, or by `missing` where it reads as an id but names nothing. One id that does not read as a node''s or an edge''s refuses the whole read as `bad_ref`, as does asking for none. At most the server''s largest page of ids is answered at once: `next`, when present, is the `cursor` that reads the ids that follow, and its absence is the last page. `previous` is absent on the first page alone, which has no page before it; every other page names the `cursor` of the page before it, the second page naming the first page''s own `cursor`, 0. Leaving `cursor` out reads at 0: both are the first page, one page under two spellings.'
      operationId: elements
      parameters:
      - name: ids
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
          minItems: 1
        style: form
        explode: false
      - name: cursor
        in: query
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElementPage'
        '400':
          description: The reference, window or query could not be read; the body's `code` is `bad_ref`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Nothing in this atlas answers to that reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: The request was well formed but this atlas's own data for it is incomplete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/eras:
    get:
      tags:
      - map
      summary: Every named stretch of this atlas's timeline, with its year bounds, oldest first.
      operationId: eras
      responses:
        '200':
          content:
            application/json:
