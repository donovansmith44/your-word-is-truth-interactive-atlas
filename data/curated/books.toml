author = "Ezekiel"
# write_place: brief guessed "babylon", but geo ancient.jsonl has no plain
# "Babylon" slug -- it has 3 name-collision entries. babylon-1 (32.5433,
# 44.4222) is literal Mesopotamian Babylon near the Euphrates and carries
# the OT exile verses (2KI/2CH/EZR/JER/EZK/DAN); babylon-2/babylon-3 sit at
# Rome's coordinates (41.8922, 12.4852) and carry 1PE.5.13 / Revelation's
# "Babylon the Great" respectively (the NT symbolic Babylon=Rome cipher).
# Ezekiel prophesied in the literal exile community, so babylon-1 is correct.
write_place = "babylon-1"
write_from = -593
write_to = -570
