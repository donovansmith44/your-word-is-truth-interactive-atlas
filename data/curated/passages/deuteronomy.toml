to_year = -1451
places = ["moab-1"]
verses = ["DEU.29.1-29", "DEU.30.1-20"]
atlas_section = "Deuteronomy pericope (this project's own sectioning, CC0 -- no external PD source claimed): Deuteronomy 29-30, the covenant made in Moab besides the one at Horeb, the promise of restoration after exile, and Moses's own charge: 'I have set before you life and death... therefore choose life.'"
ref_note = "Same traditional year. Place: 'the land of Moab' (29:1), explicit."

