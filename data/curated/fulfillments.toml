[[fulfillment]]
prophecy = { from = "PSA.78.2" }
fulfillment = { from = "MAT.13.35" }
text = "That it might be fulfilled which was spoken by the prophet, saying, I will open my mouth in parables; I will utter things which have been kept secret from the foundation of the world."

[[fulfillment]]
prophecy = { from = "ZEC.9.9" }
fulfillment = { from = "MAT.21.4", to = "MAT.21.5" }
text = "All this was done, that it might be fulfilled which was spoken by the prophet, saying, Tell ye the daughter of Sion, Behold, thy King cometh unto thee, meek, and sitting upon an ass, and a colt the foal of an ass."

[[fulfillment]]
