[package]
name = "atlas-graph-types"
version = "0.2.0" # DB-3: the one coordinated MINOR (spec 9) -- five port methods, LexiconEntry, Occurs. Additive only.
edition = "2021"
description = "The Explorable Graph type system — compiling base point for the 2026-08-22 design specs. No dependencies; the compiler is the reviewer."

# Batch M-A (controller ruling 1): joined into the server/ workspace as a
# member (one workspace, one lockfile) -- the standalone-workspace
# detachment above this comment is retired now that the parked HOTFIX-7
# tree is no longer a concern for this crate. Its own law tests still run
# in isolation via `cargo test -p atlas-graph-types`.

[dependencies]

# DB-2a: the ONE switch. OFF (default) = every observable byte is exactly
# what it was before the relational-artifact work began -- 64-bit
# DefaultHasher pids, debug-format canonical bytes, the `dfcf6ee4c2a39965`
# version root. ON = SHA-256-128 content addresses over canonical JSON.
# An empty feature list is the point: no optional dependency hides here.
#
# THE TWO GATES ARE RUN FROM THIS DIRECTORY:
#
#     cd graph-types && cargo test                      # OFF (default)
#     cd graph-types && cargo test --features canon-ids # ON
#
# DB-4a: the atlas workspace is ON -- every `server/` member declares
# `atlas-graph-types = { path, features = ["canon-ids"] }`, so
# `cargo test --workspace` from `server/` builds the ON state. The default
# stays OFF because the map-generator sibling depends on this crate as a
# path dependency and still reads `ContentHash` as a u64; deleting the OFF
# paths is DB-5's call, once it has migrated.
[features]
canon-ids = []
