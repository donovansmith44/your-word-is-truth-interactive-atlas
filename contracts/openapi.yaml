          type: string
        places:
          type: array
          items:
            type: string
        verse_groups:
          type: array
          items:
            $ref: '#/components/schemas/VerseGroup'
      additionalProperties: false
    NarrativeEventPositions:
      type: object
      description: 'Where one event sits in time: in each narrative it belongs to, and in the atlas''s whole chronology.'
      required:
      - narrative
      properties:
        narrative:
          type: array
          items:
            $ref: '#/components/schemas/NarrativePosition'
        timeline:
          oneOf:
          - $ref: '#/components/schemas/TimelinePosition'
          - type: 'null'
      additionalProperties: false
    NarrativeId:
      type: string
      description: The id of one Narrative node.
    NarrativePosition:
      type: object
      description: One event's place in one narrative, with the legs on either side of it.
      required:
      - narrative_id
      - narrative_name
      - event_id
      - event_label
      properties:
        event_id:
          type: string
        event_label:
          type: string
        following:
          oneOf:
          - $ref: '#/components/schemas/NarrativeAdjacentEvent'
          - type: 'null'
        narrative_id:
          type: string
        narrative_name:
          type: string
        prior:
          oneOf:
          - $ref: '#/components/schemas/NarrativeAdjacentEvent'
          - type: 'null'
      additionalProperties: false
    NodeElement:
      allOf:
      - $ref: '#/components/schemas/Element'
      - type: object
        required:
        - node
        properties:
          node:
            $ref: '#/components/schemas/NodeRecord'
      description: The node an id names, as its own record.
      unevaluatedProperties: false
    NodeKind:
      type: string
      description: What kind of thing one node of this atlas stands for.
      enum:
      - TextUnit
      - Container
      - Event
      - Narrative
      - Place
      - Person
      - Anchor
      - Era
      - Polity
      - CatechismItem
      - Source
      - Translation
      - PeopleGroup
      - CommentaryItem
      - LexiconEntry
      - Map
    NodePosition:
      allOf:
      - $ref: '#/components/schemas/PositionRef'
      - type: object
        required:
        - node
        properties:
          node:
            $ref: '#/components/schemas/NodeRef'
      description: An edge's far end when it is a node.
      unevaluatedProperties: false
    NodeRecord:
      type: object
      description: 'One node of the graph at a glance: what it is, what to call it, where it came from, and what it connects to. `version` stamps the data set it was read from.'
      required:
      - id
      - kind
      - label
      - provenance
      - edge_summary
      - version
      properties:
        book:
          oneOf:
          - $ref: '#/components/schemas/BookDetail'
          - type: 'null'
        catechism:
          oneOf:
          - $ref: '#/components/schemas/CatechismDetail'
          - type: 'null'
        description:
          type:
          - string
          - 'null'
        edge_summary:
          type: array
          items:
            $ref: '#/components/schemas/EdgeSummaryEntry'
        era:
          oneOf:
          - $ref: '#/components/schemas/EraDetail'
          - type: 'null'
        event:
          oneOf:
          - $ref: '#/components/schemas/EventDetail'
          - type: 'null'
        id:
          type: string
        kind:
          $ref: '#/components/schemas/NodeKind'
        label:
          type: string
        map:
          oneOf:
          - $ref: '#/components/schemas/MapDetail'
          - type: 'null'
        person:
          oneOf:
          - $ref: '#/components/schemas/PersonLife'
          - type: 'null'
        place:
          oneOf:
          - $ref: '#/components/schemas/PlaceDetail'
          - type: 'null'
        polity:
          oneOf:
          - $ref: '#/components/schemas/PolityDetail'
          - type: 'null'
        provenance:
          type: string
        text:
          oneOf:
          - $ref: '#/components/schemas/UnitText'
          - type: 'null'
        version:
          type: string
      additionalProperties: false
    NodeRef:
      type: object
      description: 'A reference to a node: enough to show it, and the id to fetch it with.'
      required:
      - id
      - kind
      - label
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/NodeKind'
        label:
          type: string
      additionalProperties: false
    Parentage:
      type: string
      description: 'How a parent stands to a child. Every parent-of row is natural unless Scripture declares otherwise: God the Father begets the Son from eternity, the Virgin Mary bore Him, Joseph was His father as was supposed, and God created Adam and Eve.'
      enum:
      - natural
      - eternal
      - virgin
      - legal
      - created
    PersonLife:
      type: object
      description: What is recorded about one person's life.
      required:
      - eternal
      - eternal_grounds
      - also_called
      properties:
        also_called:
          type: array
          items:
            type: string
        birth:
          oneOf:
          - $ref: '#/components/schemas/Year'
          - type: 'null'
        death:
          oneOf:
          - $ref: '#/components/schemas/Year'
          - type: 'null'
        eternal:
          type: boolean
        eternal_grounds:
          type: array
          items:
            type: string
        first:
          oneOf:
          - $ref: '#/components/schemas/Year'
          - type: 'null'
        gender:
          type:
          - string
          - 'null'
        last:
          oneOf:
          - $ref: '#/components/schemas/Year'
          - type: 'null'
      additionalProperties: false
    PersonRef:
      type: object
      description: A person the graph attests at a verse -- never a name matched against the text -- with the id to read and the name to show for it.
      required:
      - id
      - name
      properties:
        id:
          type: string
        name:
          type: string
      additionalProperties: false
    PlaceDetail:
      type: object
      description: Where one place is (latitude north positive, longitude east positive), the name a reader of the King James Version knows it by, its plain canonical name only where that differs, and when it was founded and fell, each only where recorded.
      required:
      - lat
      - lon
      - display_name
      properties:
        canonical_name:
          type:
          - string
          - 'null'
        destroyed:
          oneOf:
          - $ref: '#/components/schemas/DateClaim'
          - type: 'null'
        display_name:
          type: string
        established:
          oneOf:
          - $ref: '#/components/schemas/DateClaim'
          - type: 'null'
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
      additionalProperties: false
    PlaceRef:
      type: object
      description: 'A place named by something else on this response: its id, to target on the map, the name to show for it, and its node in the graph.'
      required:
      - id
      - name
      - node
      properties:
        id:
          type: string
        name:
          type: string
        node:
          $ref: '#/components/schemas/NodeRef'
      additionalProperties: false
    Point:
      type: array
      items:
        type: number
      description: 'One point of a border: latitude then longitude, in degrees.'
      maxItems: 2
      minItems: 2
    Polities:
      type: object
      description: The polity borders in view for the span of years asked about.
      required:
      - polities
      properties:
        polities:
          type: array
          items:
            $ref: '#/components/schemas/Polity'
      additionalProperties: false
    Polity:
      type: object
      description: One era of one polity's border. The `id` and `color_key` are the polity's and hold across every era row it contributes; the name, the years and the rings belong to this era alone.
      required:
      - id
      - node
      - name
      - from
      - to
      - reign
      - rings
      - color_key
      properties:
        color_key:
          type: integer
          format: int32
          minimum: 0
        fall:
          oneOf:
          - $ref: '#/components/schemas/PolityDelta'
          - type: 'null'
        from:
          type: integer
          format: int32
        id:
          $ref: '#/components/schemas/PolityId'
        name:
          type: string
        node:
          $ref: '#/components/schemas/NodeRef'
        reign:
          $ref: '#/components/schemas/TimeRange'
        rings:
          type: array
          items:
            type: array
            items:
              $ref: '#/components/schemas/Point'
        to:
          type: integer
          format: int32
        transition:
          oneOf:
          - $ref: '#/components/schemas/PolityDelta'
          - type: 'null'
      additionalProperties: false
    PolityDelta:
      type: object
      description: 'The event at one boundary of a polity''s era: its rise, a change of its borders, or its fall.'
      required:
      - event
      - verses
      - ref_note
      properties:
        event:
          type: string
        ref_note:
          type: string
        verses:
          type: array
          items:
            type: string
      additionalProperties: false
    PolityDetail:
      type: object
      description: The years one polity stood, from the first year of its first era to the last year of its last, labelled.
      required:
      - reign
      properties:
        reign:
          $ref: '#/components/schemas/TimeRange'
      additionalProperties: false
    PolityId:
      type: string
      description: The id of one Polity node.
    PositionRef:
      type: object
      description: 'What an edge leads to: a node, or, where one relation grounds another, the edge it grounds. `position` says which shape follows.'
      required:
      - position
      properties:
        position:
          type: string
          enum:
          - node
          - edge
      additionalProperties: true
      discriminator:
        mapping:
          edge: '#/components/schemas/EdgePosition'
          node: '#/components/schemas/NodePosition'
        propertyName: position
    ProvenanceEntry:
      type: object
      description: The join between a provenance id as records carry it and the source that names, describes and licenses it.
      required:
      - id
      - source
      - confidence
      properties:
        confidence:
          $ref: '#/components/schemas/Confidence'
        id:
          type: string
        locator:
          type:
          - string
          - 'null'
        source:
          type: string
      additionalProperties: false
    QuietPlace:
      type: object
      description: A place this atlas knows an event at, drawn on the map but not lit for the span asked about.
      required:
      - id
      - node
      - display_name
      - lat
      - lon
      - total_events
      properties:
        display_name:
          type: string
        existence_from:
          oneOf:
          - $ref: '#/components/schemas/Year'
          - type: 'null'
        existence_to:
          oneOf:
          - $ref: '#/components/schemas/Year'
          - type: 'null'
        id:
          type: string
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        merged_ids:
          type: array
          items:
            type: string
        node:
          $ref: '#/components/schemas/NodeRef'
        total_events:
          type: integer
          format: int32
          minimum: 0
      additionalProperties: false
    Scene:
      type: object
      description: 'The map at one moment of enquiry: which places are lit, which are only present, and which arrows run between them.'
      required:
      - mode
      - places
      - quiet_places
      - arrows
      - narratives
      properties:
        arrows:
          type: array
          items:
            $ref: '#/components/schemas/SceneArrow'
        mode:
          $ref: '#/components/schemas/SceneMode'
        narratives:
          type: array
          items:
            $ref: '#/components/schemas/SceneNarrative'
        places:
          type: array
          items:
            $ref: '#/components/schemas/ScenePlace'
        quiet_places:
          type: array
          items:
            $ref: '#/components/schemas/QuietPlace'
        ref:
          type:
          - string
          - 'null'
        window:
          oneOf:
          - $ref: '#/components/schemas/TimeRange'
          - type: 'null'
      additionalProperties: false
    SceneArrow:
      type: object
      description: 'One leg of a narrative drawn on the map: a movement from one place to the next.'
      required:
      - narrative
      - color
      - from_place
      - to_place
      - from_event
      - to_event
      - order
      properties:
        color:
          type: string
        from_event:
          type: string
        from_place:
          type: string
        narrative:
          type: string
        order:
          type: integer
          format: int32
          minimum: 0
        to_event:
          type: string
        to_place:
          type: string
      additionalProperties: false
    SceneEvent:
      type: object
      description: 'One event at a place: when it happened, and where it is narrated.'
      required:
      - id
      - label
      - when
      - verse_groups
      properties:
        id:
          type: string
        label:
          type: string
        verse_groups:
          type: array
          items:
            $ref: '#/components/schemas/VerseGroup'
        when:
          $ref: '#/components/schemas/TimeRange'
      additionalProperties: false
    SceneMode:
      type: string
      description: ''
      enum:
      - time
      - scripture
    SceneNarrative:
      type: object
      description: One narrative with at least one leg in view.
      required:
      - id
      - name
      - color
      - legs_in_scene
      properties:
        color:
          type: string
        id:
          type: string
        legs_in_scene:
          type: integer
          format: int32
          minimum: 0
        name:
          type: string
      additionalProperties: false
    ScenePlace:
      type: object
      description: One lit place on the map, with the events that light it.
      required:
      - id
      - node
      - name
      - display_name
      - lat
      - lon
      - brightness
      - events
      properties:
        brightness:
          type: integer
          format: int32
          maximum: 255
          minimum: 0
        display_name:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/SceneEvent'
        existence_from:
          oneOf:
          - $ref: '#/components/schemas/Year'
          - type: 'null'
        existence_to:
          oneOf:
          - $ref: '#/components/schemas/Year'
          - type: 'null'
        id:
          type: string
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        merged_ids:
          type: array
          items:
            type: string
        name:
          type: string
        node:
          $ref: '#/components/schemas/NodeRef'
      additionalProperties: false
    SourceCategory:
      type: object
      description: One heading the sources are grouped under.
      required:
      - id
      - label
      properties:
        id:
          type: string
        label:
          type: string
      additionalProperties: false
    SourceEntry:
      type: object
      description: 'One source this atlas is built from: what it is, what was built from it, and how it is licensed.'
      required:
      - id
      - category
      - title
      - what_it_is
      - what_we_built
      - license
      - licenses_row_key
      properties:
        category:
          type: string
        id:
          type: string
        license:
          type: string
        licenses_row_key:
          type: string
        link:
          type:
          - string
          - 'null'
        title:
          type: string
        what_it_is:
          type: string
        what_we_built:
          type: string
      additionalProperties: false
    SourcesDocument:
      type: object
      description: 'Everything this atlas is built from: the sources, the headings they are grouped under, and the ids that tie individual records back to a source.'
      required:
      - categories
      - sources
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/SourceCategory'
        provenances:
          type: array
          items:
            $ref: '#/components/schemas/ProvenanceEntry'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceEntry'
      additionalProperties: false
    Testament:
      type: string
      description: 'Which half of the canon a book belongs to: the Old Testament, or the New.'
      enum:
      - OT
      - NT
    TextPoint:
      type: object
      description: 'A place in a corpus''s text: a unit, and where one word of it is named, that word''s position in the unit''s base text counting from zero; without a word the point is the unit''s own edge, so a span it bounds takes the unit whole.'
      required:
      - unit
      properties:
        unit:
          $ref: '#/components/schemas/TextRef'
        word:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      additionalProperties: false
    TextRef:
      type: object
      description: One unit of a corpus's text, named by the corpus it belongs to.
      required:
      - corpus
      properties:
        corpus:
          type: string
          enum:
          - bible
          - concord
      additionalProperties: true
      discriminator:
        mapping:
          bible: '#/components/schemas/BibleRef'
          concord: '#/components/schemas/ConcordRef'
        propertyName: corpus
    TextScope:
      type: string
      description: ''
      enum:
      - verse
      - chapter
    TextSpan:
      type: object
      description: A stretch of text, from one point through another, both included.
      required:
      - from
      - to
      properties:
        from:
          $ref: '#/components/schemas/TextPoint'
        to:
          $ref: '#/components/schemas/TextPoint'
      additionalProperties: false
    TextUnit:
      type: object
      description: 'One unit of a reading spine: a verse of Scripture, or a paragraph of the Book of Concord.'
      required:
      - ref
      - node
      - body
      - edge_summary
      properties:
        body:
          $ref: '#/components/schemas/UnitText'
        edge_summary:
          type: array
          items:
            $ref: '#/components/schemas/EdgeSummaryEntry'
        heading:
          oneOf:
          - $ref: '#/components/schemas/UnitHeading'
          - type: 'null'
        node:
          $ref: '#/components/schemas/NodeRef'
        ref:
          type: string
      additionalProperties: false
    TextWindow:
      type: object
      description: A window of one corpus's reading spine.
      required:
      - units
      - version
      properties:
        next:
          type:
          - string
          - 'null'
        units:
          type: array
          items:
            $ref: '#/components/schemas/TextUnit'
        version:
          type: string
      additionalProperties: false
    TimeRange:
      type: object
      description: 'A span of years, both ends included, with the label a reader sees for it: an era both ends share is named once, as in `1450 – 1400 BC`, `5 BC – AD 30` or, for a single year, `AD 33`.'
      required:
      - from
      - to
      - label
      properties:
        from:
          $ref: '#/components/schemas/Year'
        label:
          type: string
        to:
          $ref: '#/components/schemas/Year'
      additionalProperties: false
    TimelinePosition:
      type: object
      description: Where an event sits in the atlas's whole chronology, whatever narratives it belongs to.
      properties:
        following:
          oneOf:
          - $ref: '#/components/schemas/NarrativeAdjacentEvent'
          - type: 'null'
        prior:
          oneOf:
          - $ref: '#/components/schemas/NarrativeAdjacentEvent'
          - type: 'null'
      additionalProperties: false
    UnitHeading:
      type: object
      description: 'The pericope heading above a verse: the event or titled passage that covers it, whose label is the heading''s words; `is_continuation` is true where this verse carries on coverage that began in an earlier chapter rather than opening it, so a reader can render it as a continued heading.'
      required:
      - event
      - kind
      - is_continuation
      properties:
        event:
          $ref: '#/components/schemas/NodeRef'
        is_continuation:
          type: boolean
        kind:
          $ref: '#/components/schemas/EventKind'
      additionalProperties: false
    UnitText:
      type: object
      description: 'What a text unit is: where it stands, its words, the words of Christ in it, and what its words stand for, each anchor in reading order.'
      required:
      - locus
      - text
      - words_of_christ
      - anchors
      properties:
        anchors:
          type: array
          items:
            $ref: '#/components/schemas/Anchor'
        locus:
          $ref: '#/components/schemas/TextRef'
        text:
          type: string
        words_of_christ:
          type: array
          items:
            $ref: '#/components/schemas/WordsOfChristSpan'
      additionalProperties: false
    Verse:
      type: object
      description: 'One verse: its text, and what the graph attests at it.'
      required:
      - verse
      - text
      - places
      - persons
      - xref_count
      - words_of_christ
      properties:
        heading:
          oneOf:
          - $ref: '#/components/schemas/Heading'
          - type: 'null'
        persons:
          type: array
          items:
            $ref: '#/components/schemas/PersonRef'
        places:
          type: array
          items:
            $ref: '#/components/schemas/PlaceRef'
        text:
          type: string
        verse:
          type: integer
          format: int32
          minimum: 0
        words_of_christ:
          type: array
          items:
            $ref: '#/components/schemas/WordsOfChristSpan'
        xref_count:
          type: integer
          minimum: 0
      additionalProperties: false
    VerseGroup:
      type: object
      description: A run of verses from one chapter of one book.
      required:
      - book
      - chapter
      - verses
      - count
      properties:
        book:
          type: string
        chapter:
          type: integer
          format: int32
          minimum: 0
        count:
          type: integer
          format: int32
          minimum: 0
        verses:
          type: array
          items:
            type: string
      additionalProperties: false
    WindowDir:
      type: string
      description: |-
        Which way a window runs from the reference it is anchored on: onward from that
        reference, or backward to it.
      enum:
      - onward
      - backward
    WordsOfChristSpan:
      type: object
      description: 'One span of the words of Christ within a verse''s text: character offsets into it, half-open, so the span is the text from `start` up to but not including `end`.'
      required:
      - start
      - end
      properties:
        end:
          type: integer
          minimum: 0
        start:
          type: integer
          minimum: 0
      additionalProperties: false
    Year:
      type: object
      description: A year, negative for BC, with the label a reader sees for it, such as `1447 BC` or `AD 30`.
      required:
      - value
      - label
      properties:
        label:
          type: string
        value:
          type: integer
          format: int32
      additionalProperties: false
    YearSpan:
      type: object
      description: 'A span of years on this atlas''s scale: negative for BC, positive for AD, with no year zero. A single year is a span whose ends are equal.'
      required:
      - from_year
      - to_year
      properties:
        from_year:
          type: integer
          format: int32
        to_year:
          type: integer
          format: int32
      additionalProperties: false
tags:
- name: meta
  description: 'What this server is: whether it is up, the schema versions of the data it answers from, this document itself, and the sources every answer is drawn from.'
- name: map
  description: 'The map: what is in view for a span of years or at a passage, the polity borders and eras behind it, and the coastline and landmarks it is drawn over.'
- name: reading
  description: 'Scripture as it is read: a chapter verse by verse, one verse in full, and the cross references a verse carries.'
- name: catechism
  description: 'The catechism: one item in full, and the items that cite a passage.'
- name: events
  description: 'What happened: one event in full, every narrative this atlas tells, and the narrative legs an event belongs to.'
- name: graph
  description: 'This atlas as a graph: one node''s record, nodes and edges by id many at once, one page of the neighbours of a node or an edge, and a window of a corpus''s reading spine.'
- name: contents
  description: One corpus's table of contents, two levels deep.
x-atlas-relations:
  directed:
  - forward: contains
    forward_display: Contains
    inverse: member-of
    inverse_display: Member of
    name: Contains
  - forward: attested-in
    forward_display: Attested in
    inverse: attests
    inverse_display: Attests
    name: Attests
  - forward: follows-in
    forward_display: Follows in
    inverse: precedes-in
    inverse_display: Precedes in
    name: Succession
  - forward: dated-by
    forward_display: Dated by
    inverse: dates
    inverse_display: Dates
    name: DatedBy
  - forward: located-at
    forward_display: Located at
    inverse: site-of
    inverse_display: Site of
    name: LocatedAt
  - forward: mentions
    forward_display: Mentions
    inverse: mentioned-in
    inverse_display: Mentioned in
    name: Mentions
  - forward: cites
    forward_display: Cites
    inverse: cited-by
    inverse_display: Cited by
    name: Cites
  - forward: quotes
    forward_display: Quotes
    inverse: quoted-by
    inverse_display: Quoted by
    name: Quotes
  - forward: confesses
    forward_display: Confesses
