atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): 1 Peter 1:13-21, the charge 'be ye holy in all manner of conversation,' redeemed not with silver or gold 'but with the precious blood of Christ, as of a lamb without blemish.'"

