# --- region (18) -----------------------------------------------------------
#
# The first 3 are the original, local (sub-region-scale) curated set --
# unchanged, no `size` hint, NEAR-tier-only per their existing zoom rule
# (WORLD-10/WORLD-12 pin this). The 15 after them are Batch C2's "populated
# far field" (design-direction.md's SECOND ADDENDUM): broad standing
# regions/waters/islands spread across the WHOLE biblical-world lock, not
# just the Levant core the first 19 entries already covered -- each one
# carries a `size` hint so it renders tier-0 (visible even zoomed all the
# way out; see the header comment above). None collides by NAME with any
# currently-lit place OR any historical-border polity feature close enough
# to read as the same real-world thing twice (checked by hand at the time
# against data/compiled/places.json and every data/curated/borders/*.geojson
# feature's own `name` -- see the batch report for the full cross-check;
# Batch B2 later replaced data/curated/borders/ with data/curated/polities/,
# unrelated to this check's own original cross-referenced set);
# where a candidate name DID already exist as a real geocoded place (most
# of them, per Theographic's own Table-of-Nations-style entries), its
# coordinate is reused verbatim, same "reuse a real geocoded coordinate"
# policy as the header comment already states for the original 19 -- this
# also means the existing landmark/lit-place dedupe (map.js's
# isDedupedByLitPlace) correctly yields to that SAME place whenever an
# event actually lights it, exactly as design-direction.md intends
# ("lit places always win... context, never competition").

[[landmark]] # places.json slug "sinai_1098" (the generic "Sinai" geocoded record --
# chosen over "wilderness-of-sinai", which coincides exactly with mount-sinai's
# point in this dataset, so the region label doesn't stack on the mountain's)
name = "Wilderness of Sinai"
kind = "region"
lat = 29.500000
lon = 34.000000

[[landmark]] # places.json slug "arabah"
name = "Arabah"
kind = "region"
lat = 30.416944
lon = 35.151389

[[landmark]] # places.json slug "negeb" (spelled "Negeb" in the source data;
# "Negev" is the standard modern English spelling, used here as the display name)
name = "Negev"
kind = "region"
lat = 31.244722
lon = 34.840833

