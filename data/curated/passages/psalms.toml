# Batch W3 (whole-Bible titled verse containers, third run: Job-Song of
# Solomon). Psalms, in the SAME `[[event]]` schema `events-extra.toml` uses --
# see `data/curated/passages/genesis.toml`'s own header comment for the full
# reconciliation/provenance framing.
#
# GRANULARITY (the brief's own explicit requirement): one container per
# Psalm, titled from the KJV's OWN superscription where one exists
# (`kjv_superscription` provenance -- 114 psalms here, plus Psalm 119's own
# 22 acrostic stanza headers below), else this project's own faithful,
# quiet CC0 description of the psalm's actual content (`atlas_section`
# provenance -- 33 psalms, the traditional "orphan" psalms with no heading
# verse of their own). ALL 150 Psalms are GENERAL-kind (poetry is the
# brief's own honest default; no traditional narrative date attaches to a
# psalm AS a psalm, distinct from the historical events some superscriptions
# name, which already carry their own dates on their own narrative
# containers elsewhere in this app).
#
# RECONCILIATION (checked against the real compiled `events.json` before
# authoring): exactly three pre-existing events touch Psalms, all from
# earlier batches' own req-1b parallel work, none a per-Psalm Theographic
# freebie (Theographic itself models no individual-Psalm "event" at all --
# verified, so no `psalms-sections.toml` merge-file sibling to
# `atlas-sections.toml` was needed; every container below is a brand-new
# `[[event]]` row):
#   - `sam2_davids_song` (Batch W2) carries a witness anchoring PSA.18.1 (all
#     50 verses of Psalm 18) -- Psalm 18 is SKIPPED here (no psa_018) to avoid
#     a real within-layer anchor collision at that exact anchor verse; fully
#     covered and correctly parallel-witnessed already, per the SAME
#     "scope away from an existing witness's own anchor" precedent Batch W2's
#     own report disclosed for the Ezra 2 / Nehemiah 7 case.
#   - `1ch_davids_hymn_of_praise` (Batch W2) carries a witness whose own
#     verses list opens at PSA.96.1 (spanning fragments of Psalms 96, 105, and
#     106 as ONE witness row) -- so ONLY that anchor (96.1) is claimed; Psalm
#     96 is SKIPPED here for the same collision-avoidance reason (its own 13
#     verses are ALL within that witness's own quoted range, so fully
#     covered already). Psalms 105 and 106 are NOT skipped -- that witness
#     only quotes short fragments of each (105:1-15; 106:1,47-48), so both
#     still need, and here receive, their own full-coverage containers; their
#     own first verses (105.1, 106.1) are never claimed by that witness's own
#     single anchor (96.1), so no collision.
#
# PARALLELS (req 1b, this run's own named cases): Psalm 14 <-> Psalm 53 (both
# WITHIN Psalms) is authored below as ONE host container, `psa_014`, carrying
# two witness rows in `event-witnesses.toml` (self PSA.14 + parallel PSA.53)
# -- Psalm 53 is SKIPPED here (no psa_053) for the identical collision-
# avoidance reason as Psalms 18/96 above: once psa_014 carries ANY witness,
# `heading_anchors_for` draws its own anchors ONLY from witnesses (the "72-row
# lesson"), so a separate psa_053 top-level container would claim the exact
# same PSA.53.1 anchor psa_014's own witness already claims. Both psalms are
# nearly word-for-word identical (both open "The fool hath said in his heart,
# There is no God"), a literary-structure fact (two textually distinct
# pericopes), not textual criticism. Fix round 1 (Important-1,
# batch-w3-review.md): psa_014's own title is THIS shared opening clause,
# not either psalm's own distinct superscription tag -- see psa_014's own
# entry below for the full reasoning (a shared container's own displayed
# title must be true at every anchor it heads, controller ruling).
#
# PSALM 119 (the acrostic): NOT nested under a single whole-psalm container --
# `heading_anchors_for` (server/atlas-core/src/data.rs) draws a real
# container's own anchor(s) from its witnesses if any exist, else from the
# FIRST verse of its own top-level `verses` in curated order; a single
# whole-Psalm-119 container's own anchor would necessarily be PSA.119.1,
# identical to the Aleph stanza's own anchor below -- an unavoidable real
# within-layer anchor collision under this app's own current single-decisive-
# heading architecture (confirmed by reading the collision-detection code
# directly before deciding, not assumed). Authored instead as 22 SIBLING
# containers, one per 8-verse acrostic stanza (1-8 Aleph, 9-16 Beth, ...
# 169-176 Tau), a clean partition with zero overlap -- each stanza's own
# Hebrew-letter heading IS literal KJV text (verified: every one of the 22
# stanza-opening verses in the compiled text carries its own transliterated
# letter name as a heading, e.g. PSA.119.1 = "ALEPH. Blessed are the
# undefiled..."), so `kjv_superscription` provenance applies here too, though
# these are acrostic structure markers, not authorial/occasion superscriptions
# like Psalm 3's -- disclosed explicitly, not conflated. This is the judgment
# call the brief's own "your call, documented" invites for Psalm 119;
# batch-w3-report.md has the full reasoning.

