verses = ["AMO.7.4-6"]
atlas_section = "Amos pericope (this project's own sectioning, CC0): Amos 7:4-6, the Lord shews Amos a fire that devours the great deep; Amos again intercedes, and the Lord again repents."
ref_note = "GENERAL-kind, per this file's own header note. Second of five visions."

[[event]]
id = "amo_vision_of_the_plumbline"
label = "The third vision: the plumbline"
kind = "general"
verses = ["AMO.7.7-9"]
atlas_section = "Amos pericope (this project's own sectioning, CC0): Amos 7:7-9, the Lord standing upon a wall made by a plumbline -- 'I will set a plumbline in the midst of my people Israel: I will not again pass by them any more' -- the high places of Isaac laid waste, and judgment on the house of Jeroboam."
ref_note = "GENERAL-kind, per this file's own header note. Third of five visions -- this is the first vision the text itself no longer records the Lord repenting of."

[[event]]
id = "amo_amaziah_confronts_amos"
label = "Amaziah the priest of Beth-el confronts Amos; Amos's own defense"
kind = "event"
from_year = -788
to_year = -788
places = ["bethel-1"]
verses = ["AMO.7.10-17"]
atlas_section = "Amos pericope (this project's own sectioning, CC0): Amos 7:10-17, a real narrated confrontation (not a pure oracle) -- Amaziah the priest of Beth-el accuses Amos before Jeroboam and orders him to flee to Judah; Amos's own defense, 'I was no prophet, neither was I a prophet's son; but I was an herdman... and the Lord took me as I followed the flock,' followed by his own sentence against Amaziah."
ref_note = "Date interpolated from the pre-existing theo-205 ('Prophecies of Amos,' -788). Place: Beth-el, explicit (7:10, 7:13) -- geo disambiguation per this file's own header note."

[[event]]
id = "amo_vision_of_the_summer_fruit"
