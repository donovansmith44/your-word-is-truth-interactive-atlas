# Batch HOTFIX-6 (graph-wide chronology audit): the ERA-WINDOW VALIDATOR's
# own per-book input -- for every one of the 66 canonical books, the widest
# span its own narrative NARRATES (never the span it was WRITTEN in, which
# for several prophetic/epistolary books is nearly a single year while the
# narrated ministry itself runs decades -- and never a claim about
# authorship date, which this project's inerrancy doctrine does not
# adjudicate here). Derived from atlas-core::chronology::book_narration_window
# doc comment's own worked examples (GEN wide and honest, 1SA tight) and
# cross-checked against the real compiled data (server/atlas-etl/examples/
# chronology_probe.rs, run against data/compiled/, before this file was
# written -- see batch-hotfix6-report.md for the full derivation table).
#
# Every dated event's own year must fall inside the window of EVERY witness
# book it claims, UNLESS the specific citing verse falls in a curated
# RECOUNTING chapter (atlas_core::chronology::RECOUNTING_CHAPTERS -- 1
# Chronicles 1-9's genealogies, Luke 3's and Matthew 1's genealogies,
# Hebrews 11's "by faith" roll call, Acts 7's Stephen speech) or the event is
# individually EXEMPTED (atlas_core::chronology::WINDOW_EXEMPTIONS, the
# EVENT_DISTINCT_PAIRS-style pressure valve, per-entry reasons) -- see
# CONTRACT.md's own ERA-WINDOW VALIDATOR note for the full design.
#
# Books with ZERO dated events today (mostly the shorter NT epistles) still
# carry a real, defensible traditional window -- forward-compatible per the
# controller's own "single-feed chronology" note: a future event citing one
# of these books is checked against a real boundary from the day it is
# authored, not a silent gap. These windows lean WIDE (a book's own claimed
# ministry/office span per its introductory verse, not one narrow guess) --
# a book earns a TIGHT window only where this project's own real content
# already demonstrates one (1SA, 2SA, 1CH, the Gospels).

