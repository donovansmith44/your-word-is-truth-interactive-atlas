# Batch W1 (whole-Bible titled verse containers). Judges, in the SAME
# `[[event]]` schema `events-extra.toml` uses -- see
# `data/curated/passages/genesis.toml`'s own header comment for the full
# reconciliation/provenance framing.
#
# RECONCILIATION: 21 pre-existing events already touch Judges (the full
# theo-67/134-154 judge-by-judge chain) -- 331/618 verses (54%). This
# batch's own gap analysis found 9 remaining ranges: the book's own
# introduction (1:1-3:6, largely a summary/list, not narrative), Shamgar
# (3:31, a bare one-verse notice Theographic never covers), the Samson
# narrative's own real scenes (13-16, where the pre-existing theo-148/153
# events are unusually SPARSE -- wide nominal ranges, few actual verses,
# e.g. theo-148 "Philistine Dominion" spans 13:1-15:20 but touches only
# 4 real verses), and the whole appendix (17-21, Micah's idols, the
# Danites' migration, the Levite's concubine, and the war against
# Benjamin -- material Theographic's own dated-event set does not reach
# at all).
#
# A pre-existing DATA-QUALITY finding, disclosed (not this batch's own to
# fix): theo-67 ("Judgeship of Jair," JDG.10.3-5) is dated -1992 BC --
# centuries before Abraham's own birth (theo-65, -1997, essentially
# concurrent) and nearly a thousand years before the judges period
# itself (theo-134 onward, -1418 to -1102) -- almost certainly a
# Theographic upstream data error (a wildly implausible date for a judge
# whose own text places him after Ehud/Deborah, chronologically). Left
# unmodified (a raw-data/import concern, out of this batch's own
# authoring scope, the same disposition as theo-129's own disclosed
# GEN.34.1 anomaly, deuteronomy.toml's own header) -- flagged in
# batch-w1-report.md.
#
# GRANULARITY/CHRONOLOGY: the book's own introduction and Samson's own
# narrative are event-kind, dated against the surrounding judge-chain's
# own established years (theo-133's own -1424 for the introduction;
# theo-148/154's own -1141/-1102 bracketing Samson). The appendix
# (17-21) is deliberately general-kind -- its own famous chronological
# looseness ("in those days there was no king in Israel," repeated
# without a judge-era anchor) is a genuine, disclosed dating uncertainty,
# not fabricated to fit anywhere in the judge sequence.

[[event]]
id = "jdg_incomplete_conquest"
label = "Israel's own incomplete conquest after Joshua"
kind = "general"
verses = ["JDG.1.1-36"]
atlas_section = "Judges code unit (this project's own sectioning, CC0 -- no external PD source claimed): Judges 1, each tribe's own partial success and failure to drive out the Canaanites after Joshua's death."
ref_note = "General-kind: a tribe-by-tribe summary list, not one narrative moment."

[[event]]
id = "jdg_bochim_rebuke"
label = "The angel's own rebuke at Bochim"
from_year = -1424
to_year = -1424
places = ["bochim"]
verses = ["JDG.2.1-7"]
atlas_section = "Judges pericope (this project's own sectioning, CC0 -- no external PD source claimed): Judges 2:1-7, the angel of the LORD's own rebuke for the covenant broken, Israel's own weeping at Bochim, and Joshua's own generation recalled."
ref_note = "Same traditional year as theo-133 ('Death of Joshua'), the surrounding context. Place: Bochim, explicit (2:1, 2:5)."

[[event]]
id = "jdg_apostasy_cycle"
label = "The cycle of apostasy in the days of the judges"
kind = "general"
verses = ["JDG.2.9-15"]
atlas_section = "Judges code unit (this project's own sectioning, CC0 -- no external PD source claimed): Judges 2:9-15, the generation that knew not the LORD, and the recurring pattern of apostasy, oppression, and deliverance that structures the whole book."
ref_note = "General-kind: a theological/structural summary spanning the whole judges period, no single dateable moment of its own."

[[event]]
id = "jdg_nations_left_shamgar"
label = "The nations left to test Israel; Shamgar's own deliverance"
kind = "general"
verses = ["JDG.3.1-6", "JDG.3.31"]
atlas_section = "Judges code unit (this project's own sectioning, CC0 -- no external PD source claimed): Judges 3:1-6, the nations left to test Israel and by which to teach war, and Judges 3:31, Shamgar's own brief, undated deliverance with an ox goad."
ref_note = "General-kind: Shamgar's own exact year is not independently stated in the text (he falls between Ehud, theo-137, -1361, and Deborah, theo-139, -1278, but no verse dates him precisely) -- disclosed rather than fabricated."

[[event]]
id = "jdg_birth_of_samson"
label = "The birth of Samson"
from_year = -1141
to_year = -1141
places = ["zorah"]
verses = ["JDG.13.1-25"]
atlas_section = "Judges pericope (this project's own sectioning, CC0 -- no external PD source claimed): Judges 13, the angel of the LORD's own appearance to Manoah and his wife, and the birth of Samson the Nazarite."
ref_note = "Matches theo-148's own -1141 BC ('Philistine Dominion,' this same chapter's own opening verse, 13:1). Place: 'Zorah, of the family of the Danites' (13:2), explicit."

[[event]]
id = "jdg_samson_marriage_riddle"
label = "Samson's own marriage; the riddle of the lion and the honey"
from_year = -1135
to_year = -1135
places = ["timnah-1"]
verses = ["JDG.14.1-20"]
atlas_section = "Judges pericope (this project's own sectioning, CC0 -- no external PD source claimed): Judges 14, Samson's own marriage to the woman of Timnath, the lion slain, the riddle of the honey in the carcase, and its own answer betrayed."
ref_note = "Placed within Samson's own twenty-year judgeship (13:1-16:31, -1141 to -1102), a traditional interpolation, not independently attested to a precise year. Place: 'Timnath' (14:1), explicit."

[[event]]
id = "jdg_samson_burns_fields_jawbone"
label = "Samson burns the Philistines' own fields; the jawbone of an ass"
from_year = -1130
to_year = -1130
places = ["timnah-1"]
verses = ["JDG.15.1-20"]
atlas_section = "Judges pericope (this project's own sectioning, CC0 -- no external PD source claimed): Judges 15, Samson's own foxes and firebrands, the burnt fields, his own great slaughter of the Philistines with a fresh jawbone, and his own twenty years judging Israel."
ref_note = "Same traditional interpolation as jdg_samson_marriage_riddle, shortly after. Place: continues from Timnath (15:1); the actual slaughter is at Lehi (15:9-19, not independently mapped in this atlas's own compiled place set)."

[[event]]
id = "jdg_samson_delilah_death"
label = "Samson and Delilah; his own death at Gaza"
from_year = -1102
to_year = -1102
places = ["gaza"]
verses = ["JDG.16.1-31"]
atlas_section = "Judges pericope (this project's own sectioning, CC0 -- no external PD source claimed): Judges 16, Samson at Gaza, Delilah's own betrayal, his own eyes put out, and his own death pulling down the temple of Dagon -- see also theo-154's own pre-existing account of the temple's own destruction, unmodified, this SAME climactic scene."
ref_note = "Matches theo-154's own -1102 BC. Place: Gaza, explicit (16:1, 16:21)."

[[event]]
id = "jdg_micah_idols_danites"
label = "Micah's own idols; the Danites migrate north"
kind = "general"
verses = ["JDG.17.1-13", "JDG.18.1-31"]
atlas_section = "Judges pericope (this project's own sectioning, CC0 -- no external PD source claimed): Judges 17-18, Micah's own household shrine and hired Levite, and the tribe of Dan's own migration north, taking Micah's own idols and priest with them."
ref_note = "General-kind: the book's own appendix material is famously loose chronologically (no judge-era anchor is given for it in the text itself) -- a genuine, disclosed dating uncertainty, not fabricated to fit anywhere in the judge sequence."

[[event]]
id = "jdg_levites_concubine_benjamin_war"
label = "The Levite's own concubine; the war against Benjamin"
kind = "general"
verses = ["JDG.19.1-30", "JDG.20.1-48", "JDG.21.1-25"]
atlas_section = "Judges pericope (this project's own sectioning, CC0 -- no external PD source claimed): Judges 19-21, the outrage at Gibeah, the concubine's own death, the tribes' own war against Benjamin, and the provision of wives for Benjamin's own surviving remnant -- closing the book, 'every man did that which was right in his own eyes' (21:25)."
ref_note = "General-kind, same disclosed dating-uncertainty reasoning as jdg_micah_idols_danites."
