# --- Passion Week ---
# Batch T (batch-t-brief.md): CHRONOLOGY ANCHOR -- AD 33 Passion (Nisan 14,
# April 3, AD 33 traditional; the owner's own binding ruling). Every event
# below is re-dated 30 -> 33 (see jm_jordan's own comment, further up, for
# the uniform +3-year shift applied to the whole ministry timeline so it
# stays internally consistent with this anchor). `order_key` gives each leg
# an explicit sub-year (day-of-week) position within the SAME traditional
# year -- this app's own Year model is year-granular, so a fake year offset
# is not an option (req 2, verbatim) -- following the traditional Holy Week
# schedule (Palm Sunday through the Ascension) that has broad, longstanding
# confessional-Lutheran acceptance: Sunday (entry), Monday (temple
# cleansing, Mark 11:12 "on the morrow" dates it explicitly), Wednesday
# (the anointing dinner -- kept at John 12:1's own explicit "six days
# before the passover" placement, i.e. immediately BEFORE the triumphal
# entry in leg order below, not Robertson's own Wed-of-Passion-Week
# section numbering, a more contested harmonization choice this batch
# declines to adopt -- see batch-t-report.md's own disclosed reasoning),
# Thursday night (Gethsemane), Friday (Golgotha), Sunday (resurrection,
# Emmaus), later in Galilee, and the Ascension 40 days after the
# resurrection (Acts 1:3).
#
# places: same bethany-1 as jm_bethany above (the Jerusalem-area Bethany,
# not "Bethany beyond Jordan").
[[event]]
id = "pw_bethany"
label = "Mary anoints Jesus at Bethany"
from_year = 33
to_year = 33
places = ["bethany-1"]
verses = ["JHN.12.1-11"]
order_key = 10
robertson_section = "Robertson (1922) §141, \"At the Feast in the House of Simon the Leper Mary of Bethany Anoints Jesus for His Burial\""
ref_note = "John 12:1-11, Matthew 26:6-13, Mark 14:3-9 all read directly (see event-witnesses.toml); dated per John 12:1's own explicit 'six days before the passover', kept ahead of the triumphal entry rather than Robertson's own Wednesday placement (a real, disclosed harmonization choice -- see batch-t-report.md)"
[[event]]
id = "pw_jerusalem_entry"
label = "The triumphal entry into Jerusalem"
from_year = 33
to_year = 33
places = ["jerusalem"]
verses = ["MAT.21.1-11"]
order_key = 20
robertson_section = "Robertson (1922) §128b, \"His Triumphal Entry into Jerusalem as the Messiah\""
ref_note = "Matthew 21:1-11, Mark 11:1-11, Luke 19:29-44, John 12:12-19 all read directly (see event-witnesses.toml)"
# Batch T requirement 5/7 (req 7's own "chronological-vs-reading-order" test):
# the SECOND of the two temple cleansings (see jm_temple_cleansing's own
# comment, further up, for the first) -- narrated by Matthew, Mark, and
# Luke, but NOT John, who already told his own distinct early-ministry
# cleansing back in John 2 and does not repeat it here. This is precisely
# why pw_jerusalem_entry's own chronological FOLLOWING (this event) is NOT
