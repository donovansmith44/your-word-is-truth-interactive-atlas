kind = "general"
verses = ["EPH.3.14-21"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Ephesians 3:14-21, Paul's own prayer that they be 'strengthened with might by his Spirit in the inner man,' 'rooted and grounded in love,' closing on the doxology 'unto him that is able to do exceeding abundantly above all that we ask or think.'"

[[event]]
id = "eph_the_unity_of_the_spirit_and_gifts_for_the_body"
