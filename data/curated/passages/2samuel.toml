places = ["hebron"]
verses = ["2SA.5.1-5"]
atlas_section = "2 Samuel pericope (this project's own sectioning, CC0): 2 Samuel 5:1-5, all the tribes of Israel come to David at Hebron, his own covenant with the elders, and his anointing as king over all Israel, closing with the reign-length summary (7 years 6 months in Hebron, 33 in Jerusalem)."
ref_note = "1 Chronicles parallel per Crockett's Harmony of Samuel, Kings, and Chronicles (1897) Book Third Part II section 76: 1 Chronicles 11:1-3 -- witness row to be added with 1chronicles.toml's own coverage (see this file's own header note)."

