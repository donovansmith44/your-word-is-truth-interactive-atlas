[[event]]
id = "2pe_the_character_and_end_of_false_teachers"
label = "The character and end of the false teachers: the way of Balaam; the dog and the sow"
kind = "general"
verses = ["2PE.2.10-22"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): 2 Peter 2:10-22, the false teachers' own presumption and greed described at length -- 'the way of Balaam... wells without water' -- closing on the proverb, 'the dog is turned to his own vomit again; and the sow that was washed to her wallowing in the mire.'"

[[event]]
id = "2pe_scoffers_in_the_last_days"
label = "Scoffers in the last days; the day of the Lord as a thief in the night"
kind = "general"
verses = ["2PE.3.1-10"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): 2 Peter 3:1-10, the warning that 'scoffers' will come denying Christ's own promised coming, the flood as the pattern of the world's own former judgment by water, and the day of the Lord which 'will come as a thief in the night.'"

[[event]]
id = "2pe_new_heavens_and_a_new_earth"
