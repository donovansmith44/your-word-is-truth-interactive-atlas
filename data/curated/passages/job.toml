# Batch W3 (whole-Bible titled verse containers, third run: Job-Song of
# Solomon). Job, in the SAME `[[event]]` schema `events-extra.toml` uses --
# see `data/curated/passages/genesis.toml`'s own header comment for the
# full reconciliation/provenance framing.
#
# RECONCILIATION (checked against the real compiled `events.json` before
# authoring, per the brief's own explicit instruction to check Job's
# narrative frame against theo-* events first): THREE pre-existing bare
# Theographic events touch this book -- `theo-108` ("Lifetime of Job,"
# GEN.46.13 + JOB.42.16-17, -1720), `theo-117` ("Job's Trial," ALL 1070
# verses of the book in one mega-span, -1650), and `theo-119` ("Death of
# Job," JOB.42.16-17, -1580). All three are LAYER-0 (no witnesses, no
# robertson/acts/atlas_section) -- none is heading-worthy today, and none
# is touched by this file: `theo-117`'s own mega-span is the "multi-scene
# mega-span, not worth a single misleading heading" case this project has
# already established a disposition for (batch-w1-report.md), and every
# one of the 30 finer pericope containers below stays well under the
# EVENT_MERGE_PAIRS/EVENT_DISTINCT_PAIRS 0.8-verse-set-jaccard sweep floor
# against all three (the largest, job_final_defense, is 96/1070 = 0.09
# against theo-117; the closest to a small stub, job_epilogue_restoration,
# is 11/11 verses shared with theo-119's own 2 but a union of 11, jaccard
# 0.18 -- deliberately kept a whole natural prose unit, never narrowed to
# theo-119's own bare 2-verse stub, precisely so no near-duplicate is ever
# created). `theo-117`'s own -1650 anchor and `theo-119`'s own -1580 are
# reused (interpolated, never re-derived) for this file's own three
# EVENT-kind containers below; the remaining 27 containers cover Job's own
# poetic dialogue (chapters 3-42:6), GENERAL-kind per the brief's own genre
# guidance ("poetry... is the honest default"), no fabricated date.
#
# GRANULARITY: standard, non-controversial literary-structure divisions
# (who is speaking, in which chapters) -- three friends' three speech
# cycles, Elihu's four speeches, the Lord's two speeches, Job's own
# replies -- a natural-unit decomposition, the same class of fact this
# project's own doctrine note permits ("literary-structure facts... two
# textually distinct pericopes"), not textual criticism. PLACE: "the land
# of Uz" (1:1) throughout, the pre-geocoded `uz` place (30.745843,
# 35.603919) -- the narrative's own anchor place regardless of which
# distant homeland each of the three friends is separately named from
# (Teman/Shuah/Naamah), since the action itself never leaves Job's own
# dwelling in Uz.

# --- Prologue (prose, EVENT-kind) ------------------------------------

[[event]]
id = "job_prologue_calamities"
label = "Job's character and wealth; the first heavenly council; his calamities"
from_year = -1650
to_year = -1650
places = ["uz"]
verses = ["JOB.1.1-22"]
atlas_section = "Job pericope (this project's own sectioning, CC0 -- no external PD source claimed): Job 1, Job's own blamelessness and wealth described, the first council in heaven where Satan is given leave to test him, and the loss of Job's oxen, sheep, camels, servants, and all ten children in one day -- closing on 'the Lord gave, and the Lord hath taken away; blessed be the name of the Lord.'"
ref_note = "Date interpolated from the pre-existing theo-117 ('Job's Trial,' -1650), which spans this whole book as one bare mega-span (this project's own sectioning row above promotes only this finer prologue container, not theo-117 itself -- see this file's own header note). Place: 'the land of Uz' (1:1), explicit."

[[event]]
id = "job_affliction_and_friends"
label = "The second heavenly council; Job's own affliction with boils; his three friends arrive"
from_year = -1650
to_year = -1650
places = ["uz"]
verses = ["JOB.2.1-13"]
atlas_section = "Job pericope (this project's own sectioning, CC0): Job 2, the second council in heaven, Job smitten with sore boils from head to foot, his wife's counsel to 'curse God, and die,' and the arrival of Eliphaz, Bildad, and Zophar, who sit with him seven days and seven nights in silence."
ref_note = "Same traditional year as job_prologue_calamities, immediately following. Place: Uz, unchanged."

# --- Job's opening lament (poetry, GENERAL-kind) ----------------------

[[event]]
id = "job_first_lament"
label = "Job curses the day of his birth"
kind = "general"
verses = ["JOB.3.1-26"]
atlas_section = "Job pericope (this project's own sectioning, CC0): Job 3, Job's own opening lament after the seven days of silence -- 'Let the day perish wherein I was born' -- and his longing for the rest of death."
ref_note = "GENERAL-kind: poetry, no date of its own, per this file's own header note."

