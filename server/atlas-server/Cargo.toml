[package]
name = "atlas-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "atlas-server"
path = "src/main.rs"

[dependencies]
atlas-contract = { path = "../atlas-contract" }
atlas-graph = { path = "../atlas-graph" }
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[features]
# CONTRACT-1a: `cargo run -p atlas-server --features dev-docs` serves the
# Swagger UI; a released build has no docs page.
dev-docs = ["atlas-contract/dev-docs"]
