  /api/node/{id}:
    get:
      tags:
      - graph
      summary: 'One node of the graph at a glance: what it is, what to call it, where it came from, and how many neighbours it has of each kind.'
      description: |-
        `{id}` is `Kind:identifier` -- `Place:hazor-1`, `Event:ab_ur`,
        `Person:aaron_1` -- or `text-unit:BOOK.CHAPTER.VERSE` for a verse of
        Scripture and `text-unit:BoC PART.ARTICLE.PARAGRAPH` for a paragraph of the
        Book of Concord. An id of no recognised kind is `bad_ref`; one that names no
        node is `not_found`.
      operationId: node_record
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeRecord'
        '400':
          description: The reference, window or query could not be read; the body's `code` is `bad_ref`.
