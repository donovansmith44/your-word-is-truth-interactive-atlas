kind = "general"
verses = ["ROM.12.1-8"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 12:1-8, the letter's own pivot from doctrine to exhortation -- presenting the body 'a living sacrifice,' the renewing of the mind, and the gifts given 'according to the grace' of each member."

[[event]]
id = "rom_marks_of_true_love"
