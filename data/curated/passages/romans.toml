kind = "general"
verses = ["ROM.9.6-29"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 9:6-29, God's own word not made void though 'they are not all Israel, which are of Israel' -- Isaac and Ishmael, Jacob and Esau, and the potter's own right over the clay."

[[event]]
id = "rom_israels_stumbling_and_the_nearness_of_the_word"
label = "Israel's stumbling at the stumblingstone; the nearness of the word, and salvation for whosoever calls on the Lord"
kind = "general"
verses = ["ROM.9.30-33", "ROM.10.1-13"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 9:30-10:13, one sustained argument spanning the chapter break -- Israel's own pursuit of righteousness by works caused them to stumble where Gentiles who did not pursue it attained it by faith, and 'whosoever shall call upon the name of the Lord shall be saved.'"

[[event]]
id = "rom_how_shall_they_hear_without_a_preacher"
label = "How shall they hear without a preacher? Israel's own unbelief despite a full witness"
kind = "general"
verses = ["ROM.10.14-21"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 10:14-21, the necessity of a sent preacher for saving faith, and Israel's own persistent unbelief despite the gospel's own worldwide sound."

[[event]]
id = "rom_a_remnant_according_to_grace"
label = "A remnant according to the election of grace"
kind = "general"
verses = ["ROM.11.1-10"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 11:1-10, God has not cast away his people -- a present remnant, on the pattern of the seven thousand who had not bowed to Baal in Elijah's own day."

[[event]]
id = "rom_the_wild_olive_tree"
label = "The wild olive tree: Israel's own fall, the fulness of the Gentiles, and Israel's own future mercy"
kind = "general"
verses = ["ROM.11.11-32"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 11:11-32, the allegory of the wild olive branch graffed in among the natural branches, a warning against Gentile boasting, and the mystery that 'all Israel shall be saved.'"

[[event]]
id = "rom_doxology_the_riches_of_gods_wisdom"
