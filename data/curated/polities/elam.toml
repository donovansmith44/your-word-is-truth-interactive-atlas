# elam.toml -- Elam; shapes are approximate, drawn for recognizability.
id = "elam"

# Elam (Genesis 14's "Chedorlaomer king of Elam"; later a Persian-adjacent
# power): southwest Iran around Susa, in the Zagros foothills east of the
# Tigris/Euphrates lowlands -- one long-lived footprint from the earliest
# Sumerian-era city-states through to its absorption into Achaemenid
# Persia, whose own imperial core succeeds it (Susa becomes an Achaemenid
# capital).
[[era]]
name = "Elam"
from = -4004
to = -539
ref_note = "drawn from general historical-geography knowledge of Elam's southwest-Iran core around Susa; no specific source consulted this session"
rings = [
