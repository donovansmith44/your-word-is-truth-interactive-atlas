              schema:
                $ref: '#/components/schemas/Contract'
  /api/elements:
    get:
      tags:
      - graph
      summary: Nodes and edges of the graph by id, many in one request, each answered in the order asked.
      description: '`ids` lists node ids (the form `/api/node/{id}` takes) and edge ids (the id an edge page carries for its edge), separated by commas: `ids=Event:ab_ur,LocatedAt:…`. Each id is answered by its own record, or by `missing` where it reads as an id but names nothing. One id that does not read as a node''s or an edge''s refuses the whole read as `bad_ref`, as does asking for none; more than 200 at once is `too_many`.'
      operationId: elements
      parameters:
      - name: ids
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
          maxItems: 200
          minItems: 1
        style: form
        explode: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElementPage'
        '400':
          description: The reference, window or query could not be read; the body's `code` says which (`bad_ref`, `too_many`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Nothing in this atlas answers to that reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: The request was well formed but this atlas's own data for it is incomplete.
