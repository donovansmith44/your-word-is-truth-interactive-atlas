atlas_section = "Zechariah pericope (this project's own sectioning, CC0): Zechariah 13, a fountain opened to the house of David for sin and uncleanness, idols and false prophets cut off from the land, and the Lord's own sword called against 'my shepherd, and against the man that is my fellow: smite the shepherd, and the sheep shall be scattered' -- closing on a third of the people refined as silver through the fire."
ref_note = "GENERAL-kind, per this file's own header note."

[[event]]
id = "zec_the_day_of_the_lord_and_living_waters"
label = "The day of the Lord: living waters flow from Jerusalem, and the Lord is king over all the earth"
kind = "general"
verses = ["ZEC.14.1-21"]
atlas_section = "Zechariah pericope (this project's own sectioning, CC0): Zechariah 14, the book's own closing apocalyptic vision -- Jerusalem besieged, the Lord's own feet standing on the mount of Olives, which cleaves in two; living waters flowing out from Jerusalem toward both seas; the Lord king over all the earth; and the surviving nations going up year by year to keep the feast of tabernacles, closing on 'HOLINESS UNTO THE LORD' upon the very bells of the horses."
ref_note = "GENERAL-kind, per this file's own header note."
