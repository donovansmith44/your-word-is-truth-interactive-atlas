# alexander-empire.toml -- Empire of Alexander the Great; shapes are
# approximate, drawn for recognizability.
id = "alexander-empire"

# Alexander's empire at its brief height: Macedon/Greece (a SEPARATE,
# disjoint ring -- connected to Anatolia in reality only by the narrow
# Hellespont crossing, so drawing the two as adjacent-but-technically-
# disjoint rings costs almost nothing in accuracy at this coarse scale, and
# avoids threading one single ring through the same Aegean/Anatolia corner
# twice, which self-intersected on the first attempt) plus the whole
# conquered Achaemenid Persian realm (see persia.toml -- the two share
# almost the same eastern/southern footprint, since Alexander simply took
# Persia whole). Daniel's own "third kingdom of brass" (Daniel 2, 7, 8).
# Dissolves into the Diadochi successor kingdoms (Ptolemaic Egypt, Seleucid
# Empire) immediately after Alexander's own death (323 BC).
[[era]]
name = "Empire of Alexander the Great"
from = -335
to = -323
ref_note = "drawn from general historical-geography knowledge of Alexander's conquests (Macedon/Greece added onto the whole former Achaemenid Persian realm, see persia.toml); no specific source consulted this session"
rings = [
  [
    [41.3, 29.0], [41.6, 32.0], [41.5, 35.0], [41.0, 38.0], [40.3, 41.0], [41.0, 44.0], [40.0, 47.0],
    [38.5, 49.0], [37.0, 52.0], [36.5, 55.0], [36.0, 58.0], [35.5, 61.0], [35.0, 64.0], [34.5, 67.0],
    [33.5, 68.5], [31.0, 68.5], [28.5, 68.0], [26.5, 67.0], [25.0, 64.0], [25.5, 60.0], [26.0, 56.5],
    [26.5, 52.0], [27.0, 49.5], [26.0, 48.5], [24.5, 47.5], [23.0, 46.5], [22.0, 44.0], [22.5, 41.0],
    [24.0, 38.5], [26.0, 36.5], [28.0, 34.7], [29.5, 32.6], [29.0, 31.0], [27.5, 30.0], [25.5, 29.5],
    [24.0, 28.0], [23.5, 25.0], [24.5, 22.0], [26.5, 21.0], [29.0, 20.8], [31.0, 20.9], [32.2, 22.5],
    [32.7, 25.0], [31.8, 28.0], [31.5, 30.5], [31.4, 32.3], [31.9, 34.5], [33.0, 35.2], [34.5, 35.9],
    [36.0, 36.2], [36.8, 33.0], [37.5, 30.0], [38.5, 28.0], [40.0, 27.0], [41.3, 29.0]
  ],
  [
    [42.0, 21.0], [41.0, 23.5], [39.5, 24.0], [38.0, 23.5], [37.0, 22.5], [36.5, 24.0], [36.0, 27.0],
    [36.8, 28.5], [38.0, 28.0], [39.5, 27.0], [40.5, 25.5], [41.5, 23.0], [42.0, 21.0]
  ]
]

# Batch M requirement 1: this era's own RISE -- Alexander's own conquest of
# the Achaemenid Persian Empire (334-330 BC), the SAME event persia.toml
# does NOT separately carry a fall-transition for (Persia has no
# `[era.fall]` of its own in this app's data -- its single era simply ends
# at -331 where this one begins; the conquest is told here, on the
# conquering side, rather than duplicated as a second copy of the identical
# citation on Persia's own file). Daniel 8's own vision, self-interpreted
# directly in the text (8:20-21) -- the SAME prophecy egypt.toml's own
# Ptolemaic-transition cites, since Alexander's conquest of Persia and of
# Egypt (then a Persian satrapy) are one and the same historical event.
# Verses read directly against the compiled KJV text before citing.
[era.transition]
event = "Alexander the Great conquers the Achaemenid Persian Empire"
verses = ["DAN.8.5", "DAN.8.20", "DAN.8.21"]
ref_note = "Daniel 8:5,20-21 (KJV, verified against the compiled text) -- the he-goat 'from the west' (v.5), self-interpreted in the text as Grecia overthrowing Media-Persia (vv.20-21); traditionally dated 334-330 BC -- see egypt.toml's own mirrored transition for the same conquest's reach into Egypt"
for_era_from = -335 # fix round 1 (I1): echoes THIS era's own from -- structural cross-check against TOML's own array-of-tables attachment

# Batch M requirement 1: this era's own FALL -- Alexander's own death (323
# BC, this era's own to= year) and the empire's own division among four
# successors (the Diadochi -- Ptolemaic Egypt and the Seleucid Empire chief
# among them, see egypt.toml/seleucid-empire.toml), already anticipated in
# this file's own top-of-file ring comment. The SAME Daniel 8 vision this
# era's own rise-transition cites, continued and self-interpreted a few
# verses later in the identical passage: the he-goat's great horn (v.8,
# Alexander) breaking into "four notable ones," explicitly glossed in the
# text itself (v.22) as "four kingdoms." Verses read directly against the
# compiled KJV text before citing.
[era.fall]
event = "Alexander dies; his empire divides among four successor kingdoms"
verses = ["DAN.8.8", "DAN.8.22"]
ref_note = "Daniel 8:8,22 (KJV, verified against the compiled text) -- the he-goat's great horn 'broken,' replaced by 'four notable ones toward the four winds of heaven' (v.8), self-interpreted a few verses later as 'four kingdoms shall stand up out of the nation' (v.22); traditionally dated to Alexander's 323 BC death -- see this era's own rise-transition for the same vision's earlier verses"
for_era_from = -335 # fix round 1 (I1): echoes THIS era's own from
