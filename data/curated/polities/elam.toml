    [33.5, 47.0], [33.4, 47.4], [33.3, 47.8], [33.15, 48.1], [33.0, 48.4], [32.8, 48.65], [32.6, 48.9],
    [32.4, 49.1], [32.2, 49.3], [31.95, 49.4], [31.7, 49.5], [31.45, 49.55], [31.2, 49.6], [30.95, 49.55],
    [30.7, 49.5], [30.5, 49.35], [30.3, 49.2], [30.15, 48.95], [30.0, 48.7], [29.9, 48.4], [29.8, 48.1],
    [29.75, 47.8], [29.7, 47.5], [29.75, 47.2], [29.8, 46.9], [29.95, 46.7], [30.1, 46.5], [30.3, 46.4],
    [30.5, 46.3], [30.75, 46.25], [31.0, 46.2], [31.25, 46.25], [31.5, 46.3], [31.75, 46.4], [32.0, 46.5],
