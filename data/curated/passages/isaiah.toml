verses = ["ISA.7.1-25"]
atlas_section = "Isaiah pericope (this project's own sectioning, CC0): Isaiah 7, the Syro-Ephraimite threat against Ahaz's own house, Isaiah meeting the king with his own son Shear-jashub, Ahaz's own refusal to ask a sign, and the sign given regardless: 'behold, a virgin shall conceive, and bear a son, and shall call his name Immanuel' (7:14), closing on Assyria's own coming as a shaved razor over the land."
ref_note = "Date interpolated from the pre-existing theo-221 ('Reign of Ahaz,' -743) -- a disclosed early-reign adjacency per this file's own header note; the Syro-Ephraimite crisis this chapter narrates is not independently dated more precisely anywhere in this app's own compiled data. Place: Jerusalem, explicit (7:1, Ahaz's own city under threat)."

