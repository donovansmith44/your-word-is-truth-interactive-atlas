# Batch W1 (whole-Bible titled verse containers). Numbers, in the SAME
# `[[event]]` schema `events-extra.toml` uses -- see
# `data/curated/passages/genesis.toml`'s own header comment for the full
# reconciliation/provenance framing.
#
# RECONCILIATION: only 3 pre-existing events touch Numbers (theo-123
# "Birth of Caleb," ex_kadesh, ex_moab -- 7/1288 verses, 0.5%) -- almost
# entirely fresh authoring. GRANULARITY: the census/law/list chapters
# (1-6, 8, 15, 18-19, 26, 28-30, 33-36) are general-kind, same "law/list =
# code units" reasoning as this file's own Leviticus sibling; the
# narrative chapters (7, 9-14, 16-17, 20-25, 27, 31-32) are event-kind.
#
# CHRONOLOGY, a SECOND disclosed pre-existing two-layer tension (distinct
# from Genesis's own patriarchal-era one): Theographic's own theo-125
# ("Exodus from Egypt") dates the Exodus to -1491 BC, Ussher's own
# published year -- the SAME scale this batch's own Exodus/Leviticus
# containers already used (exo_covenant_ratified, lev_consecration_aaron,
# etc.). The PRE-EXISTING "exodus" narrative's own legs (ex_rameses
# through ex_jordan, ALL unmodified by this batch) instead follow the
# "early date" Exodus tradition (-1446 BC, ex_rameses's own year) --
# reaching Kadesh-barnea (ex_kadesh, -1445) and the Jordan crossing
# (ex_jordan, -1406, JOS) on a scale offset ~45 years from theo-125's own.
# Numbers structurally bridges both halves of this book (its own opening
# chapters continue directly from Exodus/Leviticus; its own closing
# chapters hand off directly to Joshua's conquest). This file stays on
# the THEO-*/Ussher -1491 scale throughout, for internal consistency with
# THIS batch's own already-committed Exodus/Leviticus work (both directly,
# textually continuous with Numbers 1-10, no narrative time gap at all
# between them) -- the SAME choice, and the SAME disclosed reasoning,
# genesis.toml's own header already applies to its own analogous tension.
# Dated against the text's own EXPLICIT year markers: "the second year
# after they were come out of the land of Egypt" (1:1, 9:1, 10:11) =
# -1490; Numbers 33:38's own explicit "the fortieth year" (Aaron's death)
# = -1451, carried forward for the remaining chapters (Deuteronomy 1:3
# confirms the immediately-following material is the SAME fortieth year).
# Neither pre-existing scale is this batch's own to reconcile (real,
# substantial future work, out of this batch's own authoring scope).

