  [[item.question]]
  tier = "child"
  prompt = "Luther says we may ask God the way dear children ask their dear father. What would you ask?"

  [[item.question]]
  tier = "youth"
  prompt = "Why would God want us to pray confidently rather than nervously?"

  [[item.question]]
  tier = "youth"
  prompt = "What changes about prayer if God is truly OUR Father and not only my Father?"

  [[item.question]]
  tier = "adult"
  prompt = "Luther says God 'would thereby tenderly urge us to believe.' How does the address itself teach faith before a single request is made?"

[[item]]
id = "lords-prayer-1"

