kind = "general"
verses = ["ROM.15.1-13"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 15:1-13, the strong bearing with the weak as Christ himself 'pleased not himself,' and a catena of Old Testament citations on the Gentiles' own praise, closing with the benediction of hope."

[[event]]
id = "rom_pauls_ministry_and_travel_plans"
label = "Paul's own ministry, and his plans to visit Rome and go to Spain"
kind = "general"
verses = ["ROM.15.14-33"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 15:14-33, Paul's own account of his ministry to the Gentiles, his intended journey to Spain by way of Rome, and his request for prayer over the collection for Jerusalem."

[[event]]
id = "rom_commendation_of_phebe_and_greetings"
label = "Commendation of Phebe, and greetings to the saints at Rome"
kind = "general"
verses = ["ROM.16.1-16"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 16:1-16, Phebe commended as a servant of the church at Cenchrea, and Paul's own extended roll of personal greetings to the Roman church."

[[event]]
id = "rom_warning_and_closing_doxology"
label = "A warning against those who cause divisions; the closing doxology"
kind = "general"
verses = ["ROM.16.17-27"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 16:17-27, a final warning to mark and avoid those who cause offences, the greetings of Paul's own companions, and the letter's own closing doxology 'to God only wise.'"
