# Batch W5 (whole-Bible titled verse containers, fifth run). Philippians.
# KIND POLICY (applies across this whole W5 slice, stated here once, per
# the master brief's own requirement 2, "KIND DISCIPLINE"): every
# container in this file is GENERAL-kind (undated, placeless) -- a
# letter's own teaching content is not a datable occurrence, and Theographic's
# own dated "X writes Y" EVENT nodes (where any exist) are a DIFFERENT
# identity from these content containers -- never merged into them, never
# given a fabricated dated twin. See batch-w5-report.md for the full
# reconciliation sweep against the real compiled events.json.
#
# GRANULARITY: Philippians' own real seams -- salutation/thanksgiving,
# Paul's own circumstances, the Christ-hymn and its ethical outworking,
# Paul's own testimony, and closing thanks for their gift.

[[event]]
id = "php_salutation_and_thanksgiving"
label = "Salutation and thanksgiving; Paul's own prayer for their love to abound"
kind = "general"
verses = ["PHP.1.1-11"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Philippians 1:1-11, Paul's own greeting to the saints at Philippi 'with the bishops and deacons,' his own thanksgiving 'for your fellowship in the gospel,' and his prayer that their 'love may abound yet more and more.'"

[[event]]
id = "php_pauls_bonds_further_the_gospel"
label = "Paul's own bonds further the gospel; to live is Christ, to die is gain"
kind = "general"
verses = ["PHP.1.12-26"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Philippians 1:12-26, Paul's own report that his imprisonment has fallen out 'rather unto the furtherance of the gospel,' and his own reflection, 'for to me to live is Christ, and to die is gain.'"

