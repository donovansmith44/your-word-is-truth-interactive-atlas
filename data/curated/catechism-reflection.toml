# Reflection questions for Luther's Small Catechism -- CC0, this project's
# own hand-authored content (like the rest of data/curated/; see LICENSES.md).
#
# WHY THIS FILE EXISTS, and how it differs from what was already here:
# `catechism.toml`'s own `[[part.item]]` entries carry Luther's text; the
# brain-fuel/catechism mapping (`catechism-mapping.toml`) contributes
# QUESTION-level PROOF-VERSE groupings -- topical buckets of Scripture with
# titles like "God Alone as Judge". Those are citations, not prompts: they
# name which verses bear on an item, and they carry no difficulty and ask
# the student nothing. This file is the other thing -- questions a teacher
# actually ASKS OUT LOUD in a lesson, ordered so one item can be taught to
# any age group in the room.
#
# TIERS (`tier`), and what each is for:
#   child  -- answerable from the item's own words, or from the student's
#             own life. Concrete. No prior catechesis assumed.
#   youth  -- application and "why": connects the item to daily life, or to
#             the shape of Luther's own argument (his "not X, but Y" moves,
#             his ordering, his insistence on a word).
#   adult  -- doctrinal precision: law and gospel, the limits of a
#             commandment, the ground of assurance, tensions held together.
#
# ORDERING IS THE CONTRACT. Within an item, file order IS presentation
# order, easy -> difficult (the same "curated order is the compiled order"
# rule polities/narratives already follow). Tier must be NON-DECREASING
# down an item's list -- child before youth before adult, never back up.
# That is enforced, not merely intended: `validate::run_catechism_reflection`
# fails the ETL on any item whose tiers regress, so "in order from easy to
# difficult" is a committed law rather than an authoring habit that quietly
# rots. Several tiers may repeat (two `child` rows in a row is normal).
#
# AUTHORSHIP NOTE (disclosed, not silent): every prompt below is grounded in
# its own item's `text`/`explanation_heading`/`explanation` as they actually
# read in `catechism.toml` -- quoting Luther's own wording wherever a prompt
# turns on it, so a question never asks about a phrase the item does not
# contain. These are teaching prompts, NOT confessional statements, and they
# deliberately ask rather than assert: an answer key is not part of V1.
# `item` must match a `catechism.toml` item id exactly (validated).

[[item]]
id = "commandment-1"

  [[item.question]]
  tier = "child"
  prompt = "Luther says we should fear, love, and trust in God above all things. What is one thing you love a lot?"

  [[item.question]]
  tier = "child"
  prompt = "What does it mean to trust someone? Who do you trust to take care of you?"

  [[item.question]]
  tier = "youth"
  prompt = "Luther does not say only 'do not bow to idols' -- he says fear, love, and trust God ABOVE ALL THINGS. How could a good thing (a friendship, a sport, a phone) become a god?"

  [[item.question]]
  tier = "youth"
  prompt = "Why do you think Luther puts fear first, before love and trust?"

  [[item.question]]
  tier = "adult"
  prompt = "If the First Commandment claims the heart and not merely the hands, can anyone keep it? Where does that drive us?"

[[item]]
id = "commandment-2"

  [[item.question]]
  tier = "child"
  prompt = "What is your name? How does it feel when someone uses your name to be mean?"

  [[item.question]]
  tier = "child"
  prompt = "Luther says we should call on God's name when we are in trouble. Name one time you could pray."

  [[item.question]]
  tier = "youth"
  prompt = "This commandment has a 'not' half and a 'but' half. Why is avoiding bad words not enough?"

  [[item.question]]
  tier = "youth"
  prompt = "What is the difference between using God's name and using it in vain?"

  [[item.question]]
  tier = "adult"
  prompt = "Luther lists cursing, swearing, witchcraft, lying, and deceiving by God's name together. What do those five share?"

[[item]]
id = "commandment-3"

  [[item.question]]
  tier = "child"
  prompt = "What do we do at church that helps us learn God's Word?"

  [[item.question]]
  tier = "child"
  prompt = "Luther says we should GLADLY hear God's Word. What does gladly mean?"

  [[item.question]]
  tier = "youth"
  prompt = "Notice that Luther does not mention resting, or a particular day of the week. What does he say the day is FOR?"

  [[item.question]]
  tier = "youth"
  prompt = "How could someone sit in church every Sunday and still despise preaching?"

  [[item.question]]
  tier = "adult"
  prompt = "Why does Luther define keeping the holy day around the Word rather than around rest?"

[[item]]
id = "commandment-4"

  [[item.question]]
  tier = "child"
  prompt = "Name one way you could help at home this week."

  [[item.question]]
  tier = "child"
  prompt = "What is the difference between obeying right away and obeying slowly?"

  [[item.question]]
  tier = "youth"
  prompt = "Luther includes 'masters' -- teachers, employers, authorities. Why would God attach honor to an office and not only to a person you like?"

  [[item.question]]
  tier = "youth"
  prompt = "Honor is more than obedience. What do you still owe a parent you disagree with?"

  [[item.question]]
  tier = "adult"
  prompt = "This is the first commandment with a promise attached. What does it mean that God ties earthly blessing to the honoring of parents?"

[[item]]
id = "commandment-5"

  [[item.question]]
  tier = "child"
  prompt = "Who is someone you could be kind to today?"

  [[item.question]]
  tier = "child"
  prompt = "Luther says we should help our neighbor when he is hurt. What could you do if a friend fell down?"

  [[item.question]]
  tier = "youth"
  prompt = "Luther turns 'thou shalt not kill' into 'help and befriend him in every bodily need.' Why is leaving someone alone not enough?"

  [[item.question]]
  tier = "youth"
  prompt = "What does it mean to harm someone in his body without ever touching him?"

  [[item.question]]
  tier = "adult"
  prompt = "How does this commandment reach both the anger in the heart and the neighbor's bodily needs -- food, shelter, safety?"

[[item]]
id = "commandment-6"

  [[item.question]]
  tier = "child"
  prompt = "Why is it good that families love each other?"

  [[item.question]]
  tier = "child"
  prompt = "Luther says we should be decent in our words. What kind of words are not decent?"

  [[item.question]]
  tier = "youth"
  prompt = "Luther says 'in words and deeds.' Why does he include words?"

  [[item.question]]
  tier = "youth"
  prompt = "What does it mean to honor someone else's marriage?"

  [[item.question]]
  tier = "adult"
  prompt = "Luther frames purity positively -- leading a chaste and decent life, and loving and honoring one's spouse. How does that reframe chastity for married and unmarried alike?"

[[item]]
id = "commandment-7"

  [[item.question]]
  tier = "child"
  prompt = "What does it mean to take something that is not yours?"

  [[item.question]]
  tier = "child"
  prompt = "Luther says we should help our neighbor keep his things safe. How could you do that?"

  [[item.question]]
  tier = "youth"
  prompt = "'False ware or dealing' means cheating in business. How is cheating a customer the same sin as stealing from him?"

  [[item.question]]
  tier = "youth"
  prompt = "Why does Luther say we should help our neighbor IMPROVE his property, not merely leave it alone?"

  [[item.question]]
  tier = "adult"
  prompt = "What does the Seventh Commandment ask of an employer, a seller, and a borrower?"

[[item]]
id = "commandment-8"

  [[item.question]]
  tier = "child"
  prompt = "What is a lie? Why does it hurt?"

  [[item.question]]
  tier = "child"
  prompt = "Luther says we should speak well of our neighbor. Who could you say something good about?"

  [[item.question]]
  tier = "youth"
  prompt = "'Put the best construction on everything' means assuming the kindest explanation. When is that hardest?"

  [[item.question]]
  tier = "youth"
  prompt = "Is it possible to break this commandment by repeating something that is true?"

  [[item.question]]
  tier = "adult"
  prompt = "Luther requires defending the neighbor's reputation, not merely avoiding lies. What does that demand in an age of instant sharing?"

[[item]]
id = "commandment-9"

  [[item.question]]
  tier = "child"
  prompt = "What does it mean to want something that belongs to someone else?"

  [[item.question]]
  tier = "child"
  prompt = "Luther says we should help our neighbor keep what is his. What would helping look like?"

  [[item.question]]
  tier = "youth"
  prompt = "This commandment names a sin that can be perfectly legal -- getting a thing 'by a show of right.' How can something be lawful and still be sin?"

  [[item.question]]
  tier = "youth"
  prompt = "Why do you think God gives a commandment about wanting, and not only about doing?"

  [[item.question]]
  tier = "adult"
  prompt = "The Ninth and Tenth Commandments govern desire itself. What does that reveal about where sin actually begins?"

[[item]]
id = "commandment-10"

  [[item.question]]
  tier = "child"
  prompt = "Have you ever wanted a friend to like you more than someone else? What did you do?"

  [[item.question]]
  tier = "child"
  prompt = "Luther says we should help people do their duty. What is one of your duties?"

  [[item.question]]
  tier = "youth"
  prompt = "This commandment is about drawing people away from where they belong. How does that happen today?"

  [[item.question]]
  tier = "youth"
  prompt = "Why does Luther say we should urge them to STAY?"

  [[item.question]]
  tier = "adult"
  prompt = "How do the Ninth and Tenth Commandments together guard a neighbor's whole household -- his property and his relationships?"

[[item]]
id = "commandments-close"

  [[item.question]]
  tier = "child"
  prompt = "God says He shows mercy. What does mercy mean?"

  [[item.question]]
  tier = "child"
  prompt = "What does God promise to those who love Him and keep His commandments?"

  [[item.question]]
  tier = "youth"
