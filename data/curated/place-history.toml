# --- Samaria (city; id carries Theographic's own raw underscore id) ------
[[place]]
id = "samaria_1022"

  [place.established]
  year = -929
  # 1KI.16.24: "he bought the hill Samaria of Shemer... and called the name
  # of the city which he built... Samaria." Year matches the compiled
  # theo-176 event ("Reign of Omri").
  verses = ["1KI.16.24"]
  note = "traditional"

  [place.destroyed]
  year = -722
  # 2KI.17.5: "the king of Assyria came up... and besieged it three years";
  # 2KI.17.6: "In the ninth year of Hoshea the king of Assyria took
  # Samaria, and carried Israel away into Assyria." No "traditional"
  # qualifier -- externally synchronized to Assyrian records, same firm
  # standing as Jerusalem's 586 BC destruction above.
  verses = ["2KI.17.5", "2KI.17.6"]

  [[place.blurb]]
  text = "Omri built his new capital on a hill he bought from Shemer, and it remained the northern kingdom's royal city until Assyria besieged and took it, exiling Israel."
  from = -929
  to = -722
  breadth = "era"

  [[place.blurb]]
  text = "After Stephen's martyrdom scattered the believers, Philip preached the gospel here, and the Samaritans received the Holy Spirit through the apostles."
  from = 30
  to = 33
  breadth = "era"

# --- Shiloh ------------------------------------------------------------
[[place]]
id = "shiloh"

  [place.established]
  year = -1399
  # JOS.18.1: "the whole congregation of the children of Israel assembled
  # together at Shiloh, and set up the tabernacle." Matches the compiled
  # cq_shiloh event exactly.
  verses = ["JOS.18.1"]
  note = "traditional"

  [place.destroyed]
  from = -1104
  to = -1050
  # Not directly narrated (no single verse says "and Shiloh was destroyed");
  # inferred from later references: PSA.78.60 "he forsook the tabernacle of
  # Shiloh, the tent which he placed among men"; JER.7.12 "go ye now unto my
  # place which was in Shiloh... see what I did to it." Range covers the
  # traditional window around the ark's capture by the Philistines
  # (1 Samuel 4).
  verses = ["PSA.78.60", "JER.7.12"]
  note = "traditional; inferred, not directly narrated"

  [[place.blurb]]
  text = "Israel's tabernacle stood here for centuries after the conquest, the nation's central place of worship before Jerusalem's temple was built."
  from = -1399
  to = -1051
  breadth = "era"

