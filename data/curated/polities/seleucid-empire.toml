# The Seleucid "rump state": after Parthia's own eastern conquests and
# Tigranes of Armenia's inroads, by the early-mid 1st century BC little
# more than Antioch and a handful of Syrian cities remained (a real
# SHRINK -- the mirror of Judah's own growth under the Hasmoneans it
# helped provoke). Ends with Pompey's annexation of Syria as a Roman
# province (64 BC).
[[era]]
