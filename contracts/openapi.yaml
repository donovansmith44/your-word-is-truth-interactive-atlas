      description: |-
        D5 (owner, 2026-09-15; additive, AQC 0.7.0): a Person card's life facts,
        straight off the payload. `birth_year`/`death_year` are the source's
        own life dates (75 / 64 of 3,067 persons carry one); `first_year`/
        `last_year` are the CORPUS-mention span, never a lifespan; `eternal`
        with its Scripture `eternal_grounds` is the curated exception ("God
        because he is eternal") -- an eternal person shows no years at all.
      required:
      - eternal
      - eternal_grounds
      - also_called
      properties:
        also_called:
          type: array
          items:
            type: string
        birth_year:
          type:
          - integer
          - 'null'
          format: int32
        death_year:
          type:
          - integer
          - 'null'
          format: int32
        eternal:
          type: boolean
        eternal_grounds:
          type: array
          items:
            type: string
        first_year:
          type:
          - integer
          - 'null'
          format: int32
        gender:
          type:
          - string
          - 'null'
        last_year:
          type:
          - integer
          - 'null'
          format: int32
      additionalProperties: false
    PersonRef:
      type: object
      description: |-
        M-D3 (owner ruling U5, "in-text person and place name links,
        mentions-attested ONLY -- no free-text matching ever"): one person the
        graph's own `mentions` relation attests at a verse's own locus
        (`GraphService::persons_by_verse`, precomputed off `Graph.mentions`,
        NEVER a free-text/dictionary lookup against the verse's own rendered
        words -- the exact "Sin"-the-city vs "sin"-the-noun hazard this
        wording guards against: a name is only ever offered as a link because
        a CURATED edge attests that specific entity at that specific verse,
        not because some word in the text happens to match a name string
        somewhere in the graph). Deliberately lean, mirroring `PlaceRef`'s
        own "no more than the consumer needs" wire philosophy -- id (to open
        the entity's own node popover) and display label (for the client's
        own plain-text search locating WHERE in the verse's already-attested
        text this entity's own name appears, the SAME PlaceMentions.cs
        mechanism this batch generalizes rather than replaces -- attestation
        is what THIS field guards; locating the substring within an ALREADY-
        attested verse is a separate, later step, not a second matching
        hazard).
      required:
      - id
      - name
      properties:
        id:
          type: string
        name:
          type: string
      additionalProperties: false
    PlaceDetail:
      type: object
      required:
      - id
      - name
      - lat
      - lon
      - events
      properties:
        canonical_name:
          type:
          - string
          - 'null'
          description: |-
            Batch E3 (requirement 2's quiet provenance note): the bare, stripped,
            un-aliased, un-period-resolved canonical name. ALWAYS COMPUTED --
            unlike `history`, which stays absent for a place with no curated
            `PlaceHistory` record at all (e.g. `cush-2`), this field's own
            resolution never depends on `history` existing -- but only ever
            SERIALIZED (`Some`) when it differs from whatever name is actually
            showing this request (a curated period name OR a curated KJV alias
            resolved to something else). Omitted (`None`, not a repeat of the
            title) whenever this place's displayed name already IS its canonical
            name, so the client's own popover renders NO provenance note rather
            than a vacuous "known elsewhere as X" that just repeats the title.
        description:
          type:
          - string
          - 'null'
          description: |-
            ENT-1a (owner order: "we actually want meaningful information about
            who or what someone is, having that be backed by scripture"):
            Easton's Bible Dictionary (1897, public domain) prose, source-
            attested, `None` until a match exists -- never fabricated. ADDITIVE
            JSON (batch-ent1a-brief.md controller decision 3): the current
            client ignores unknown/absent fields; the EntityProfile presentation
            half that renders this is HELD for the frontend-elegance brainstorm.
        events:
          type: array
          items:
            $ref: '#/components/schemas/SceneEvent'
        history:
          oneOf:
          - $ref: '#/components/schemas/History'
          - type: 'null'
        id:
          type: string
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        name:
          type: string
      additionalProperties: false
    PlaceRef:
      type: object
      description: |-
        Batch R requirement 5 (place-in-verse hover -> marker blink): one place
        mentioned in a verse, per `AtlasData::places_for_verse` (the reverse of
        `Place::verse_links`). Deliberately lean -- id (to target a map marker)
        and display name (for the client's own plain-text substring match against
        the verse's rendered text, see `chapter`'s own doc comment for why there
        is no richer per-mention offset data) -- mirrors `QuietPlace`'s own
        "no more than the consumer needs" wire philosophy.
      required:
      - id
      - name
      properties:
        id:
          type: string
        name:
          type: string
      additionalProperties: false
    Polities:
      type: object
      required:
      - polities
      properties:
        polities:
          type: array
          items:
            $ref: '#/components/schemas/Polity'
      additionalProperties: false
    Polity:
      type: object
      required:
      - id
      - name
      - from
      - to
      - rings
      - color_key
      properties:
        color_key:
          type: integer
          format: int32
          minimum: 0
        fall:
          oneOf:
          - $ref: '#/components/schemas/PolityDelta'
          - type: 'null'
        from:
          type: integer
          format: int32
        id:
          type: string
        name:
          type: string
        rings:
          type: array
          items:
            type: array
            items:
              type: array
              items: false
              prefixItems:
              - type: number
                format: double
              - type: number
                format: double
        to:
          type: integer
          format: int32
        transition:
          oneOf:
          - $ref: '#/components/schemas/PolityDelta'
            description: |-
              Batch M requirement 1: this era's own delta metadata, OMITTED (not
              null) when absent -- "an uneventful boundary stays visible but gets
              the minimal popover," so the client must be able to tell "no
              transition curated" apart from "transition curated with zero
              verses" (the latter still shows the event/grounding-note sections,
              just no THE SCRIPTURES section — see `PolityDelta::verses`' own doc
              comment). Mirrors `NarrativePosition.prior`/`.following`'s own
              `skip_serializing_if` precedent exactly.
          - type: 'null'
      additionalProperties: false
    PolityDelta:
      type: object
      description: |-
        Batch B2 ("borders v2, the cartographer's edition"): one polity-era row
        on the wire, `{ id, name, from, to, rings, color_key }` per the batch
        brief verbatim -- field names deliberately match
        `atlas_core::data::PolityEra`'s own (`from`/`to`, not `from_year`/
        `to_year`; see that struct's doc comment for why) so this is a plain
        copy, not a rename. `id` is the POLITY's id (constant across every era
        row this same polity contributes to a response), `name`/`from`/`to`/
        `rings` are this specific ERA's own fields, and `color_key` is the
        polity's own precomputed hash (`Polity::color_key` -- copied here
        unchanged, never rehashed per-request).
        Batch M requirement 1: the wire shape of one `atlas_core::data::PolityDelta`
        -- a plain field-for-field copy (`event`/`verses`/`ref_note`), same "no
        rename, no reshaping" convention `Polity` itself already follows for
        `PolityEra`.
      required:
      - event
      - verses
      - ref_note
      properties:
        event:
          type: string
        ref_note:
          type: string
        verses:
          type: array
          items:
            type: string
      additionalProperties: false
    PositionKind:
      type: string
      enum:
      - TextUnit
      - Container
      - Event
      - Narrative
      - Place
      - Person
      - Anchor
      - Era
      - Polity
      - CatechismItem
      - Source
      - Translation
      - PeopleGroup
      - CommentaryItem
      - LexiconEntry
      - Edge
    ProvenanceEntry:
      type: object
      description: |-
        Batch PROV-1 (owner order 1, verbatim: "one thing we definitely need
        for EVERY PIECE OF DATA is the source from which it came. openbible,
        etc."): THE JOIN ROW between a `ProvenanceId` as the graph actually
        carries it -- the interned adapter-side string on every node and every
        authored/imported row (`"kjv"`, `"theographic"`, `"curated-eras"`, ...)
        -- and the [`SourceEntry`] that names, describes and licenses it for a
        reader.

        This table exists because the two vocabularies are genuinely DIFFERENT,
        and always were: an adapter's provenance id is an INGEST fact (which
        pipeline stage asserted this row), while a source id is a PUBLICATION
        fact (which corpus a reader is being cited to). Several ingest ids
        legitimately map to ONE source -- every hand-authored `curated-*` id is
        this project's own work -- and rewriting the graph to carry publication
        ids instead would erase that distinction. So the mapping is DECLARED
        here, curated, and checked in BOTH directions
        (`atlas_etl::sources::validate_structure` for internal consistency;
        `atlas-graph/tests/provenance_registry_real_data.rs` for the real
        artifact), rather than guessed by string munging at the UI.

        [`confidence`](Self::confidence) is the reader-facing half of
        `atlas_graph_types::ingest::Confidence`, which the graph's own row
        structs do NOT store (they carry the id alone -- and that enum's own
        doc comment says why: confidence "derives from its role at the
        registry," and this IS the registry). Spelled exactly as that enum's
        variants are: `"CanonicalText"` | `"Curated"` | `"Imported"` |
        `"Derived"`.
      required:
      - id
      - source
      - confidence
      properties:
        confidence:
          type: string
          description: |-
            `atlas_graph_types::ingest::Confidence`, spelled as its own variant
            name -- see this struct's doc comment. Validated against the closed
            vocabulary by [`crate::sources::CONFIDENCE_VOCABULARY`].
        id:
          type: string
          description: The `ProvenanceId` as the compiled graph carries it, verbatim.
        locator:
          type:
          - string
          - 'null'
          description: |-
            The optional "locator" half of `ingest::Provenance`, at the level
            this registry can honestly state it: WHAT INSIDE the named source
            this id draws on ("cross_references.txt", "Bible-Geocoding-Data",
            ...). Omitted (not an empty string) when the source's own
            `what_we_built` already says it and a locator would add nothing --
            never a fabricated or padded string.
        source:
          type: string
          description: The [`SourceEntry::id`] this ingest id is a claim BY.
    QuietPlace:
      type: object
      description: |-
        Batch E2: one "quiet" place on a time-mode scene -- an event-bearing
        place that isn't lit (in `Scene::places`) for this particular window.
        Deliberately LEAN -- no `events`/`verse_groups` at all, unlike
        `ScenePlace`: a quiet place has none active this window BY DEFINITION,
        so carrying an always-empty list would only bloat the payload.
      required:
      - id
      - display_name
      - lat
      - lon
      - total_events
      properties:
        display_name:
          type: string
          description: |-
            Same window-resolution rules `ScenePlace::display_name` uses
            (`crate::history::resolve_display_name`) -- QUIET-1 requires this to
            never contradict what the lit side would show for the SAME window
            (e.g. a place that crosses from quiet to lit as the window nudges by
            a year must not also silently change its displayed name).
        existence_from:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Batch H (existence gating): same fields, same rule, as
            `ScenePlace::existence_from`/`existence_to` -- see that doc comment.
            A quiet place is exactly where this matters most in practice (the
            "ever-present graph" shows a dot for every event-bearing place
            regardless of window, so a long-destroyed place's dot can otherwise
            sit on a plate captioned with a name it never bore at that time).
        existence_to:
          type:
          - integer
          - 'null'
          format: int32
        id:
          type: string
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        merged_ids:
          type: array
          items:
            type: string
          description: |-
            Batch HOTFIX-2: same field, same rule, as `ScenePlace::merged_ids`
            above -- a quiet place is exactly where this can matter too (the
            survivor of a merge is quiet in any window neither absorbed record's
            own events intersect).
        total_events:
          type: integer
          format: int32
          description: |-
            This place's ALL-TIME event count (every event touching it, in ANY
            window) -- NOT scoped to the current scene's window, since a quiet
            place has zero events IN this window by definition; a window-scoped
            count would always read zero and tell the client nothing.
          minimum: 0
      additionalProperties: false
    Scene:
      type: object
      required:
      - mode
      - places
      - quiet_places
      - arrows
      - narratives
      properties:
        arrows:
          type: array
          items:
            $ref: '#/components/schemas/SceneArrow'
        mode:
          type: string
          description: '`time` | `scripture`.'
        narratives:
          type: array
          items:
            $ref: '#/components/schemas/SceneNarrative'
        places:
          type: array
          items:
            $ref: '#/components/schemas/ScenePlace'
        quiet_places:
          type: array
          items:
            $ref: '#/components/schemas/QuietPlace'
          description: |-
            Batch E2 (the ever-present graph, user direction 2026-08-19: "all of
            the cities in our graph are available in any timerange rather than
            just loading those which are biblically active at the time"): every
            event-bearing place NOT in `places` for this window -- period
            relevance is now expressed by GLOW (whether a place is in `places`),
            not existence. QUIET-1: for every time-mode window, `places` union
            `quiet_places` equals the FULL event-bearing place set (fixed
            cardinality, derived from the data -- see
            `AtlasData::event_bearing_place_ids`), and the two are disjoint.
            ALWAYS an array (never omitted) on both modes -- but always EMPTY for
            scripture-mode scenes, which never gain quiet places at all (chosen
            over an `Option`/omitted-key representation for wire regularity with
            `places` itself, which is likewise never optional; a client reading
            `quiet_places` needs no null-check either way).
        ref:
          type:
          - string
          - 'null'
        window:
          oneOf:
          - $ref: '#/components/schemas/TimeRange'
          - type: 'null'
      additionalProperties: false
    SceneArrow:
      type: object
      required:
      - narrative
      - color
      - from_place
      - to_place
      - from_event
      - to_event
      - order
      properties:
        color:
          type: string
        from_event:
          type: string
        from_place:
          type: string
        narrative:
          type: string
        order:
          type: integer
          format: int32
          minimum: 0
        to_event:
          type: string
        to_place:
          type: string
      additionalProperties: false
    SceneEvent:
      type: object
      required:
      - id
      - label
      - when
      - verse_groups
      properties:
        id:
          type: string
        label:
          type: string
        verse_groups:
          type: array
          items:
            $ref: '#/components/schemas/VerseGroup'
        when:
          $ref: '#/components/schemas/TimeRange'
      additionalProperties: false
    SceneNarrative:
      type: object
      required:
      - id
      - name
      - color
      - legs_in_scene
      properties:
        color:
          type: string
        id:
          type: string
        legs_in_scene:
          type: integer
          format: int32
          minimum: 0
        name:
          type: string
      additionalProperties: false
    ScenePlace:
      type: object
      required:
      - id
      - name
      - display_name
      - lat
      - lon
      - brightness
      - events
      properties:
        brightness:
          type: integer
          format: int32
          minimum: 0
        display_name:
          type: string
          description: |-
            Batch E: the period-true name resolved for this scene's own window
            (`crate::history::resolve_display_name`) -- `name`'s original,
            always-present value unchanged; this is the ADDITIONAL field the
            client renders on map labels / hover card title / arrow-tip text.
            Equal to `name` whenever this place has no curated history, or none
            of its curated ranges intersects the window.
        events:
          type: array
          items:
            $ref: '#/components/schemas/SceneEvent'
        existence_from:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Batch H (existence gating, deferred from E2): the curated
            established/destroyed bounds this place's name resolves against
            (`crate::history::resolve_existence`) -- plain years, never the full
            established/destroyed `PlaceDateClaim` (verses/note; that richer
            shape is `/api/place/{id}`'s own `HistoryOut`, not a per-marker wire
            cost). Both omitted (not `null` -- see `skip_serializing_if`) when
            this place has no curated history at all, or a curated history with
            neither claim -- the client's own gate never fires in that case
            (`existence_gates_label`'s own "always labels" reading). The map
            renders every place regardless of these bounds (a lit place is only
            ever here because a real event justifies it THIS window -- see
            `scene::lit_places`); it's the client's own label -- never the
            marker/dot -- that these bounds gate, and only in time mode (there is
            no window to test outside-ness against in scripture mode).
        existence_to:
          type:
          - integer
          - 'null'
          format: int32
        id:
          type: string
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        merged_ids:
          type: array
          items:
            type: string
          description: |-
            Batch HOTFIX-2 (same-place dedupe): ids of every OTHER compiled place
            record merged into this one at load time (`crate::merge::MERGE_PAIRS`)
            -- e.g. `["hazor_545"]` on the place carrying id `hazor-1`. Wire
            traceability only (no client behavior reads this today): the brief's
            own "note the absorbed record's id in the wire for traceability" --
            so a future investigation into "why does hazor-1 carry events from
            two different upstream lineages" doesn't have to go spelunking
            through source data by hand. Empty (and omitted -- `skip_serializing_if`,
            matching `existence_from`/`_to`'s own lean-wire convention) for the
            overwhelming majority of places, which were never part of a merge.
        name:
          type: string
      additionalProperties: false
    SourceCategory:
      type: object
      description: |-
        One heading group on the Sources page (e.g. "Scripture & Text"). `id`
        is the join key [`SourceEntry::category`] points at.
      required:
      - id
      - label
      properties:
        id:
          type: string
        label:
          type: string
    SourceEntry:
      type: object
      description: |-
        One row of LICENSES.md's own "## Per-source table", curated by hand
        into page-ready prose (positive tone throughout, per the KJV inerrancy
        directive; license wording copied from LICENSES.md, never
        embellished, per the citation-integrity rule).

        `licenses_row_key` is never rendered on the page -- it is a literal
        substring of this source's own row in LICENSES.md's Source column,
        read ONLY by `atlas_etl::sources::validate_against_licenses`'s own
        fail-loud drift check (requirement 3: "a LICENSES.md row absent from
        the page (or vice versa) fails the build or a test").
      required:
      - id
      - category
      - title
      - what_it_is
      - what_we_built
      - license
      - licenses_row_key
      properties:
        category:
          type: string
        id:
          type: string
        license:
          type: string
        licenses_row_key:
          type: string
        link:
          type:
          - string
          - 'null'
        title:
          type: string
        what_it_is:
          type: string
        what_we_built:
          type: string
    SourcesDocument:
      type: object
      description: |-
        The whole compiled/curated shape. `data/curated/sources.toml`'s
        `[[category]]`/`[[source]]` arrays and `data/compiled/sources.json`'s
        top-level object are the SAME shape (no per-format renaming), so one
        struct serves both directions -- `atlas_etl::sources::parse_sources`
        reads the TOML shape, `gen_sources` writes this straight to JSON, and
        `GET /api/sources` serves that JSON back out unchanged.
      required:
      - categories
      - sources
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/SourceCategory'
        provenances:
          type: array
          items:
            $ref: '#/components/schemas/ProvenanceEntry'
          description: |-
            Batch PROV-1: see [`ProvenanceEntry`]. `#[serde(default)]` so a
            `sources.json` written before this batch still deserializes (the
            same additive-only discipline the HTTP wire follows) -- the
            committed one is regenerated with this table populated.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceEntry'
    TextUnit:
      type: object
      required:
      - ref
      - text
      - words_of_christ
      - edge_summary
      properties:
        edge_summary:
          type: array
          items:
            $ref: '#/components/schemas/EdgeSummaryEntry'
          description: |-
            D3 (owner, 2026-09-15; additive, AQC 0.6.0): this unit's own
            inhabited frontier kinds and counts -- the SAME `edge_summary`
            shape `NodeCard` carries, so a corpus page can make ONLY units
            with edges clickable (no dead clicks) without an N+1 of node-card
            calls. The reader may ignore it.
        ref:
          type: string
        text:
          type: string
        words_of_christ:
          type: array
          items:
            $ref: '#/components/schemas/WordsOfChristSpan'
          description: |-
            Batch RED-1: this unit's own aligned sub-verse red-letter spans --
            see `wire::Verse.words_of_christ`'s own doc comment
            (identical shape/convention). Always empty for `corpus=concord`
            (a wholly different corpus, never the KJV -- decision 5's own
            sub-verse precision is KJV-specific by construction).
      additionalProperties: false
    TextWindow:
      type: object
      required:
      - units
      - version
      properties:
        next:
          type:
          - string
          - 'null'
        units:
          type: array
          items:
            $ref: '#/components/schemas/TextUnit'
        version:
          type: string
      additionalProperties: false
    TimeRange:
      type: object
      required:
      - from_year
      - to_year
      properties:
        from_year:
          type: integer
          format: int32
        to_year:
          type: integer
          format: int32
    TimelinePosition:
      type: object
      description: |-
        Batch HOTFIX-4 requirement 1: the GLOBAL chronological PRIOR/FOLLOWING
        for one event id, independent of narrative membership -- see
        `atlas_core::narrative::TimelinePosition`'s own doc comment for the full
        ordering rule. Reuses `NarrativeAdjacentEvent` (same shape, same
        "id/label/places/verse_groups" the narrative rows already send) -- one
        computation, one wire type, two consumers.
      properties:
        following:
          oneOf:
          - $ref: '#/components/schemas/NarrativeAdjacentEvent'
          - type: 'null'
        prior:
          oneOf:
          - $ref: '#/components/schemas/NarrativeAdjacentEvent'
          - type: 'null'
      additionalProperties: false
    Verse:
      type: object
      required:
      - verse
      - text
      - places
      - persons
      - xref_count
      - words_of_christ
      properties:
        heading:
          oneOf:
          - $ref: '#/components/schemas/Heading'
            description: |-
              Batch T requirement 5: this verse's own pericope heading, when it is
              a heading ANCHOR (`AtlasData::heading_for_verse`) -- omitted (not
              null), matching `Polity.transition`/`.fall`'s own conditional-
              presence convention, since the overwhelming majority of verses never
              anchor a heading at all.
          - type: 'null'
        persons:
          type: array
          items:
            $ref: '#/components/schemas/PersonRef'
          description: |-
            M-D3 (owner ruling U5): every person the graph's own `mentions`
            relation attests at this verse's own locus, in wire (row-insertion)
            order -- see `PersonRef`'s own doc comment for the full
            mentions-attested-only reasoning. Always present, possibly empty
            (most verses mention zero persons by name) -- SAME conditional-
            presence-lives-client-side convention `places` immediately above
            already establishes for this exact shape of field.
        places:
          type: array
          items:
            $ref: '#/components/schemas/PlaceRef'
          description: |-
            Batch R requirement 5: every curated place whose OWN `verse_links`
            names this verse, in place-id order (stable, not meaningful --
            there is no "primary mention" concept). Always present, possibly
            empty (most verses geocode to zero places) -- conditional presence
            lives on the CLIENT side (a mini-reader renders no hoverable span at
            all when this is empty), not as an omitted wire key, matching every
            other "always an array" field in this app's own wire (e.g.
            `Scene.quiet_places`).
        text:
          type: string
        verse:
          type: integer
          format: int32
          minimum: 0
        words_of_christ:
          type: array
          items:
            $ref: '#/components/schemas/WordsOfChristSpan'
          description: |-
            Batch RED-1: this verse's own aligned sub-verse red-letter spans
            (`GraphService.red_letter_spans`, precomputed once -- see that
            field's own doc comment for why this ONE companion is not
            graph-derivable), in ascending order. Always present, possibly
            empty -- SAME "always an array" convention `places`/`persons`
            above already establish (most verses carry none). KJV-ONLY by
            construction (decision 5: sub-verse precision is KJV-specific;
            this endpoint has never served any other translation -- ruling 5,
            "M1 is KJV-only").
        xref_count:
          type: integer
          description: |-
            Batch M-D2 (owner's cross-reference superscript directive, closed on
            the graph platform): this verse's own `cites` edge-summary COUNT at
            its TextUnit locus -- read straight off THE PORT (`GraphQuery::
            edge_summary`, design doc §5), the SAME generic query the `/api/node/
            {id}` handler itself calls (`graph::node_card`) -- never a
            second, bespoke tally. This is a genuinely NEW field (no bespoke
            predecessor existed), sourced NATIVELY from the generic contract from
            day one: the reader's own superscript markers ARE a query of the
            graph, per the design's own P1/P4 laws, just batched onto the
            EXISTING per-chapter response (one HTTP round trip for a whole
            chapter) rather than issuing 20-30 individual `GET /api/node/{id}`
            calls per chapter, which `client/IExplorableClient.cs`'s own concrete
            implementation is what a SINGLE node's lookup uses (see that file's
            own doc comment + `GraphExplorableClientTests` for the direct,
            unbatched proof the same contract is correct in isolation). Always
            present (0 for the overwhelming majority of verses, never omitted --
            the client's own superscript decision is `count == 0` -> nothing,
            never a missing-field special case).
          minimum: 0
      additionalProperties: false
    VerseDetail:
      type: object
      required:
      - ref
      - text
      - words_of_christ
      - book_meta
      - events
      - cross_refs
      - catechism
      - provenance
      - cross_refs_provenance
      - catechism_provenance
      properties:
        book_meta:
          $ref: '#/components/schemas/BookMeta'
        catechism:
          type: array
          items:
            $ref: '#/components/schemas/CatechismRef'
          description: |-
            Batch F: catechism items citing this verse, via the SAME aggregation
            core `GET /api/catechism/{sref}` uses for a passage
            (`AtlasData::catechism_items_for_span`, a single-verse span here) --
            folded directly into this ALREADY-shared verse-detail fetch (rather
            than requiring a second round trip) so `CatechismSeamSection`
            (client) reads it off the exact same memoized `AtlasClient.Verse`
            call `VerseTextSectionProvider`/`CrossRefsSection` already share --
            "one fetch, not three," now not four either. Always present, possibly
            empty (most verses cite none) -- conditional presence lives on the
            CLIENT side (no section at all when empty), matching every other
            "always an array" field in this app's own wire.
        catechism_provenance:
          type: array
          items:
            type: string
          description: |-
            Batch PROV-1: the same, for THE SMALL CATECHISM section -- the
            `catechism` family's own distinct provenance set.
        cross_refs:
          type: array
          items:
            $ref: '#/components/schemas/CrossRef'
        cross_refs_provenance:
          type: array
          items:
            type: string
          description: |-
            Batch PROV-1: every distinct provenance id behind the CROSS
            REFERENCES section -- the owner's own headline case ("sourced from
            openbible.com"). A LIST, not a string, deliberately: the day a
            second cross-reference corpus lands, this section starts naming
            both instead of quietly continuing to name the first. It is the
            `cross_refs` FAMILY's own distinct set (`ProvenanceIndex::
            by_family`), which is a true statement about every individual row
            exactly while the family is single-sourced -- pinned as such by
            `atlas-graph/tests/provenance_registry_real_data.rs`, and honest
            either way, since a family that gained a second source would serve
            both here rather than pick one.

            Always present, possibly empty (a verse with no cross references),
            same "always an array" convention as `cross_refs` itself.
        events:
          type: array
          items:
            $ref: '#/components/schemas/VerseEvent'
        provenance:
          type: string
          description: |-
            Batch PROV-1 (owner order 1, "the source from which it came"): THIS
            VERSE's own source -- the provenance id of the `TextUnit` node
            `text` above was rendered from, read straight off `Node::provenance`
            (`kjv_adapter`: `"kjv"`). The focus card's own attribution: the
            affordance beside a verse says "The King James Version" because THIS
            field said `kjv`, never because a client-side default assumed it.
        ref:
          type: string
        text:
          type: string
        words_of_christ:
          type: array
          items:
            $ref: '#/components/schemas/WordsOfChristSpan'
          description: |-
            Batch RED-1: this verse's own aligned sub-verse red-letter spans --
            see `Verse.words_of_christ`'s own doc comment (identical shape/
            convention, this endpoint's own single-verse sibling).
      additionalProperties: false
    VerseEvent:
      type: object
      description: |-
        The verse-detail endpoint's event shape: `SceneEvent`'s fields
        (id/label/when/verse_groups) plus the event's place ids, so the client
        can jump from a verse to "explore this event on the map" without a
        second round trip.
      required:
      - id
      - label
      - verse_groups
      - places
      - kind
      - provenance
      properties:
        id:
          type: string
        kind:
          type: string
          description: |-
            Batch HOTFIX-4 requirement 6 (AFFORDANCE HONESTY): this EVENT-kind
            PASSAGE's own `Event::kind` ("event" | "general") -- same reason as
            `Heading::kind`, one surface over (a verse's own EVENT membership
            row, not a reader heading): the client applies the quiet,
            non-traversable styling to a general-kind row BEFORE the click, no
            second fetch needed to find out.
        label:
          type: string
        places:
          type: array
          items:
            type: string
        provenance:
          type: string
          description: |-
            Batch PROV-1 (owner order 1): THIS ROW's own source -- the
            provenance id of the Event NODE this membership row points at, read
            straight off `Node::provenance` (`event_world::event_provenance`:
            `"theographic"` for an imported event, `"curated"` for one this
            project authored). Additive-only, the `words_of_christ` precedent --
            every field above serves byte-identically to before this batch.

            Deliberately the TARGET NODE's provenance, not the `Attests` row's:
            this row answers "which event is this verse part of," and the honest
            attribution for THAT claim is whoever says the event exists. The
            `Attests` rows' own provenance is served where it is actually
            rendered -- `EventDetail::witnesses_provenance`, on the PARALLEL
            ACCOUNTS section.

            This field IS the genuinely mixed one: a verse belonging to both an
            imported event and a hand-authored one names BOTH sources on its own
            section heading, which is the total-capture-honesty case at the
            verse frontier.
        verse_groups:
          type: array
          items:
            $ref: '#/components/schemas/VerseGroup'
        when:
          oneOf:
          - $ref: '#/components/schemas/TimeRange'
            description: |-
              Batch HOTFIX-4 (drive-by fix, found while adding `kind` below):
              OMITTED (not the server's own internal undated placeholder) for a
              general-kind passage -- matches `EventDetail.when`'s own
              established fabrication guard exactly (`to_scene_event`'s own `se.when`
              is `e.when` unconditionally, which for `kind == "general"` is
              `TimeRange::undated()`, never meant to be presented as a real date).
              Dormant until now (this row's own CLIENT rendering only ever read
              `Id`/`Label`, never `When`), but a real gap against house doctrine
              nonetheless -- fixed here rather than left for a future reader of
              this exact struct to copy the bad precedent forward.
          - type: 'null'
      additionalProperties: false
    VerseGroup:
      type: object
      required:
      - book
      - chapter
      - verses
      - count
      properties:
        book:
          type: string
        chapter:
          type: integer
          format: int32
          minimum: 0
        count:
          type: integer
          format: int32
          minimum: 0
        verses:
          type: array
          items:
            type: string
      additionalProperties: false
    WordsOfChristSpan:
      type: object
      description: |-
        Batch RED-1 (owner order 2026-08-25, "Red letters on Jesus' words in
        every translation"): one sub-verse red-letter span, CHAR (not byte)
        offsets into this verse's own `text` field -- `graph.red_letter_spans`'s
        own doc comment has the full "why char offsets" (C# `string` indexing is
        UTF-16 code units; every character in this app's own KJV text is within
        the Basic Multilingual Plane, so char count == UTF-16 code unit count
        here, always). `start`/`end` are a half-open range (`text[start..end]`
        in C# `Substring(start, end-start)` terms) -- KJV display renders this
        EXACT sub-verse span; decision 5's own "ONE render rule."
      required:
      - start
      - end
      properties:
        end:
          type: integer
          minimum: 0
        start:
          type: integer
          minimum: 0
      additionalProperties: false
