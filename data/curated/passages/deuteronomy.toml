to_year = -1451
places = ["moab-1"]
verses = ["DEU.27.1-26", "DEU.28.1-68"]
atlas_section = "Deuteronomy pericope (this project's own sectioning, CC0 -- no external PD source claimed): Deuteronomy 27-28, Moses's own command to build an altar on Mount Ebal once in the land, the tribes divided for blessing and cursing, and the long roster of covenant blessings and curses."
ref_note = "Same traditional year as deu_love_and_obey, continuing the discourse. Place: Moses's own address at Moab, commanding a future ceremony at Ebal (not yet performed -- see Joshua 8)."

[[event]]
id = "deu_covenant_renewed_moab"
