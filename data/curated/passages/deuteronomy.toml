# Batch W1 (whole-Bible titled verse containers). Deuteronomy, in the SAME
# `[[event]]` schema `events-extra.toml` uses -- see
# `data/curated/passages/genesis.toml`'s own header comment for the full
# reconciliation/provenance framing.
#
# RECONCILIATION: 4 pre-existing events touch Deuteronomy before this file
# (theo-127's own DEU witness, the Ten Commandments, req 1b's own named
# case, landed in this batch's own first commit; theo-129 "Death of
# Moses," ex_moab, theo-121 -- all covering only chapter 34/the plains of
# Moab camp). theo-129 is enriched via atlas-sections.toml (already
# well-scoped, 12 verses, exactly Deuteronomy 34's own "Death of Moses"
# content) rather than duplicated with a new container.
#
# GRANULARITY: the whole book is ONE continuous discourse, dated "the
# fortieth year" (1:3, explicit) -- Moses's own three farewell addresses
# at the plains of Moab. Chapters 1-11 and 27-33 (historical recap,
# exhortation, the covenant ceremony, the Song and Blessing of Moses) are
# event-kind, same narrative/rhetorical-progression reasoning as this
# batch's own Numbers narrative chapters. Chapters 12-26 (the Deuteronomic
# law code proper, formally marked by its own "these are the statutes and
# judgments," 12:1) are general-kind, same "law = code units" reasoning
# as this file's own Leviticus/Numbers siblings, even though delivered
# within the same Moab speech.
#
# CHRONOLOGY: "the fortieth year" (1:3) = -1451 under the theo-*/Ussher
# scale this batch's own Numbers containers already established (against
# theo-125's own -1491 Exodus anchor) -- see numbers.toml's own header
# for the full disclosed two-layer tension against the pre-existing
# ex_moab (-1407, the "early date" scale).

[[event]]
id = "deu_recounts_journey"
label = "Moses recounts the journey from Horeb to Moab"
from_year = -1451
to_year = -1451
places = ["moab-1"]
verses = ["DEU.1.1-46", "DEU.2.1-37", "DEU.3.1-29"]
atlas_section = "Deuteronomy pericope (this project's own sectioning, CC0 -- no external PD source claimed): Deuteronomy 1-3, Moses's own historical review -- the journey from Horeb, the spies' own rebellion recalled, Edom and Moab passed, and the defeats of Sihon and Og."
ref_note = "'The fortieth year' (1:3), explicit. Place: 'on this side Jordan' (1:1, 1:5), the plains of Moab."

[[event]]
id = "deu_exhorts_obedience"
label = "Moses exhorts Israel to obey; cities of refuge appointed"
from_year = -1451
to_year = -1451
places = ["moab-1"]
verses = ["DEU.4.1-49"]
atlas_section = "Deuteronomy pericope (this project's own sectioning, CC0 -- no external PD source claimed): Deuteronomy 4, Moses's own exhortation against idolatry, and the three cities of refuge east of Jordan appointed."
ref_note = "Same traditional year, continuing the same discourse. Place: Moab."

[[event]]
id = "deu_recalls_horeb_commandment"
label = "Moses recalls Horeb; the people's fear, and the whole commandment"
from_year = -1451
to_year = -1451
places = ["moab-1"]
verses = ["DEU.5.1-5", "DEU.5.22-33"]
atlas_section = "Deuteronomy pericope (this project's own sectioning, CC0 -- no external PD source claimed): Deuteronomy 5:1-5 and 5:22-33, Moses's own framing of the Ten Commandments (5:6-21, already this batch's own req 1b named-case witness on theo-127) -- his own recollection of the assembly's fear at Horeb, and the LORD's own charge to teach 'all the commandments.'"
ref_note = "Same traditional year. Fills the two small gaps this chapter's own middle portion (the Commandments themselves) does not cover, deliberately not re-covering that portion again -- see theo-127's own witness row, data/curated/event-witnesses.toml."

[[event]]
id = "deu_love_and_obey"
label = "The great commandment; further exhortations to love and obey the LORD"
