verses = ["DEU.12.1-32", "DEU.13.1-18"]
atlas_section = "Deuteronomy code unit (this project's own sectioning, CC0 -- no external PD source claimed): Deuteronomy 12-13, sacrifice restricted to the place the LORD would choose, and the law against any who entice Israel to other gods."
ref_note = "General-kind, per this file's own header note on the law-code chapters."

