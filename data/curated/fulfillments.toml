[[fulfillment]]
prophecy = { from = "ISA.53.4" }
fulfillment = { from = "MAT.8.17" }
text = "That it might be fulfilled which was spoken by Esaias the prophet, saying, Himself took our infirmities, and bare our sicknesses."

[[fulfillment]]
prophecy = { from = "ISA.42.1", to = "ISA.42.4" }
fulfillment = { from = "MAT.12.17", to = "MAT.12.21" }
text = "That it might be fulfilled which was spoken by Esaias the prophet, saying, Behold my servant, whom I have chosen; my beloved, in whom my soul is well pleased: I will put my spirit upon him, and he shall shew judgment to the Gentiles."

[[fulfillment]]
prophecy = { from = "ISA.6.9", to = "ISA.6.10" }
fulfillment = { from = "MAT.13.14", to = "MAT.13.15" }
