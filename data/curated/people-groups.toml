# PG-1a ("People groups & eponymy: the data half" -- batch-pg1a-brief.md):
# owner orders (2026-08-23, verbatim): "we need a way to distinguish between
# the names of the twelve tribes and the people theyre named after and other
# sorts of cases." / "In the same way that we have a Person/Place info, we
# need to pull in Peoples or Nations info so I can find out who the
# ammonites are or whatever." This file is the curated half of that answer:
# nation seeds Theographic does not ship, the nine Gen-10 gentilic person
# records that are really collectives misfiled as individuals, and the
# eponymy (NamedAfter) rows grounding "who is X named after?" in Scripture.
#
# THREE independent array-of-tables (parsed together by
# `atlas_etl::curated::parse_people_group_seeds`; loaded by
# `atlas_etl::compile::compile`):
#
# [[group]]        a curated PeopleGroup node with NO Theographic
#                   counterpart (decision 1b).
#   id              stable PeopleGroupId raw string, kebab-case, never
#                   renumbered/repositioned.
#   label           display label.
#
# [[reclassify]]    an EXISTING Theographic PERSON record that is actually a
#                   Gen-10 gentilic collective, not an individual (decision
#                   1c) -- the graph adapter (`atlas_graph::peoples_adapter`)
#                   re-homes it to a PeopleGroup node under the SAME raw id;
#                   `person_adapter.rs` excludes it from Person-node/mentions
#                   construction. THE LIST IS CLOSED (nine slugs) --
#                   deliberately NOT here: "Garmite" (1CH 4:19's "Keilah the
#                   Garmite" is an individual's epithet, not a Gen-10 nation;
#                   it stays a person).
#   person_slug     the exact Theographic `Person.id` (e.g. "jebusite_748").
#   reason          one-line curator justification (CURATED DATA, decision
#                   1c: "not code constants").
#
# [[named_after]]   one eponymy row (decision 3): namesake (a PeopleGroup
#                   this batch, always) --named-after--> eponym (a person).
#   namesake_kind   "people_group" | "place" | "polity" (mirrors
#                   `atlas_graph_types::edge::Namesake`; every row this
#                   batch ships is "people_group").
#   namesake_id     the PeopleGroupId this row's `namesake_kind` names --
#                   for the 12 tribes + Nation of Israel, the id
#                   `atlas_etl::people_groups::slugify` derives from the
#                   Theographic `groupName` (e.g. "Tribe of Reuben" ->
#                   "tribe-of-reuben"); for the five curated nation seeds
#                   below, the `[[group]]` id above.
#   eponym          the Theographic person slug (`Person.id`) this
#                   namesake is named after. A row whose eponym resolves to
#                   NO real compiled person is OMITTED by the adapter, never
#                   a forced edge (decision 3's own Philistines/Amalekites/
#                   Canaanites conditional) -- reported in the batch report.
#   text            OPTIONAL short prose (KJV-inerrancy register: stated as
#                   fact, never hedged).
#   grounds         array of { from, to? } verse refs (canonical dot form,
#                   `to` optional, defaulting to `from`) -- becomes this
#                   row's `Justification.grounds` (>=1 `Ground::Scripture`
#                   entry required; law-checked, `peoples_adapter::tests`).
#
# Eponym person slugs below were resolved against the REAL committed
# `data/raw/theographic/.../people.json` (not guessed): every ambiguous
# name (Benjamin/Gad/Issachar/Joseph/Judah/Levi/Simeon each have multiple
# same-named Theographic records spanning later eras) was disambiguated by
# its OWN patriarchal-era `birthYear` field, independently cross-checked
# against that SAME record's own `memberOf` link back to the exact
# `peopleGroups.json` tribe record it belongs to -- both signals agree for
# all thirteen. "Jacob" needed the same care: the bare slug `jacob_683` is a
# LATER, unrelated NT-era person -- the patriarch renamed Israel is
# `israel_682` (`displayTitle: "Jacob (Israel)"`), confirmed via its own
# `dictionaryText` ("the name conferred on Jacob after the great
# prayer-struggle at Peniel, Genesis 32:28").

[[group]]
id = "ammonites"
label = "Ammonites"

[[group]]
id = "moabites"
label = "Moabites"

[[group]]
id = "edomites"
label = "Edomites"

[[group]]
id = "philistines"
label = "Philistines"

[[group]]
id = "amalekites"
label = "Amalekites"

[[group]]
id = "canaanites"
label = "Canaanites"

