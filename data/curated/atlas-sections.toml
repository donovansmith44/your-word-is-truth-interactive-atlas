# Batch W1 (whole-Bible titled verse containers): the general, whole-Bible
# sibling of acts-sections.toml -- see atlas_core::data::Event::
# atlas_section's own doc comment. Same schema, same purpose: PROMOTING a
# pre-existing bare Theographic-sourced event (already real title/date/
# place, CC BY-SA 4.0, already credited in LICENSES.md) to heading-worthy
# with no duplicate [[event]] row, for a well-scoped, single-scene span
# Theographic's own event data already draws sensibly. Deliberately NOT
# exhaustive -- most of the 190 pre-existing OT events this batch's own
# books touch are either genealogical micro-stubs (a single "birth of X"/
# "lifetime of X"/"death of X" verse or two, better served by ONE wider
# curated genealogy container in data/curated/passages/*.toml than by
# individually heading every stub) or already heading-worthy for free as
# an existing narrative's own leg -- enrichment here is reserved for
# events this batch judged BOTH well-scoped (a real single coherent scene,
# not a multi-scene mega-span better split by a purpose-built passages/
# container) AND collision-free against every passages/*.toml container
# this same batch authored (checked anchor-by-anchor before authoring,
# not merely hoped) and against every existing narrative leg's own anchor
# (narrative legs are LAYER 0, so no collision risk there structurally,
# but shadowing an already-shipped, already-tested narrative-leg heading
# with a same-or-earlier anchor was avoided anyway, on judgment, to keep
# this batch's blast radius narrow and reviewable).
#
# Every citation below was read directly against the compiled KJV text
# (data/compiled/verses-kjv.json) before being enriched, same
# citation-integrity discipline as every other curated file in this
# project.

