  [[item.question]]
  tier = "adult"
  prompt = "Luther says we should dread God's wrath and also love and trust Him. How do those two live together in one heart?"

[[item]]
id = "creed-1"

  [[item.question]]
  tier = "child"
  prompt = "Luther says God gave you your body, your eyes, and your ears. Name one part of you that God made."

  [[item.question]]
