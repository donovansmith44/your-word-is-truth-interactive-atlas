# event-witnesses.toml's own header describes. `order_key` is
# `<Robertson section number> * 10` uniformly across the WHOLE ministry
# (not just within one traditional year) -- harmless where years already
# differ (order_key only matters as a same-year tiebreak) and keeps every
# id's own order_key immediately legible against its own robertson_section
# without a lookup table. Lettered sub-sections (128a/128b) get *10/*10+5.
