# Batch W2 (whole-Bible titled verse containers, second run -- historical
# books). 1 Kings, in the SAME `[[event]]` schema `events-extra.toml`/
# W1's `passages/*.toml` files use.
#
# RECONCILIATION: the real compiled data shows 1 Kings already 607/816
# covered before this file, via a dense chain of well-scoped bare
# Theographic "Reign of X"/"Death of X" events (theo-160 through theo-184)
# -- see batch-w2-report.md's own reconciliation worksheet. TEN real gap
# ranges remained (209 verses total): 1:1-2:9 (David's last days/Solomon's
# succession, before theo-160/161 begin), 12:1-16 (the kingdom's own
# split), 14:21-31, 15:27-32, 16:9-14, 16:17-20, 16:31-34 (short northern-
# and southern-king reign-formula gaps between existing "Reign of X"
# stubs), 20:1-21:16 (Ben-hadad's wars, Naboth's vineyard), 22:1-40
# (Micaiah's prophecy, Ahab's death), and 22:45 (a single verse). All ten
# are closed below. This file ALSO authors a purpose-built set of finer
# containers across Solomon's own reign (2:12-11:43, otherwise only the
# bare theo-161/162 mega-spans) -- this run's own primary scaffolding for
# the Kings side of req 1b's Chronicles parallels, most significantly the
# TEMPLE DEDICATION (1ki_temple_dedication, below), the owner's own named
# acceptance case: "expanding a Kings/Chronicles-era event (a reign, the
# temple dedication) shows short expandable passages from EACH account,
# exactly like the Crucifixion's four Gospels." As with 2samuel.toml, the
# actual `[[witness]]` rows naming each container's own 2 Chronicles
# parallel are authored together with 2 Chronicles' own coverage (a later
# commit this same run) -- see each container's own `ref_note`.
#
# CROCKETT PROTOCOL (req 1b): see LICENSES.md and batch-w2-report.md for
# the full source/verification/fetch record. Every citation naming a
# Crockett section number was independently checked against the compiled
# KJV text before being written.
#
# CHRONOLOGY, disclosed: continues the theo-*/Ussher scale, anchored
# directly to the pre-existing theo-160 ("Death of David," -1015) through
# theo-184 ("Reign of Ahaziah," -898) chain -- every container below sits
# adjacent to, and was interpolated from, its own nearest pre-existing
# neighbor(s), never independently re-derived. ONE further pre-existing
# cross-scale tension, discovered (not introduced) during this file's own
# authoring, disclosed here rather than silently papered over: `theo-178`
# ("Reign of Ahab," -918) implies, together with the text's own stated
# 22-year reign length (16:29), an Ahab death year near -896 -- but the
# ALREADY-SHIPPED `elijah` narrative's own last two legs (`el_horeb`,
# `el_abel_meholah`, both within Ahab's reign, chapters 19) are dated
# -865/-864, a further ~30 years on. This file's own three Ahab-adjacent,
# non-Elijah containers (Ben-hadad's wars, Naboth's vineyard, Ahab's
# death) stay on the `theo-178` reign-length scale, for consistency with
# the surrounding "Reign of X" chain this file otherwise interpolates
# within throughout; the pre-existing `elijah` narrative itself is
# untouched, not this batch's own to reconcile (the same "discovered,
# disclosed, not fixed" disposition W1's own report already established
# for two comparable pre-existing tensions in Genesis/Exodus).

