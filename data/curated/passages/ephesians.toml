verses = ["EPH.2.1-10"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Ephesians 2:1-10, believers once 'dead in trespasses and sins' made alive together with Christ, 'by grace are ye saved through faith... not of works, lest any man should boast.'"

[[event]]
id = "eph_one_new_man_jew_and_gentile_reconciled"
