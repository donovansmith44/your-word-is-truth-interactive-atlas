antitype_passage = { from = "JHN.6.48", to = "JHN.6.51" }
note = "the manna"
text = "I am that bread of life. Your fathers did eat manna in the wilderness, and are dead... I am the living bread which came down from heaven: if any man eat of this bread, he shall live for ever."

[[typology]]
