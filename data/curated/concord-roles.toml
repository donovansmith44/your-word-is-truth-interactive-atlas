# A [[heading]] reads one heading node of a page, by document, slug and its
# exact text, `as` the Triglot's own wording (`with`, checked on `triglot_page`
# and then admitted against the scan like any heading), as `confirmed` (the
# scan garbles it; the page shows it), or as `our-wording` (the Triglot prints
# no such heading; served as our own words, Editorial).

