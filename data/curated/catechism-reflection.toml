  [[item.question]]
  tier = "youth"
  prompt = "The article ends 'without any merit or worthiness in me.' Why does Luther add that?"

  [[item.question]]
  tier = "adult"
  prompt = "If God gives daily bread even to the wicked, what is distinctive about a Christian's confession of creation?"

[[item]]
id = "creed-2"

  [[item.question]]
  tier = "child"
  prompt = "Who is Jesus, according to the Creed?"

  [[item.question]]
  tier = "child"
  prompt = "Luther says Jesus has redeemed me -- bought me back. What does it mean to buy something back?"

  [[item.question]]
  tier = "youth"
