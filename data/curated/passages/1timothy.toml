# Batch W5 (whole-Bible titled verse containers, fifth run). 1 Timothy.
# KIND POLICY (applies across this whole W5 slice, stated here once, per
# the master brief's own requirement 2, "KIND DISCIPLINE"): every
# container in this file is GENERAL-kind (undated, placeless) -- a
# letter's own teaching content is not a datable occurrence, and Theographic's
# own dated "X writes Y" EVENT nodes (where any exist) are a DIFFERENT
# identity from these content containers -- never merged into them, never
# given a fabricated dated twin. See batch-w5-report.md for the full
# reconciliation sweep against the real compiled events.json.
#
# GRANULARITY: 1 Timothy's own real seams -- the charge against false
# teachers, worship and church order (qualifications for bishops and
# deacons), warnings for the last times, and instructions for particular
# groups (widows, elders, servants, the rich).

[[event]]
id = "1ti_salutation_and_the_charge_against_false_teachers"
label = "Salutation; the charge against false teachers of the law"
kind = "general"
verses = ["1TI.1.1-11"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): 1 Timothy 1:1-11, Paul's own greeting to Timothy, and the charge to remain at Ephesus against those who teach 'fables and endless genealogies' rather than 'the glorious gospel of the blessed God.'"

