# The Seleucid Empire at its height (following Ipsus 301 BC and Corupedium
# 281 BC): Anatolia and the Aegean coast in the west across Mesopotamia and
# Persia to Bactria in the east -- the empire of Antiochus III and,
# infamously to Daniel/1-2 Maccabees, Antiochus IV Epiphanes. Southern
# boundary sits at central Syria/upper Mesopotamia, short of Egypt (still
# Ptolemaic through most of this era -- see egypt.toml).
[[era]]
name = "Seleucid Empire"
from = -301
to = -150
ref_note = "fetched en.wikipedia.org/wiki/Seleucid_Empire 2026-08-19 for territorial extent (Aegean coast/eastern Anatolia west to Bactria/Afghanistan east; Mesopotamia and the Levant south to central Syria)"
