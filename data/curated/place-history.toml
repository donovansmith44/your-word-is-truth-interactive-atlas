  # Year matches the compiled theo-87 event ("Nimrod's kingdom begins"),
  # which cites the same GEN.10.8-12 passage -- kept aligned so the
  # established-date node and the lit map event agree exactly.
  verses = ["GEN.10.11"]
  note = "traditional"

  [[place.blurb]]
  text = "Founded by Asshur out of Nimrod's kingdom of Babel, Nineveh grew into one of the great cities of the ancient Near East."
  from = -4004
  to = -1407
  breadth = "era"

  [[place.blurb]]
