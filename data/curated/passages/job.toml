from_year = -1650
to_year = -1580
places = ["uz"]
verses = ["JOB.42.7-17"]
atlas_section = "Job pericope (this project's own sectioning, CC0): Job 42:7-17, the Lord's own rebuke of Eliphaz, Bildad, and Zophar for not speaking rightly of him as Job had, Job's own prayer for his friends, his own restoration to twice what he had before, ten more children, and his death 'being old and full of days' at one hundred and forty years afterward."
