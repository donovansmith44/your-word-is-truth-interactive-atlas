kind = "general"
verses = ["HEB.12.1-13"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Hebrews 12:1-13, the charge to run 'with patience the race... looking unto Jesus the author and finisher of our faith,' and chastening received 'as with sons,' yielding 'the peaceable fruit of righteousness.'"

[[event]]
id = "heb_a_warning_against_profanity_mount_sion_not_sinai"
