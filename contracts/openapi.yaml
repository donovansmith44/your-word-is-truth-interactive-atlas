        '500':
          description: The request was well formed but this atlas's own data for it is incomplete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/scene/scripture:
    get:
      tags:
      - map
      summary: 'The map for a passage: the places its verses name, and the arrows narratives draw between them.'
      description: |-
        `ref` is a dotted reference -- `GEN.12`, `GEN.12.1` or `GEN.12.1-5` -- and a
        missing or unparseable one is `bad_ref`. A reference that parses but names
        coordinates outside this atlas's canon composes an empty scene rather than
        failing.
      operationId: scene_scripture
      parameters:
      - name: ref
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scene'
        '400':
          description: The reference, window or query could not be read; the body's `code` is `bad_ref`.
          content:
