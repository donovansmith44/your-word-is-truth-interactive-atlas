# R-C2-R7 (owner, 2026-09-30): "Jesus is the Son of God. not just Adam and Eve."
# This project's own work, CC0 1.0 Universal.
#
# Every parent-of row is NATURAL unless it is declared here. A declaration
# names the parent and the child (Theographic person ids), the kind of
# parentage Scripture teaches, and the Scripture grounds the row carries as
# its justification (canonical dot-refs, one verse each). The compile fails
# loud on an unknown person, a natural declaration, a declaration without
# grounds, or a pair declared twice. A declared pair the source lacks is
# added; a declared pair the source states is typed.
#
# kind: eternal | virgin | legal | created
#
# An [[exclusion]] names a parent -> child pair the source states and this
# atlas refuses (R-C2-R9): the compile fails loud unless the source states
# the pair, and the pair then yields no row at all.

# The Father begets the Son from eternity: "the only begotten of the Father"
# (John 1:14), "the only begotten Son, which is in the bosom of the Father"
# (John 1:18), "he gave his only begotten Son" (John 3:16), "This is my
# beloved Son" (Matt 3:17). Theographic does not state this row; it is added.
[[parentage]]
parent = "god_1324"
child = "jesus_905"
kind = "eternal"
grounds = ["JHN.1.14", "JHN.1.18", "JHN.3.16", "MAT.3.17"]

# Conceived by the Holy Ghost, born of the Virgin Mary (Luke 1:35; Matt 1:20).
[[parentage]]
parent = "mary_1938"
child = "jesus_905"
kind = "virgin"
grounds = ["LUK.1.35", "MAT.1.20"]

# "being (as was supposed) the son of Joseph" (Luke 3:23).
[[parentage]]
parent = "joseph_1715"
child = "jesus_905"
kind = "legal"
grounds = ["LUK.3.23"]

# "Adam, which was the son of God" (Luke 3:38).
[[parentage]]
parent = "god_1324"
child = "adam_78"
kind = "created"
grounds = ["LUK.3.38"]

# Theographic states God as Eve's father too. God made her from the rib He
# took from Adam (Gen 2:22).
[[parentage]]
parent = "god_1324"
child = "eve_1231"
kind = "created"
grounds = ["GEN.2.22"]

# R-C2-R9 (owner, 2026-09-30): Mary is ever virgin (Smalcald Articles I.IV;
# Formula of Concord SD VIII.24). Theographic makes James, Joses, Simon and
# Jude children of Mary and of Joseph. Scripture calls them the Lord's
# "brethren" (Matt 13:55; Mark 6:3; Gal 1:19) and never says whose sons they
# were, so neither parent row stands. brethren.toml links them to Jesus.

[[exclusion]]
parent = "mary_1938"
child = "james_719"
grounds = ["MAT.13.55", "MRK.6.3", "GAL.1.19"]

[[exclusion]]
parent = "joseph_1715"
child = "james_719"
grounds = ["MAT.13.55", "MRK.6.3", "GAL.1.19"]

