ref_note = "GENERAL-kind, per this file's own header note -- no date of its own claimed for this second-part oracle, consistent with this file's own header policy, even though narrated in a vivid first-person sign-act voice."

[[event]]
id = "zec_jerusalem_cup_of_trembling"
