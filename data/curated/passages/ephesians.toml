atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Ephesians 2:11-22, Christ 'our peace, who hath made both one,' breaking down 'the middle wall of partition' to make Jew and Gentile 'one new man,' built together 'for an habitation of God through the Spirit.'"

[[event]]
id = "eph_the_mystery_of_christ_revealed"
