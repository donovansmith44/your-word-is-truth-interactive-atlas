# Batch E: curated place history (period-true names, hover blurbs, and
# biblically-supported established/destroyed dates). One [[place]] table per
# covered place id -- ids are the REAL compiled `data/compiled/places.json`
# ids (post geo-collision disambiguation, e.g. "bethel-1" not "bethel"; see
# each place's own comment where the id needed disambiguating), since only
# ids events actually reference ever get lit on the map at all.
#
# CITATION INTEGRITY (standing project rule): every `verses` entry below was
# checked against `data/compiled/verses-kjv.json` (raw KJV text) as it was
# written -- see each place's own comment for what the cited verse actually
# says and why it supports the claim next to it.
#
# Coverage floor (batch-e-brief.md): every place with a curated event in >=2
# narratives (computed from data/curated/narratives/*.toml + events-extra.toml:
# babylon-1, beersheba-2, bethany-1, bethel-1, egypt, haran, hebron, jericho-1,
# jerusalem, shechem), PLUS the mandated renames (Luz->Bethel, Jebus->
# Jerusalem) and the mandated extra places (Jerusalem, Babylon, Nineveh,
# Shechem, Hebron, Dan, Rome, Antioch), PLUS a few well-supported extras
# (Samaria, Shiloh, Capernaum, Damascus) chosen for their own strong,
# independently-checkable citations. 18 places total.
#
# Proleptic naming (a recurring wrinkle, documented once here rather than
# repeated per place): several "at the first" / "before" verses (GEN.28.19,
# GEN.23.2, JOS.14.15, JDG.18.29, JDG.19.10) assert an OLD name without
# pinning an exact calendar year, and Genesis/Joshua's own narration often
# already uses the LATER name for events that chronologically precede the
# rename story itself (e.g. GEN.12.8, dated -2091 in ab_bethel, already says
# "Beth-el" -- 160 years before Jacob's own naming of it in GEN.28.19 at
# -1930). Every boundary year below was chosen so the curated name NEVER
# contradicts a verse already shown, verbatim, on the same place's card for
# an overlapping window -- preferring an earlier cutover (before the
# earliest compiled event that already uses the later name) over a
# textually-neat but contradiction-prone one. See batch-e-report.md for the
# full reasoning per place.

# --- Bethel / Luz (GEN.28.19) ---------------------------------------------
# id disambiguation: geo ancient.jsonl collides "Bethel" into bethel-1/2/3;
# every compiled event that touches this story (ab_bethel, jj_bethel_dream,
# jj_bethel_return) uses bethel-1 (see events-extra.toml's own comments).
# Default compiled name is "Bethel 1" (the raw collision-disambiguation
# suffix) -- this is the one place in this file where a plain rename-window
# alone wouldn't finish the picture (a window outside every curated range
# would fall back to that ugly suffixed default), so BOTH names are curated
# below, jointly covering the whole atlas span, purely so the flagship
# Luz/Bethel swap (batch-e-brief.md's "money shot") reads "Luz" -> "Bethel",
# not "Luz" -> "Bethel 1". This is a deliberate, narrow exception -- no
# other place in this file gets a "current name" entry, only genuine
# renames get one.
[[place]]
id = "bethel-1"

  [[place.name]]
  name = "Luz"
  from = -4004
  to = -2092
  # GEN.28.19: "And he called the name of that place Beth-el: but the name
  # of that city was called Luz AT THE FIRST." Cutover set to end just
  # before ab_bethel (-2091/-2090, GEN.12.8), which already narrates Abram
  # calling on the Lord "on the east of Beth-el" -- i.e. Genesis's own
  # narration already treats "Beth-el" as the live name by Abram's arrival,
  # well before Jacob's own dream (-1930) formalizes it. "Luz" is therefore
  # curated as the pre-patriarchal (Canaanite) name only.
  verses = ["GEN.28.19"]

  [[place.name]]
  name = "Bethel"
  from = -2091
  to = 100
  # Same verse, other half of its claim: the place WAS named Beth-el
  # ("house of God") -- matches every bethel-1 event from ab_bethel (-2091)
  # onward, whose own verses (GEN.12.8, GEN.28.11-19, GEN.35.1-7) all already
  # say "Beth-el".
  verses = ["GEN.28.19"]

  [[place.blurb]]
  text = "Abram built an altar here on first entering Canaan, and a generation later his grandson Jacob dreamed of a ladder to heaven and named the place the house of God."
  from = -2091
  to = -1877
  breadth = "era"

  [[place.blurb]]
  text = "After the kingdom split, Jeroboam set up a golden calf shrine here to rival the temple at Jerusalem."
  from = -931
  to = -587
  breadth = "era"

# --- Jerusalem / Jebus (JDG.19.10) ----------------------------------------
[[place]]
id = "jerusalem"

  [[place.name]]
  name = "Jebus"
  from = -4004
  to = -1004
  # JDG.19.10: "...came over against Jebus, WHICH IS JERUSALEM..." -- a
  # judges-period traveler's-eye gloss equating the two, cited generally
  # (not time-boxed to that one narrative moment) the same way JOS.14.15
  # explains Hebron's old name below. Cutover at -1004/-1003 matches the
  # established date immediately below (David's conquest); no compiled
  # jerusalem-tagged event predates the conquest with a verse that already
  # says "Jerusalem" EXCEPT theo-159 ("Reign of David", Theographic-sourced,
  # nominally dated -1055 at the start of David's Hebron-only kingship but
  # carrying 668 verses spanning his WHOLE 40-year reign, many post-conquest)
  # -- a pre-existing bucket-event/single-timestamp modeling limitation in
  # the compiled data, not something any boundary choice here can fully
  # avoid; see batch-e-report.md.
  verses = ["JDG.19.10"]

  [place.established]
  year = -1003
  # 2SA.5.6: David marches on the Jebusites at Jerusalem; 2SA.5.7: "David
  # took the strong hold of Zion: the same is the city of David"; 2SA.5.9:
  # "David dwelt in the fort, and called it the city of David." Year is
  # traditional -- 2 Samuel gives no calendar year, only "seven years and
  # six months" in Hebron before this (2SA.5.5), which is where -1003 comes
  # from (df_hebron's own -1010 Hebron-anointing + ~7.5 years).
  verses = ["2SA.5.6", "2SA.5.7", "2SA.5.9"]
  note = "traditional"

  [place.destroyed]
  year = -586
  # 2KI.25.9: "he burnt the house of the LORD, and the king's house, and all
  # the houses of Jerusalem..."; 2KI.25.10: "...brake down the walls of
  # Jerusalem round about." Matches the already-curated exl_jerusalem event
  # exactly (events-extra.toml, -586). No "traditional" qualifier -- 2 Kings
  # 25 ties this to an explicit regnal-year chain (Zedekiah's 9th/11th
  # years), the firmest-dated event in this file.
  verses = ["2KI.25.9", "2KI.25.10"]

  [[place.blurb]]
  text = "Once the Jebusite stronghold of Jebus, the city became Israel's capital after David's conquest and the site of Solomon's temple, until Babylon burned it in 586 BC."
  from = -4004
  to = -587
  breadth = "era"

  [[place.blurb]]
  text = "Rebuilt after the exile as the Second Temple city, Jerusalem was the setting for Jesus' final week, his crucifixion and resurrection, and the birth of the church."
  from = -538
  to = 100
  breadth = "era"

  [[place.blurb]]
  text = "Jerusalem's story runs from a Canaanite hill fort through the City of David, two temples, and the birth of the church."
  from = -4004
  to = 100
  breadth = "broad"

# --- Hebron / Kirjath-arba (GEN.23.2) -------------------------------------
[[place]]
id = "hebron"

  [[place.name]]
  name = "Kirjath-arba"
  from = -4004
  to = -2092
  # GEN.23.2: "Sarah died in Kirjath-arba; the SAME IS Hebron"; JOS.14.15:
  # "the name of Hebron BEFORE was Kirjath-arba; which Arba was a great man
  # among the Anakims" -- an explicitly pre-Israelite (Anakite) naming.
  # Cutover set just before ab_hebron (-2088, GEN.13.18 "...in the plain of
  # Mamre, which is in Hebron") -- Genesis already calls it "Hebron" from
  # Abram's own arrival, so "Kirjath-arba" is curated as the older,
  # pre-patriarchal name only (same reasoning as bethel-1 above).
  verses = ["GEN.23.2", "JOS.14.15"]

  [[place.blurb]]
  text = "Abraham pitched his tents at Mamre near Hebron and bought a field here to bury Sarah; his son Isaac and grandson Jacob were later buried in the same cave."
  from = -2091
  to = -1876
  breadth = "era"

  [[place.blurb]]
  text = "David was anointed king here and reigned from Hebron for seven years before capturing Jerusalem."
  from = -1013
  to = -1003
  breadth = "era"

