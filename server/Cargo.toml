# STANDING COUNTING PROCEDURE ADDENDUM -- THE COUNTING LAW (Batch AQC-1
# fix round 1, controller ruling, mandatory from this batch onward): a
# `harness = false` runner (`aqc_cucumber.rs`) never prints a `test
# result: ok. N passed` line, so its own scenario/step count structurally
# cannot join the mechanical sum above -- folding it in would be an
# arithmetic fiction. Report it as a MANDATORY companion line instead,
# every time the canonical line is reported (baseline block AND close
# block), and treat a change in either number as its own STOP condition,
# exactly like a change in the canonical total:
#
#   canonical <TOTAL> (workspace <W> + atlas-graph-types <T>) across <S> sections
#   AQC corpus: <X> scenarios / <Y> steps (harness=false; NOT in the canonical sum)
#
# The dotnet line carries the matching parity check: `client.Tests <N>/<N>
# | client.ContractTests <X>/<X>` -- client.ContractTests's own count MUST
# equal the AQC line's `<X>` (Reqnroll emits one xunit test per scenario);
# both `tests/aqc_corpus_generation.rs::declared_scenario_count_matches_
# the_pinned_corpus_size` and `client.ContractTests/CorpusCountTests.cs`
# assert this mechanically now, not just report it.
#
