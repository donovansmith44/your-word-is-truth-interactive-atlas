[[item]]
id = "creed-3"

  [[item.question]]
  tier = "child"
  prompt = "Who helps us believe in Jesus?"

  [[item.question]]
  tier = "child"
  prompt = "Luther says the Holy Ghost gathers the whole Christian Church. What is the Church?"

  [[item.question]]
  tier = "youth"
  prompt = "Luther says 'I cannot by my own reason or strength believe.' Why is that good news rather than bad news?"

  [[item.question]]
  tier = "youth"
  prompt = "How does the Holy Ghost call, gather, enlighten, and sanctify?"

  [[item.question]]
  tier = "adult"
  prompt = "Luther grounds faith itself in the Spirit's work. What does that say about assurance, and about how we evangelize?"

[[item]]
