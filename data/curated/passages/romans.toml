kind = "general"
verses = ["ROM.11.33-36"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 11:33-36, the closing doxology of the letter's own doctrinal half -- 'O the depth of the riches both of the wisdom and knowledge of God!'"

[[event]]
id = "rom_living_sacrifices_and_gifts_that_differ"
