# Herodian Kingdom of Judea: Herod the Great's own client kingdom (the
# Christmas narrative's Herod, Matthew 2) -- similar footprint to the
# Hasmonean kingdom he inherited, extended further northeast into
# Trachonitis/Auranitis/the Golan (granted to Herod by Augustus). Ends
# with Herod's death (4 BC); no separate Judah polity is drawn through
# most of the Gospels/Early Church eras that follow (Judea reverts to
# direct Roman administration -- see roman-empire.toml). Fix round 1 (M3):
# fetched en.wikisource.org/wiki/The_New_International_Encyclopaedia/Herod
# and 1911 Encyclopaedia Britannica's own .../Agrippa,_Herod,_I. 2026-08-20
# to ground this era. The New International Encyclopedia's own account of
# Herod's will (his kingdom split three ways on his death) names "Judea,
# including Samaria and Idumea" (Archelaus), "Galilee and Perea" (Antipas),
# and "Gaulanitis, Auranitis, Trachonitis, Batanea, and Panias" (Philip) as
# the WHOLE kingdom's own constituent regions; Britannica's Agrippa I
# article separately confirms "Batanaea and Trachonitis" as territory
# Philip "had formerly possessed." The ring's NE corner was extended
# (toward ~36.3-36.5 lon, the Hauran plateau) to actually reach Auranitis/
# Trachonitis/Batanea, which the previous shape did not reach at all -- a
# real, source-driven adjustment, not merely a confirmation.
[[era]]
