to_year = -1097
places = ["ramah-4"]
verses = ["1SA.8.1-22"]
atlas_section = "1 Samuel pericope (this project's own sectioning, CC0): 1 Samuel 8, Samuel's own sons' corruption as judges, the elders' own demand for a king 'like all the nations,' Samuel's own warning of what a king would take, and the Lord's own instruction to heed the people's voice."
ref_note = "Place: the elders 'gathered themselves together, and came to Samuel unto Ramah' (8:4), explicit. Placed shortly before Saul's own private anointing (sam_saul_seeks_asses, immediately below) and the pre-existing theo-155/156 anchor at -1095."

[[event]]
id = "sam_saul_seeks_asses"
label = "Saul seeks the asses and meets Samuel"
from_year = -1096
to_year = -1095
places = ["ramah-4"]
verses = ["1SA.9.1-27"]
atlas_section = "1 Samuel pericope (this project's own sectioning, CC0): 1 Samuel 9, Kish's own lost asses, Saul's own search leading him to 'the city' where the seer Samuel is, Samuel's own private word from the Lord the day before, and their meeting at the high place and Samuel's own house."
ref_note = "Place: the unnamed city (9:6, 9:10-14) is a disclosed contextual identification with Samuel's own home town, established explicitly at 1:19/7:17 -- Ramah (geographic identification from context, not textual criticism; the chapter itself never re-names the city). Closes the year before the pre-existing theo-155/156 anchor ('Reign of Saul'/'United Kingdom,' -1095, 1 Samuel 10:1 onward, untouched by this file) -- Saul's own private anointing, 10:1, is the very next verse after this container's own close at 9:27."
