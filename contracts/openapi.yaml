  /api/scene/scripture:
    get:
      tags:
      - map
      summary: 'The map for a passage: the places its verses name, and the arrows narratives draw between them.'
      description: |-
        `ref` is a dotted reference -- `GEN.12`, `GEN.12.1` or `GEN.12.1-5` -- and a
        missing or unparseable one is `bad_ref`. A reference that parses but names
