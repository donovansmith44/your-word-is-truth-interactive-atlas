# Role corrections to the Concord source markup (FOCUS-3, owner ruling A1).
# The markup gives a node its default role: an unmarked heading or an all-bold
# paragraph is a Heading, every other node is Text. Each row here names one
# source node of a vendored page (document, article slug, its exact text; and
# `occurrences` when the same words occur more than once in that article), the
# role the 1921 Concordia Triglotta gives it, the Triglot page checked (the
# Internet Archive scan concordiatriglot00unse), and what the page shows.
# A row that matches no node, matches a different number of nodes, or names
# the role the markup already gives refuses the compile.

