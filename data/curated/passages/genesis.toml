# Batch W1 (whole-Bible titled verse containers, owner directive
# 2026-08-21: "do everything that you did for the Gospels and acts with the
# labeled containers of verses for the whole Bible"). Genesis, in the SAME
# `[[event]]` schema `events-extra.toml` uses (`atlas_etl::curated::
# parse_events_extra`, reused unmodified -- see main.rs's own `read_passages`
# doc comment for why this lives in a separate per-book file rather than
# growing events-extra.toml further).
#
# RECONCILIATION (req 1, "an existing event container absorbs its verses;
# new containers cover the rest"): every container below fills a verse
# range this batch's own gap analysis (against the real compiled
# events.json, not a guess) found in NO existing container -- 136
# pre-existing events already touch Genesis (Theographic's own dated
# events, the abraham-migration/jacob-journeys/joseph-to-egypt narratives'
# own legs) -- see batch-w1-report.md's own coverage table for the full
# before/after. A few containers below deliberately WIDEN slightly past a
# strict gap boundary to close on a natural pericope edge (e.g. absorbing
# one already-covered verse at a chapter's start/close) -- legal overlap
# per the container-algebra doctrine, never a duplicate (no container here
# re-covers a whole existing container's own span).
#
# PROVENANCE: every title below is this project's OWN CC0 phrasing
# (`atlas_section`, the sanctioned Acts-precedent fallback -- no external
# PD OT-sectioning source consulted or claimed); genealogical/list material
# (kind="general") follows the brief's own explicit granularity guidance
# ("genealogies = their own units").
#
# CHRONOLOGY, DISCLOSED TENSION: this batch discovered a genuine
# PRE-EXISTING two-layer dating inconsistency in the already-shipped OT
# data -- the abraham-migration/jacob-journeys/joseph-to-egypt narratives'
# own legs (ab_*/jj_*/je_* ids) date the patriarchal period roughly 90-190
# years EARLIER than Theographic's own dense birth/death/lifetime event
# chain (theo-* ids) for the SAME approximate narrative period (e.g.
# jj_beersheba dates Jacob's own departure for Haran to -1930, while
# Theographic's own theo-85 dates Jacob's BIRTH to -1836 -- 94 years after
# his own narrative-leg departure date, an impossibility taken together).
# Neither scale is this batch's own to re-date (both are already-shipped,
# previously-reviewed data from prior batches; a full OT chronology
# reconciliation is real, substantial future work, out of this batch's own
# authoring-scope, exactly the class of thing batch-t2-report.md already
# disclosed for a parallel Acts-dating tension). This batch's OWN new
# events below are dated against the theo-* chain specifically (denser,
# and independently cross-checked against real Ussher-tradition years for
# the handful of well-attested anchors -- Ishmael born 1910 BC, Sodom/
# circumcision 1897-1898 BC, Isaac born 1896 BC -- all confirmed to match
# theo-76/79/80 exactly), so THIS file's own dates are internally
# consistent with each other and with Theographic's own chain, but will
# read as chronologically offset from the pre-existing ab_*/jj_*/je_*
# narrative legs on the map's own time slider -- disclosed here and in the
# batch report, not silently left for a future curator to puzzle over.
# Where several of this file's
# own events fall within one tightly-packed narrative stretch with no
# independent yearly anchor of their own (Jacob's return from Haran through
# Rachel's death, all traditionally "that same year"), `order_key` records
# their relative sequence within one shared year -- the SAME sub-year
# tiebreak mechanism Passion Week already established -- rather than
# fabricating fake distinct years.

