[package]
name = "atlas-contract"
version = "0.1.0"
edition = "2021"

[[test]]
# Batch AQC-1's own Rust contract harness (spec §3) -- `harness = false`
# because this binary IS its own test runner (cucumber's `World::run`,
# not `#[test]`-per-function); it still shows up under `cargo test
# --workspace` as one more section, joining the standing canonical count.
name = "aqc_cucumber"
path = "tests/aqc_cucumber.rs"
harness = false

[[bin]]
# Batch AQC-1's own provider-side Examples: exporter (spec §3) -- named
# explicitly, at a path OUTSIDE `src/bin/` (this repo's own root
# `.gitignore` carries a broad `**/bin/` rule, meant for the Blazor
# client's own .NET build-output `bin/` directories -- the SAME disclosed
# workaround `atlas-graph`'s `compile_graph.rs`/`atlas-etl`'s
# `gen_sources.rs` already use): source lives at
# `src/bins/export_aqc_examples.rs`.
name = "export_aqc_examples"
path = "src/bins/export_aqc_examples.rs"

[[bin]]
# CONTRACT-1a: the published contract documents' own exporter, at a path
# outside `src/bin/` for the same disclosed reason as the sibling above.
name = "export_contract"
path = "src/bins/export_contract.rs"

[dependencies]
atlas-core = { path = "../atlas-core" }
atlas-etl = { path = "../atlas-etl" }
atlas-graph = { path = "../atlas-graph" }
# DB-4a: canon-ids ON for the atlas -- SHA-256-128 pids, canonical edge ids, the
# manifest root. graph-types' own default stays off for the sibling repo.
atlas-graph-types = { path = "../../graph-types", features = ["canon-ids", "serde", "openapi"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
utoipa = { version = "6.0.0", features = ["yaml", "axum_extras"] }
utoipa-axum = "0.3.0"
utoipa-swagger-ui = { version = "10.0.1", features = ["axum", "vendored"], optional = true }

[features]
# CONTRACT-1a: the Swagger UI ships only to a developer's own build -- a
# served docs page is not part of the API contract.
dev-docs = ["dep:utoipa-swagger-ui"]

[dev-dependencies]
http-body-util = "0.1"
# Batch AQC-1: the Gherkin cucumber harness (dev-dependency -- MIT/Apache-2.0
# dual license, disclosed in the batch report) binding contracts/atlas-
# query-contract/features/*.feature against the live axum handlers
# in-process (tests/aqc_cucumber.rs's own `real_app()`-idiom World).
cucumber = "0.23"
futures = "0.3"
# Batch PERF-2a Phase 1: the permanent criterion regression harness (own
# bench target, deliberately NOT part of `cargo test`'s own count -- see
# server/Cargo.toml's own STANDING COUNTING PROCEDURE comment and this
# crate's `benches/queries.rs`).
criterion = "0.5"

[[bench]]
name = "queries"
harness = false
