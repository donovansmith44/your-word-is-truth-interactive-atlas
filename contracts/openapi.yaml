          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    $ref: '#/components/schemas/ErrorInner'
                additionalProperties: false
        '404':
          description: not_found
          content:
            application/json:
              schema:
                type: object
