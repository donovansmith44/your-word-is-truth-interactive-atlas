# of the World (1658, long public domain) for the OT, this atlas's own
# already-established AD-33 Passion anchor (HOTFIX-4) for the NT.
#
# BATCH HOTFIX-7 (single-feed chronology migration, owner directive
# 2026-08-22, near-verbatim: "do all our narratives/dates feed from the
# same table? if not, they should."): this table stopped being a
# VALIDATION-only reference and became the RESOLUTION source every curated
# event's own date is computed FROM, at ETL time
# (`atlas_core::date_resolve::resolve_curated_dates`) -- see that module's
# own doc comment for the four resolution forms (anchor binding /
# anchor-relative / sequence / era placement) a curated `[[event]]` row now
# authors instead of an inline year literal. Three structural changes this
# batch made to the table itself, alongside that migration:
#
# 1. THE FOUR TYPED DEFERRALS RESOLVED. `jerusalem-falls`/`cyrus-decree`/
#    `temple-finished`/`ezra-returns` were each bound (`event_id` set) but
#    flagged `atlas_core::chronology::ANCHOR_DEFERRALS` (HOTFIX-6 fix round
#    1) because their own bound event still shipped an OLDER,
#    modern-scholarly value pending this exact migration. That migration is
#    THIS batch: every dependent event now resolves its own date FROM this
#    table (directly, or transitively through a `after =` sequence chain
#    that terminates at one of these four), so each anchor's own `year`
#    below and its bound event's own compiled `from_year` are the SAME
#    fact now, not two independently-authored ones that happened to
#    (mostly) agree. `ANCHOR_DEFERRALS` itself STAYS in
#    `atlas_core::chronology` (future-legal, HOTFIX-6 fix round 1's own
#    typed-exemption mechanism design), now with zero live entries --
#    `chronology::tests::the_deferral_kind_stays_future_legal_with_zero_
#    live_entries_after_hotfix7` asserts the empty state is deliberate, not
#    an accident.
# 2. `exile-begins`/`return-begins` RETIRED. These two rows existed
#    ONLY to give the E4 era-boundary property test a live, bound timeline
#    position while `jerusalem-falls`/`cyrus-decree` themselves sat
#    deferred (unable to serve that role honestly, since their own bound
#    event's compiled value disagreed with their own `year`). Now that
#    `jerusalem-falls`/`cyrus-decree` themselves ARE the live, bound,
#    agreeing values, the two companion rows are pure duplication (the SAME
#    `event_id`, the SAME year, the SAME `era_boundary` role) -- removed
#    outright rather than left as inert copies. Every place either id was
#    ever cited (E4, this table's own dependent-count tallies,
#    CONTRACT.md) is updated in the same commit.
# 3. PRIMARY-SOURCE CITATIONS COMPLETED (brief requirement 6, carried from
#    HOTFIX-6's own "16 rows not yet verified" note): every row below now
#    cites Ussher's Annals of the World directly (Pierce paragraph-numbered
#    edition, the same two-independent-archive.org-scan standard fix round
#    2's own `nehemiah-wall`/`ezra-returns` rows already established), or
#    discloses its own non-Ussher provenance (the NT Passion anchor; the
#    two widely-cited traditional dates, `exodus`/`samaria-falls`, neither
#    of which claims to BE Ussher's own figure). End state, post-retirement:
#    19/19 rows primary-cited (the brief's own "21/21" framing predates
#    this batch's own retirement of the two now-redundant structural rows,
#    neither of which ever needed an independent citation of its own --
#    each simply restated its own literal companion's already-cited value).
#
# SCHEMA (forward-compatible, per the controller's own "single-feed
# chronology" end-state note, 2026-08-22 -- realized by THIS batch):
#   id           stable, machine-readable, snake-case-with-dashes row key --
#                never renumbered/repositioned; every curated `anchor = `/
#                `after = ` (transitively) resolution field in
#                `data/curated/events-extra.toml`/`passages/*.toml`
#                references one of these ids directly.
#   label        human-readable description.
#   year         the single authoritative year on this atlas's declared
#                scale (signed, no year zero) -- THE number `anchor = `
#                resolution reads (plus a curator's own signed `offset`).
#   event_id     OPTIONAL: the real compiled event id this anchor equals,
#                when one binds at all. Every bound row's own compiled
#                event now resolves ITS OWN `when` directly from this row
#                (`anchor = "<this id>"`, offset 0 -- resolution form (a),
#                ANCHOR BINDING) -- `event_id` and the resolved compiled
#                data can no longer silently drift apart the way two
#                independently-authored facts could before this batch.
#                Omitted (not merely blank) where no single compiled event
#                corresponds, or where binding would misrepresent a
#                genuinely DISCLOSED ADJACENCY as a bug (see the `exodus`
#                row below -- the one remaining case).
#   era_boundary OPTIONAL bool (default false): true for the anchors used as
#                the E4 (era-partition) property test's own structural
#                boundaries -- always carries event_id when true (E4 needs a
#                real timeline position). One boundary per transition in the
#                brief's own 8-era list (patriarchal / exodus-wilderness /
#                conquest-judges / united-monarchy / divided-kingdoms /
#                exile / return / NT), plus `creation` marking the very
#                start.
#   source       provenance (Ussher's Annals directly, or a disclosed
#                non-Ussher traditional date, per row).
#   note         OPTIONAL: disclosed tensions/derivation/citation, never a
#                scale-debate register -- a plain statement of which
#                already-legitimate tradition/value is in play, or (per
#                requirement 6) the primary-source paragraph itself.
#
# DISCLOSED ADJACENCY (pre-existing, W1/W2-policy-governed per
# batch-hotfix6-brief.md's own "Context you can't get from the brief" --
# NOT re-litigated, NOT a bug): a genuine, legitimate, standing tension
# where this atlas SHIPS its own declared Ussher value and discloses a real
# alternative in prose. Exactly ONE such pair remains in this table --
# Exodus, below (search for "STRUCTURAL" to find its own bound companion
# row, "exodus-departs"). Its own literal row is deliberately left UNBOUND
# (no `event_id`, no `anchor = ` resolution field anywhere cites it) -- no
# curated event's own date is ever asked to agree with it.

