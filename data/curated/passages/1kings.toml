ref_note = "Crockett (1897) section 118(3) notes a fragmentary Chronicles echo (1 Chronicles 29:22b, 'and anointed him unto the Lord to be the chief governor'), but that verse is a single clause inside a much broader Chronicles verse about the coronation feast, too thin to witness formally as its own parallel passage without overstating the source -- declined per the standing citation-integrity rule (an honest subset, not a fabricated one), not silently omitted."

