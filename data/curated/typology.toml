antitype_passage = { from = "JHN.6.31", to = "JHN.6.35" }
note = "the manna"
text = "Our fathers did eat manna in the desert; as it is written, He gave them bread from heaven to eat... I am the bread of life: he that cometh to me shall never hunger."

