# alexander-empire.toml -- Empire of Alexander the Great; shapes are
# approximate, drawn for recognizability.
id = "alexander-empire"

# Alexander's empire at its brief height: Macedon/Greece (a SEPARATE,
# disjoint ring -- connected to Anatolia in reality only by the narrow
# Hellespont crossing, so drawing the two as adjacent-but-technically-
# disjoint rings costs almost nothing in accuracy at this coarse scale, and
# avoids threading one single ring through the same Aegean/Anatolia corner
# twice, which self-intersected on the first attempt) plus the whole
# conquered Achaemenid Persian realm (see persia.toml -- the two share
# almost the same eastern/southern footprint, since Alexander simply took
# Persia whole). Daniel's own "third kingdom of brass" (Daniel 2, 7, 8).
# Dissolves into the Diadochi successor kingdoms (Ptolemaic Egypt, Seleucid
# Empire) immediately after Alexander's own death (323 BC).
[[era]]
name = "Empire of Alexander the Great"
from = -335
to = -323
ref_note = "drawn from general historical-geography knowledge of Alexander's conquests (Macedon/Greece added onto the whole former Achaemenid Persian realm, see persia.toml); no specific source consulted this session"
