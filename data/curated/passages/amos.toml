# Batch W4 (whole-Bible titled verse containers, fourth run: the Prophets).
# Amos, in the SAME `[[event]]` schema every other `passages/*.toml` file
# uses. KIND POLICY: see obadiah.toml's own header note.
#
# RECONCILIATION: one pre-existing bare Theographic event touches this book
# -- `theo-205` ("Prophecies of Amos," all 146 verses, -788). LAYER-0, not
# heading-worthy today; every container below stays well under the 0.8
# jaccard sweep floor against it (largest, 17/146 = 0.116).
#
# GRANULARITY: the master brief's own named example genre -- "oracle/burden
# units... per nation" -- Amos 1:3-2:16 is this book's own version of
# Isaiah's burdens-per-nation pattern, the repeated 'for three
# transgressions... and for four' formula naming a distinct nation each
# time (a real, textually-marked literary structure, not an invented
# division): Damascus, Gaza (Philistia), Tyre, Edom, Ammon, Moab, Judah,
# and, at greatest length, Israel itself, the book's own primary audience.
# Chapters 7-9's own FIVE VISIONS (each introduced 'thus hath the Lord God
# shewed unto me') are likewise split per-vision, the SAME granularity the
# master brief names for Daniel. The one narrative interruption among the
# visions -- Amaziah the priest of Beth-el confronting Amos, 7:10-17 -- is
# this slice's own clearest Amos EVENT-kind case: a real, historically
# situated confrontation (not a pure oracle), reusing theo-205's own -788.
# PLACE (EVENT-kind row only): Beth-el, explicit (7:10, 7:13); geo
# disambiguation: `bethel-1` (31.922778, 35.241389) carries direct
# `verse_links` to AMO.7.10/AMO.7.13 (and AMO.3.14/4.4/5.5/5.6) in the
# compiled `places.json`; `bethel-2`/`bethel-3`/`bethel_202` carry none.

[[event]]
id = "amo_superscription_and_the_lords_roar"
label = "The words of Amos, who was among the herdmen of Tekoa, which he saw concerning Israel in the days of Uzziah king of Judah, and in the days of Jeroboam the son of Joash king of Israel, two years before the earthquake."
kind = "general"
verses = ["AMO.1.1-2"]
kjv_superscription = "AMO.1.1, the book's own superscription, quoted verbatim in full (public domain KJV text, per LICENSES.md's own 'KJV text' row) -- self-caught citation-integrity fix before shipping: the label's own first draft silently trimmed 'which he saw concerning Israel' and 'two years before the earthquake,' which is a paraphrase, not a verbatim quote; corrected to the byte-exact compiled text before this batch's own report."
ref_note = "GENERAL-kind: oracle, no date of its own claimed beyond the superscription's own broad reign-window ('two years before the earthquake' is a specific but not independently datable detail), per this file's own header note."

