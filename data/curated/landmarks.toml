# The four points that literally DEFINE BIBLICAL_WORLD_BOUNDS' own padding
# (map.js's own comment on that constant: south=Punt, north=Ashkenaz,
# west=Tarshish 1, east=India) -- using them as far-field context labels
# directly guarantees each of the plate's four extreme corners carries
# something, not just the Levant core -- "md" (same tier as the islands
# above, not "lg": each is a single named people/place-group, not a broad
# multi-power region like Persia or Arabia).

[[landmark]] # places.json slug "punt" (reused coordinate) -- south extreme
name = "Punt"
kind = "region"
size = "md"
lat = 11.595000
lon = 43.148056

