# Ptolemaic Egypt: same Nile core plus the Ptolemies' own signature
# holdings beyond it -- Cyrenaica to the west (a SEPARATE, disjoint ring --
# not fused into one continuous boundary walk with the Nile ring, the same
# structural fix Batch L's own fix round used for this exact entity after a
# fused ring self-intersected there; see batch-l-report.md's "Fix round 1
# addendum") and, in the Sinai/southern Levant, "Coele-Syria" (Judea and the
# coast) down to the Battle of Panium (200 BC), after which that strip was
# lost to the Seleucids -- drawn at the broader, earlier-Ptolemaic
