# reading John's own book forward from the triumphal entry never reaches a
# second temple-cleansing at all, while the graph's own chronological
# adjacency (Narrative.legs, ETL-validated non-decreasing by
# (from_year, order_key)) correctly walks straight to it.
[[event]]
