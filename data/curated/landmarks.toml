# Curated landmark labels for the World map's "actual good and informative
# map" feature (user feedback: "we should be labeling landmarks such as
# rivers and mountains"). Rendered always-visible, non-interactive, styled
# by `kind` per design-direction.md's Atlas plate detail: water names in
# italic serif (--lapis-leaning), mountain/region names in letterspaced
# small caps (--ink-soft) -- both a visual step below place markers'
# labels, so scripture's places stay the foreground.
#
# `kind` must be exactly one of "water" | "mountain" | "region"
# (atlas-etl's validate::run_landmarks enforces this). `lat`/`lon` must
# fall inside the biblical-world clip bbox (lat 7.6..48.9, lon -10.9..71.4
# -- same constants as client/wwwroot/js/map.js's BIBLICAL_WORLD_BOUNDS and
# atlas-etl's polities::BIBLICAL_WORLD_BBOX, formerly borders::BIBLICAL_WORLD_BBOX
# before Batch B2 retired that module).
#
# Batch C2 (design-direction.md's Atlas plate detail SECOND ADDENDUM,
# "populated far field"): optional `size` = "sm" | "md" | "lg" (also
# enforced by validate::run_landmarks) is a geographic-extent hint that
# ALSO makes the label tier-0 -- visible even zoomed all the way out,
# unlike a plain region/mountain label, which only shows from a closer
# zoom (see map.js's applyLabelTier and atlas_core::data::Landmark::size's
# own doc comments for the exact rule). Every entry curated before this
# batch has no `size` at all and keeps its original zoom behavior.
#
# Every entry below reuses a real geocoded coordinate from
# data/compiled/places.json (cited by slug in each entry's comment) rather
# than inventing coordinates -- per the batch brief's "reuse coordinates
# from data/compiled/places.json where a matching place exists". A couple
# of entries deliberately cite a DIFFERENT (but still real, still
# same-named-or-directly-relevant) geocoded record than the most obvious
# match, specifically to avoid stacking multiple landmark labels on the
# exact same pixel when several biblical names geocode to one shared
# point in this dataset (noted case by case below).

# --- water (8) ---------------------------------------------------------
#
# Batch C2 checked this set against design-direction.md's SECOND ADDENDUM
# water list (THE GREAT SEA, RED SEA, SALT SEA, SEA OF CHINNERETH; rivers
# EUPHRATES, TIGRIS, NILE, JORDAN) and added nothing: RED SEA/EUPHRATES/
# TIGRIS are already here verbatim; SALT SEA and SEA OF CHINNERETH are the
# KJV/period names for the SAME real bodies of water "Dead Sea" and "Sea of
# Galilee" already label below -- a second landmark at the identical spot
# would just be two labels stacked on one lake, and "Sea of Galilee"
# specifically is load-bearing for WORLD-12's own lit-place dedupe test
# (the coincident real lit place is named "Sea of Galilee", not
# "Chinnereth" -- renaming the landmark would break that dedupe, not just
# rename a label).

[[landmark]] # places.json slug "jordan"
name = "Jordan River"
kind = "water"
lat = 31.761389
lon = 35.558333

[[landmark]] # places.json slug "great-sea" (KJV name for the Mediterranean, e.g. Num 34:6)
name = "The Great Sea"
