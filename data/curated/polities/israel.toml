event = "The kingdom divides; Jeroboam is made king over Israel"
verses = ["1KI.12.16", "1KI.12.20"]
ref_note = "1 Kings 12:16,20 (KJV, verified against the compiled text) -- Israel rejects Rehoboam ('to your tents, O Israel') and makes Jeroboam king; Judah alone follows the house of David (see judah.toml's own mirrored transition)"
