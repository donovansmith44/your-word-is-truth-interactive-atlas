# Batch T requirement 1 ("PARALLEL WITNESSES -- the set of per-book passages
# that recount the same event... one witness passage per Gospel", the
# owner's own words verbatim): one row per (event, book) witness account.
#
# SCHEMA, deliberately FLAT (`[[witness]]`, each row naming its own
# `event_id`) -- NOT nested under a per-event `[[event]]` group the way
# `polities/*.toml`'s `[era.transition]`/`[era.fall]` are. Batch M's own
# self-review found 7 of its 22 deltas silently mis-attached to the WRONG
# era, purely because TOML's array-of-tables rule attaches a nested table to
# whichever `[[era]]` was MOST RECENTLY OPENED, not whichever one a
# curator's own surrounding comment describes (see
# `atlas_core::data::PolityDelta::for_era_from`'s own doc comment for the
# fix that shipped there: a curator-authored echo field, cross-validated by
# the ETL). This file avoids that whole RISK CLASS from the start, per
# batch-t-brief.md's own instruction ("if your... TOML has any nested
# array-of-tables with a similar mis-attachment risk, adopt the same
# echo-field discipline from the start"): a FLAT list has no "most recently
# opened parent" for a row to silently attach to instead of the one it
# names -- every row's own `event_id` IS the only attachment point there is,
# checked directly against it, so no echo field is needed here at all.
#
# `verses` accepts this project's own curator-friendly single-verse-or-range
# strings (e.g. `"MAT.27.33-50"`), expanded via `curated::expand_verse_ref`
# (the SAME helper `events-extra.toml`/`catechism.toml` already use) into
# individually-canonical verse ids, wrapped into a `{"kjv": [...]}`
# translation map (`atlas_core::translation`) at parse time -- KJV is the
# only translation this app compiles today; the indirection exists so a
# future translation can be added under this SAME witness identity without
# restructuring anything.
#
# EVERY citation below was read directly against the compiled KJV text
# (`data/compiled/verses-kjv.json`) before being written -- citation-
# integrity rule, 6+ prior incidents in this project's own history.
# Robertson section numbers/titles were independently verified against TWO
# separate mirrors of Project Gutenberg #36264 (the 1922 first edition,
# public domain -- see LICENSES.md's own "Robertson's Harmony of the
# Gospels" section for the full provenance record) before this file was
# written: the HTML edition (36264-h.htm) and the plain-text edition
# (pg36264.txt), which agree byte-for-byte on every section number/title
# quoted here and in `events-extra.toml`'s own `robertson_section` fields.

# --- pw_bethany: Mary anoints Jesus at Bethany (Robertson §141) -----------
# John's own account (JHN.12.1-11) is this event's own top-level `verses`
# already (events-extra.toml) -- included here too, explicitly, so THIS
# event's own PARALLEL ACCOUNTS section is complete (3 witnesses) rather
# than silently relying on the top-level field to stand in for one of them.
[[witness]]
event_id = "pw_bethany"
book = "MAT"
verses = ["MAT.26.6-13"]
ref_note = "Matthew 26:6-13 read directly against the compiled KJV text"
robertson_section = "Robertson (1922) §141"

[[witness]]
event_id = "pw_bethany"
book = "MRK"
verses = ["MRK.14.3-9"]
ref_note = "Mark 14:3-9 read directly against the compiled KJV text"
robertson_section = "Robertson (1922) §141"

[[witness]]
event_id = "pw_bethany"
book = "JHN"
verses = ["JHN.12.1-11"]
ref_note = "John 12:1-11 read directly against the compiled KJV text"
robertson_section = "Robertson (1922) §141"

