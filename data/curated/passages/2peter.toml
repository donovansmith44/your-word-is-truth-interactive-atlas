kind = "general"
verses = ["2PE.3.11-18"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): 2 Peter 3:11-18, the charge to be diligent while looking for 'new heavens and a new earth, wherein dwelleth righteousness,' Peter's own reference to 'our beloved brother Paul' and his epistles, and the closing doxology."
