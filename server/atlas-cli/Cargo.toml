[package]
name = "atlas-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
# R1: no parallel query logic -- every graph question this crate answers
# goes through atlas-graph's GraphService / atlas_graph_types::store::
# GraphQuery, or atlas-server's own graph_wire id/edge-kind grammar
# (reused as a library dependency, not re-parsed by hand).
atlas-core = { path = "../atlas-core" }
atlas-graph = { path = "../atlas-graph" }
atlas-graph-types = { path = "../../graph-types" }
atlas-server = { path = "../atlas-server" }
anyhow = "1"

# R3: args hand-parsed per the atlas-server precedent -- no clap, no new
# runtime deps beyond what atlas-server itself already brings in.
