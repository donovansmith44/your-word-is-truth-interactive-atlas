# Batch W4 (whole-Bible titled verse containers, fourth run: the Prophets).
# Jonah, in the SAME `[[event]]` schema every other `passages/*.toml` file
# uses. KIND POLICY: see obadiah.toml's own header note (EVENT-kind reserved
# for narrated happenings or a text-explicit date-stamp; oracle/vision
# content defaults GENERAL). Jonah is different in kind from its 11 sibling
# Minor Prophets -- it is almost entirely NARRATIVE (a prophet's own story),
# not a collection of oracles, and 2 Kings 14:25 independently attests Jonah
# the son of Amittai as a real, historical prophet of Jeroboam II's own
# reign -- EVENT-kind throughout, one container per chapter (each a
# genuinely distinct narrated scene: the flight and storm; the prayer in the
# fish; Nineveh's repentance; Jonah's own anger and the gourd).
#
# RECONCILIATION: one pre-existing bare Theographic event touches this book
# -- `theo-200` ("Prophecies of Jonah," all 48 verses, -825). LAYER-0, not
# heading-worthy today; every container below stays well under the 0.8
# jaccard sweep floor against it (largest, 17/48 = 0.354).
#
# DATE: theo-200's own -825 is REUSED (interpolated, never independently
# re-derived) for all four containers -- the narrative itself spans at most
# a few months (a voyage, three days in the fish, a forty-day preaching
# mission), not decades, so one shared traditional year is honest. PLACES:
# Joppa (1:1-3, the port of departure), the sea/fish (2, no separate land
# place -- Jonah's own prayer "out of the fish's belly" has no place of its
# own beyond the sea already implicit in chapter 1's own voyage), Nineveh
# (3-4, explicit).

[[event]]
id = "jon_flight_and_storm"
label = "Jonah flees to Tarshish; the great storm and the great fish"
kind = "event"
from_year = -825
to_year = -825
places = ["joppa"]
verses = ["JON.1.1-17"]
atlas_section = "Jonah pericope (this project's own sectioning, CC0 -- no external PD source claimed): Jonah 1, the word of the Lord commanding Jonah to Nineveh, his own flight to Tarshish from Joppa instead, the storm the sailors could not outrun, Jonah's own request to be cast into the sea, and the great fish the Lord prepared to swallow him."
ref_note = "Date interpolated from the pre-existing theo-200 ('Prophecies of Jonah,' -825). Place: Joppa, explicit (1:3), the port of departure -- the sea itself carries no separate curated place id."

[[event]]
id = "jon_prayer_in_the_fish"
label = "Jonah's prayer from the belly of the fish"
kind = "event"
from_year = -825
to_year = -825
places = ["joppa"]
verses = ["JON.2.1-10"]
atlas_section = "Jonah pericope (this project's own sectioning, CC0): Jonah 2, Jonah's own prayer of thanksgiving out of the fish's belly -- 'Salvation is of the Lord' -- and the fish vomiting him out upon dry land."
ref_note = "Same traditional year as jon_flight_and_storm, immediately following. Place: no separate place id exists for 'the sea' itself; joppa is kept as the nearest curated anchor (the voyage's own point of departure, 1:3) since the fish's own location is never itself named."

[[event]]
id = "jon_nineveh_repents"
label = "Jonah preaches at Nineveh; the city repents"
kind = "event"
from_year = -825
to_year = -825
places = ["nineveh"]
verses = ["JON.3.1-10"]
atlas_section = "Jonah pericope (this project's own sectioning, CC0): Jonah 3, the word of the Lord a second time, Jonah's own preaching through Nineveh ('yet forty days, and Nineveh shall be overthrown'), and the king and people's own repentance in sackcloth and ashes, so that God repented of the evil he had said he would do unto them."
ref_note = "Same traditional year as jon_flight_and_storm. Place: Nineveh, explicit (3:3-4)."

[[event]]
id = "jon_anger_and_the_gourd"
label = "Jonah's own anger at the Lord's mercy; the gourd, the worm, and the east wind"
kind = "event"
from_year = -825
to_year = -825
places = ["nineveh"]
verses = ["JON.4.1-11"]
atlas_section = "Jonah pericope (this project's own sectioning, CC0): Jonah 4, Jonah's own displeasure that Nineveh was spared, his own booth east of the city, the gourd the Lord prepared and the worm that withered it, and the Lord's own closing question -- 'should not I spare Nineveh, that great city?'"
ref_note = "Same traditional year as jon_flight_and_storm, immediately following. Place: Nineveh, unchanged (4:5, 'out of the city')."
