# Positive admission of the served Book of Concord against the 1921
# Concordia Triglotta (F-84). The reference is the Internet Archive's OCR of
# its scan (data/raw/triglot, item concordiatriglot00unse, public domain),
# pinned by sha256 in data/raw/MANIFEST.toml.
#
# A served paragraph or article title is Matched when at least
# `threshold_percent` of its runs of `shingle_words` words occur in its
# document's window of scan leaves (a text shorter than one run must occur
# whole). The threshold sits at the lowest coverage among paragraphs checked
# by hand as Triglot text and above every known non-Triglot text measured in
# FOCUS-3 (ledger: .superpowers/sdd/2026-10-03-focus3/progress.md).
# An article's paragraph numbers agree with the Triglot's when at least
# `numbering_percent` of its matched paragraphs find their number among the
# marginal numbers ("44]") of the scan leaf they match on or the leaf facing
# it; otherwise its paragraphs are labelled by the article's code alone.
# A paragraph the scan garbles is Confirmed by hand: a [[confirmed]] row names
# it by document, article slug and its opening words, with the Triglot page.
# A title curated in concord-titles.toml is our own wording (Editorial).
# Anything neither matched, confirmed nor ours refuses the compile.

shingle_words = 6
threshold_percent = 40
numbering_percent = 70
heading_percent = 100

[[window]]
document = "preface"
first_leaf = 285
last_leaf = 316

[[window]]
document = "ecumenical-creeds"
first_leaf = 317
last_leaf = 322

