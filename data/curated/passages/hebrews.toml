atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Hebrews 11:1-16, faith defined as 'the substance of things hoped for,' and its own witnesses from Abel and Enoch through Noah and Abraham, who 'looked for a city which hath foundations, whose builder and maker is God.'"

[[event]]
id = "heb_the_faith_of_abraham_isaac_jacob_joseph_and_moses"
