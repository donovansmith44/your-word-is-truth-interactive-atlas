# Batch W4 (whole-Bible titled verse containers, fourth run: the Prophets).
# Ezekiel, in the SAME `[[event]]` schema every other `passages/*.toml`
# file uses. KIND POLICY: see obadiah.toml's own header note.
#
# RECONCILIATION: one pre-existing bare Theographic event touches this book
# -- `theo-243` ("Prophecies of Ezekiel," all 1273 verses, -593). LAYER-0,
# not heading-worthy today; every container below stays well under the 0.8
# jaccard sweep floor against it (largest, 52/1273 = 0.041 for
# ezk_gog_and_magog).
#
# GRANULARITY: this book's own sign-acts (lying on his side with a siege
# model, shaving his own hair, removing his own household goods) are each
# their own container, the master brief's own explicitly named "Ezekiel's
# sign-acts" genre. The extensive burden against Tyre (26-28) and against
# Egypt (29-32) are each split into their own real sub-units (the siege
# prophecy; the lament; the prince/king of Tyre oracle and the Zidon
# coda; Pharaoh the dragon; Nebuchadnezzar's own wages; the day of the
# Lord; the broken arm; Assyria the cedar; the lamentation; the pit among
# the nations), matching the "burdens per nation" genre the master brief
# names for Isaiah, applied here to a book that gives each burden far more
# internal structure. The nine-chapter closing temple vision (40-48) is
# ONE continuous experience (no new date resets it anywhere across the
# span) but is still split into six real sub-units by content (the
# measurements; the glory's own return; priestly ordinances; offerings and
# feasts; the river of life; the tribal allotments), not left as one
# unmanageable 260-verse container.
#
# DATES: Ezekiel is this slice's own most densely self-dated book -- almost
# every major section opens with an explicit 'in the Nth year' formula,
# every one counted from the same fixed epoch (Jehoiachin's own captivity,
# 1:2). theo-243's own -593 is reused as the YEAR-5 baseline (matching
# 1:2's own 'fifth year of king Jehoiachin's captivity,' the call vision's
# own date) -- every other dated container in this file is a SIMPLE,
# text-explicit linear count from that one baseline (year N -> -593 + (N -
# 5)), never an independently fresh Ussher derivation, the same discipline
# data/curated/passages/1samuel.toml's own "twenty years after the ark's
# own capture" precedent already establishes, applied consistently across
# this whole book rather than case by case. A chapter with NO new date
# clause of its own either continues its own immediately preceding dated
# section (no break in the narrative address) or is left GENERAL-kind,
# undated, per this file's own header policy -- disclosed per container,
# never silently assumed either way. PLACE: `chebar` (1:1's own explicit
# 'river of Chebar,' direct EZK.1.1 verse_link in the compiled
# places.json) anchors Ezekiel's own physical location among the exiles
# throughout; the temple vision (8-11, 40-48) is instead anchored at
# `jerusalem`, since both explicitly narrate Ezekiel being brought there
# 'in the visions of God' (8:3, 40:2), not merely seeing it from Chebar;
# the nation-burdens (25-32) are anchored at the named nation itself,
# matching this slice's own Isaiah/Jeremiah burden-oracle convention.

[[event]]
id = "ezk_the_call_vision"
label = "The heavens were opened, and I saw visions of God"
kind = "event"
from_year = -593
to_year = -593
places = ["chebar"]
verses = ["EZK.1.1-28", "EZK.2.1-10", "EZK.3.1-27"]
atlas_section = "Ezekiel pericope (this project's own sectioning, CC0 -- no external PD source claimed): Ezekiel 1:1-3:27, dated the fifth year of Jehoiachin's own captivity -- the vision of the four living creatures and the wheels within wheels, the glory of the Lord upon a sapphire throne, the scroll eaten 'sweet as honey,' and Ezekiel made a watchman to the house of Israel, forewarned that his own hearers would be impudent and hardhearted."
ref_note = "Date: 'the fifth year of king Jehoiachin's captivity' (1:2), reused as this file's own YEAR-5 baseline from the pre-existing theo-243 ('Prophecies of Ezekiel,' -593), per this file's own header note. Place: the river of Chebar, explicit (1:1, 1:3, 3:15, 3:23)."

[[event]]
id = "ezk_sign_act_lying_on_his_side"
label = "Take thee a tile, and pourtray upon it the city: lying three hundred and ninety days upon thy left side"
