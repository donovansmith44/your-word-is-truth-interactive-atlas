atlas_section = "1 Kings pericope (this project's own sectioning, CC0): 1 Kings 1:1-4, aged David's own failing health and the search for Abishag the Shunammite to attend him."
ref_note = "No Chronicles parallel. Dated the year before the pre-existing theo-160 ('Death of David,' -1015)."

