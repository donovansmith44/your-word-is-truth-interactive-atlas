# Fix round 1 (I3): no [era.transition]/[era.fall] on this polity's only
# era, and deliberately so -- an honest omission, not a gap never reached.
# Unlike elam/sumer/parthian-empire, the Hittite Empire's own END (this
# era's own to=-1180) IS a real, nameable historical moment -- the wider
# Late Bronze Age Collapse -- but it is neither narrated nor prophesied in
# Scripture, and this polity is drawn for BACKGROUND/context (the great
# power Egypt's New Kingdom treatied with, see egypt.toml) rather than as
# an actively-narrated biblical political actor the way Israel/Judah/
# Assyria/Babylon/Egypt/Persia are. Deltas deferred, not forgotten.
