note = "Noah's flood"
text = "When once the longsuffering of God waited in the days of Noah, while the ark was a preparing, wherein few, that is, eight souls were saved by water. The like figure whereunto even baptism doth also now save us."

[[typology]]
type_passage = { from = "PSA.41.9" }
antitype_passage = { from = "JHN.13.18" }
note = "David's betrayed friend"
text = "I speak not of you all: I know whom I have chosen: but that the scripture may be fulfilled, He that eateth bread with me hath lifted up his heel against me."
