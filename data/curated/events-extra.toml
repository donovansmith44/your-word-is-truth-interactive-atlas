# "event" only when a traditional confessional-Lutheran-accepted
# ministry-year date AND a defensible place mapping both exist; the
# ministry-year scheme continues the one Batch T already established
# (baptism AD 29; year running AD 30 through the first Passover and early
# Judean/Galilean ministry; AD 31 the great Galilean ministry -- the
# "silent year" Batch T's own sparse skeleton left entirely uncovered;
# AD 32 the withdrawal/later-Galilean ministry through Caesarea Philippi
# (matching the PRE-EXISTING jm_bethsaida/jm_caesarea_philippi dates,
# unchanged); AD 32 continuing through the Perean ministry's own autumn
# feasts (Tabernacles, Dedication); AD 33 the final journey to Jerusalem
# through Passion Week (matching PRE-EXISTING jm_jericho/jm_bethany),
# unchanged AD 33 anchor). A broad, already-established regional place
# (e.g. galilee-1, judea-1, jerusalem) is used, per existing pw_galilee
# precedent, when Robertson's own text sets a section generally within a
# region without naming a specific town -- "a defensible place mapping"
# is read to include a well-attested broad region, not only a pinpoint
# town. A section with no honest place at all (a discourse/parable
# collection untethered from one place or spanning several within one
# Harmony section) ships general-kind -- the honest default, not a
# failure. Every promotion call, and every disclosed judgment call, is
# recorded in batch-t2-report.md.
# ===========================================================================

# --- Period 1: Sources & genealogies (Robertson Part I-III, SS1-3) --------
# Ambiguity ruling (2026-08-21): material before/after the Gospels' own
# narrative span -- prefaces, genealogies -- is reading structure even
# where no datable event exists. general-kind throughout.
