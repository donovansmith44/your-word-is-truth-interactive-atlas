# Test fixture only -- a tiny two-era polity in the SAME shape real curated
# files under data/curated/polities/ use, not meant to be geographically
# meaningful (small squares, not a real coastline).
id = "testland"

[[era]]
name = "Testland"
from = -2000
to = -1500
ref_note = "synthetic fixture, not a real place"
rings = [
  [[10.0, 10.0], [10.0, 11.0], [11.0, 11.0], [11.0, 10.0], [10.0, 10.0]],
]

[[era]]
name = "Greater Testland"
from = -1499
to = -1000
ref_note = "synthetic fixture, not a real place"
rings = [
  [[9.0, 9.0], [9.0, 12.0], [12.0, 12.0], [12.0, 9.0], [9.0, 9.0]],
]

# Batch M requirement 1: nested delta tables, attached to "Greater Testland"
# (the most recently opened [[era]]) -- exercises both [era.transition]
# (the boundary FROM "Testland") and [era.fall] (this fixture's own last
# era) in one fixture.
[era.transition]
event = "Testland expands"
verses = ["GEN.1.1"]
ref_note = "synthetic fixture, not a real citation"
for_era_from = -1499

[era.fall]
event = "Greater Testland falls"
verses = ["GEN.1.2", "GEN.1.3"]
ref_note = "synthetic fixture, not a real citation"
for_era_from = -1499
