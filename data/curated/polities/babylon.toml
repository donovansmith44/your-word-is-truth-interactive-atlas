# babylon.toml -- Babylon/Babylonia; shapes are approximate, drawn for
# recognizability.
id = "babylon"

# Old Babylonian (Hammurabi) through Kassite Babylonia: the Mesopotamian
# core between the Tigris and Euphrates, from Mari in the northwest down
# through Babylon/Nippur/Ur to the Persian Gulf marshes -- one long-lived
# footprint spanning both dynasties (their extents did not differ enough at
# this map's own coarse scale to need separate eras).
[[era]]
name = "Babylonia"
from = -2100
to = -1156
ref_note = "drawn from general historical-geography knowledge of Mesopotamia between the Tigris and Euphrates (Mari, Babylon, Nippur, Ur); no specific source consulted this session"
