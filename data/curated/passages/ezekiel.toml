to_year = -593
places = ["chebar"]
verses = ["EZK.4.1-17", "EZK.5.1-17"]
atlas_section = "Ezekiel pericope (this project's own sectioning, CC0): Ezekiel 4-5, sign-acts continuing directly from the call's own commissioning, no new date given -- a clay tile portraying Jerusalem besieged, Ezekiel lying on his left side 390 days and his right side 40 days bearing the iniquity of Israel and Judah, bread baked over dung as a sign of defiled exile-food, and Ezekiel's own hair shaved with a sharp knife and divided into thirds -- burned, smitten, and scattered."
ref_note = "Same dated setting as ezk_the_call_vision (no new date clause; continuous address). Place: Chebar, unchanged."

