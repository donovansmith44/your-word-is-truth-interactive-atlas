# EVENT-vs-GENERAL (requirement 2's promotion rule): a section ships
# "event" only when a traditional confessional-Lutheran-accepted
# ministry-year date AND a defensible place mapping both exist; the
# ministry-year scheme continues the one Batch T already established
# (baptism AD 29; year running AD 30 through the first Passover and early
