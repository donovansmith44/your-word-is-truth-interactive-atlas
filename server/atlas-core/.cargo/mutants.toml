# cargo-mutants for atlas-core. The HOUSE RULES are stated once, in
# `server/.cargo/mutants.toml`; this file adds only what is true here.
#
# WHY IT EXISTS: cargo-mutants discovers ONE config, the workspace root's
# (`server/.cargo/mutants.toml`), whose scope is the whole workspace and whose
# per-mutant test command is therefore the whole workspace suite. Nothing about
# THIS crate's covering tests can be said there, and a command-line `-f`/`-F`
# narrows the files without touching the test command, so the per-crate scope
# and the per-crate covering targets are one file per crate, named with
# `--config`. `scripts/mutants-parallel.sh` names them all.
#
# THIS FILE IS NOT DISCOVERED. Being one level deeper than the workspace root,
# it is read only when it is NAMED:
#
#     cargo mutants --in-place --config atlas-core/.cargo/mutants.toml   # from server/
#
# The globs below are WORKSPACE-relative (`atlas-core/src/...`), the same
# spelling the sibling configs use, even though this file sits one level
# deeper: cargo-mutants resolves every path against the workspace root it
# discovers, not against the config's own directory. A package-relative
# `src/canon.rs` silently matches nothing.
#
# `--in-place` for the reason `server/.cargo/mutants.toml` states (a copied
# tree cannot resolve `../graph-types` at all); this crate adds one of its own,
# `tests/golden.rs`, whose fixture is read from `../../tests/fixtures`, above
# the workspace root.

# The scope is the CRATE, not a list of its files: a file added to it is in
# scope the day it is added, where a list is one more place to forget -- and a
# one-file glob makes a later `-D` run find zero mutants silently.
examine_globs = ["atlas-core/src/**/*.rs"]
exclude_re = ["wall-clock gate"]
test_tool = "cargo"
# THE COVERING TARGETS: this crate's whole suite, because all of it is fast --
# 221 unit tests in 0.7 s, plus `golden` and
# `no_atlas_data_in_public_signatures`, each under a second. There is nothing
# here to narrow away, and `atlas-core` is the crate every other one depends
# on, so `--test` filters would only risk a false survivor.
additional_cargo_test_args = ["-p", "atlas-core"]
