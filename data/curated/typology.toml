# EDGE-1a ("Prophecy & typology: the seed data" -- batch-edge1a-brief.md):
# owner order (2026-08-23, verbatim): "we also need a couple more edges:
# one for Christological types, and one for prophecy/fulfillment." This
# file is the typology half (decision 1b): ONLY cases Scripture ITSELF
# draws (never a type this curator merely finds plausible) -- the brief's
# own closed seed list, each verified against the real committed KJV text.
#
# ONE array-of-tables (parsed by `atlas_etl::curated::parse_typology`;
# loaded by `atlas_etl::compile::compile`):
#
# [[typology]]
#   type_passage      { from, to? } -- the OT passage prefiguring.
#   antitype_passage  { from, to? } -- the NT passage where Scripture
#                      ITSELF argues the type (never a bare citation --
#                      the argued-from passage). SELF-ATTESTS as the row's
#                      own Ground::Scripture (mirrors `Fulfills`'s own
#                      "self-attesting" convention -- `atlas_graph_types::
#                      edge::Typology`'s own doc comment: "the classic
#                      cases are ARGUED FROM passages").
#   note               names the figure for display (`Typology.note`'s own
#                      doc comment: "the brasen serpent").
#   text               the KJV quote grounding the type (required; FACT
#                      register, never hedged).
#
# NON-CONTIGUOUS SOURCES, split into multiple rows (the SAME "BibleLocusRange
# is a single contiguous range" discipline the brief's own "SKIP any where
# you cannot anchor both ends cleanly" instruction protects): the passover
# lamb (EXO 12:3-13 selecting/killing/eating the lamb, PLUS the separate
# EXO 12:46 "not a bone broken" ordinance -- a 32-verse gap of UNRELATED
# regulations between them) and the manna (JHN 6:31-35 then 6:48-51, a
# 12-verse gap) each become TWO rows rather than one row spanning -- and so
# falsely including -- the intervening unrelated verses. The tabernacle
# pattern (EXO 25:8-9's general charge, EXO 25:40's specific repeat, a
# 30-verse gap) likewise splits, paired by verbal echo (HEB 8:5's own
# "shewed thee in the mount" echoes EXO 25:40 more closely than 25:9 --
# batch report has the full reasoning). Sarah/Hagar splits by OT episode
# (GEN 16 Hagar's conceiving; GEN 21:1-12 Isaac's birth/Ishmael's
# expulsion), both grounded in the SAME Galatians 4 passage. No row here
# was SKIPPED outright -- every brief-named case anchored cleanly once
# split; the batch report discloses this decision explicitly (a split, not
# a drop, is the more faithful representation of a genuinely two-sided
# Scripture argument).
#
# BOTH TABLES, ON PURPOSE (brief decision 1b, verbatim: "Where a case is
# BOTH an explicit fulfillment formula and a type, it may appear in both
# tables -- they are different claims"): the passover lamb's own
# EXO.12.46 -> JHN.19.36 pairing, and David's betrayed friend's own
# PSA.41.9 -> JHN.13.18 pairing, EACH also appear in fulfillments.toml.

[[typology]]
type_passage = { from = "GEN.14.18", to = "GEN.14.20" }
antitype_passage = { from = "HEB.7.1", to = "HEB.7.17" }
note = "Melchizedek"
text = "For this Melchisedec, king of Salem, priest of the most high God, who met Abraham returning from the slaughter of the kings, and blessed him... made like unto the Son of God; abideth a priest continually."

[[typology]]
type_passage = { from = "NUM.21.8", to = "NUM.21.9" }
antitype_passage = { from = "JHN.3.14", to = "JHN.3.15" }
note = "the brasen serpent"
text = "And as Moses lifted up the serpent in the wilderness, even so must the Son of man be lifted up: That whosoever believeth in him should not perish, but have eternal life."

[[typology]]
type_passage = { from = "JON.1.17" }
antitype_passage = { from = "MAT.12.40" }
note = "Jonah"
text = "For as Jonas was three days and three nights in the whale's belly; so shall the Son of man be three days and three nights in the heart of the earth."

[[typology]]
type_passage = { from = "GEN.5.1", to = "GEN.5.5" }
antitype_passage = { from = "ROM.5.14" }
note = "Adam, the figure of him that was to come"
text = "Nevertheless death reigned from Adam to Moses, even over them that had not sinned after the similitude of Adam's transgression, who is the figure of him that was to come."

[[typology]]
