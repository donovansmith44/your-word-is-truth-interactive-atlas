# Neo-Babylonian (Chaldean) Empire: the Nebuchadnezzar-era empire that
# destroys Jerusalem (586 BC) and inherits most of the fallen Neo-Assyrian
# Empire's own western reach -- Mesopotamia, north to old Assyria's
# heartland, west across the desert to Aleppo/Carchemish, and south down
# the whole Levantine coast (Damascus, Israel/Judah, Philistia) to Egypt's
# own border at Gaza; ends with Cyrus's conquest of Babylon (539 BC). Fills
# a real gap the old snapshot-year borders never covered at all -- the
# EXILE era (see data/curated/eras.toml, -586..-539) previously had no
# polity feature showing the very empire that exiled Judah. Fix round 1
# (M3): fetched
# en.wikisource.org/wiki/1911_Encyclopaedia_Britannica/Nebuchadrezzar
# 2026-08-20 -- directly confirms this ring's own drawn extent: Necho
# defeated at Carchemish 605 BC, "annexing Syria to the Babylonian empire";
# Tyre besieged 13 years and later "under Babylonian officials"; the king's
# own inscriptions found at Nahr el-Kelb near Beirut and Wadi Brissa in
# Lebanon; Jerusalem "taken and destroyed" 586 BC. Every one of these sits
# comfortably inside this ring's own existing Levant-coast-to-old-Assyria
# footprint -- shape confirmed unchanged.
[[era]]
name = "Neo-Babylonian Empire"
from = -626
to = -539
ref_note = "fetched en.wikisource.org/wiki/1911_Encyclopaedia_Britannica/Nebuchadrezzar 2026-08-20 (fix round 1, M3): confirms Carchemish 605 BC 'annexing Syria'; Tyre besieged then under Babylonian officials; inscriptions at Nahr el-Kelb (near Beirut) and Wadi Brissa (Lebanon); Jerusalem taken and destroyed 586 BC -- all comfortably inside this ring's existing footprint; shape confirmed unchanged"
