note = "Hagar and Sarah"
text = "For it is written, that Abraham had two sons, the one by a bondmaid, the other by a freewoman... Which things are an allegory: for these are the two covenants."

[[typology]]
type_passage = { from = "GEN.21.1", to = "GEN.21.12" }
antitype_passage = { from = "GAL.4.22", to = "GAL.4.31" }
note = "Hagar and Sarah"
text = "Now we, brethren, as Isaac was, are the children of promise. But as then he that was born after the flesh persecuted him that was born after the Spirit, even so it is now."

[[typology]]
