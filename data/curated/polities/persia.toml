# persia.toml -- Achaemenid Persian Empire; shapes are approximate, drawn
# for recognizability.
id = "persia"

# The Achaemenid Persian Empire (Cyrus, Darius, Xerxes -- Ezra/Nehemiah/
# Esther's own imperial backdrop): from Cyrus's conquest of Babylon (539
# BC, ending the Exile) to Alexander's conquest (331 BC). The largest
# empire the biblical world had yet seen -- Anatolia and Egypt in the
# west, the Indus valley in the east (drawn slightly short of its true
# historical reach there, which continues past this app's own map bounds).
[[era]]
name = "Achaemenid Persian Empire"
from = -539
to = -331
ref_note = "fetched en.wikipedia.org/wiki/Achaemenid_Empire 2026-08-19 for territorial extent (Balkans/Cyrenaica west to the Indus Valley east; Black Sea north; Arabia/Libya south)"
