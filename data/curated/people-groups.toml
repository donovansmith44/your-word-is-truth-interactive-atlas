# Philistines: NO [[named_after]] row, deliberately (decision 3's own
# conditional: "add NamedAfter ONLY where the eponym person exists as a
# node and the text states the naming"). GEN 10:14 attributes the
# Philistines to "Casluhim" ("out of whom came Philistim") -- itself a
# PLURAL-shaped collective name, not a clean singular eponym in the
# "she called his name X" mold every OTHER row above grounds on, and no
# "casluhim" person record exists in the compiled Theographic set either.
# The group node above still seeds -- only the eponymy row is withheld,
# per the Sin-guard principle: never force an edge the graph can't ground.
