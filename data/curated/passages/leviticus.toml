# Batch W1 (whole-Bible titled verse containers). Leviticus, in the SAME
# `[[event]]` schema `events-extra.toml` uses -- see
# `data/curated/passages/genesis.toml`'s own header comment for the full
# reconciliation/provenance framing.
#
# RECONCILIATION: zero pre-existing events touch Leviticus (this batch's
# own gap analysis confirmed 0/859 verses covered before this file) -- the
# whole book is fresh authoring. GRANULARITY, per the brief's own explicit
# guidance ("law = code/narrative units"): Leviticus is almost entirely
# case law/ritual instruction, not narrative -- containers here are
# CODE-UNIT sized (often a whole chapter or several), not verse-by-verse,
# matching how a reader would actually navigate a legal code, not an
# artificially fragmented pericope list. The three genuinely narrative
# moments (the consecration of Aaron, Nadab and Abihu's death, the
# blasphemer stoned) are EVENT-kind, dated to the same year as the
# tabernacle's own completion (Exodus 40:17, -1490) -- Leviticus's own
# narrative frame opens immediately after it (Lev 1:1, "the Lord called
# unto Moses... out of the tabernacle").

[[event]]
id = "lev_burnt_offering"
label = "The law of the burnt offering"
kind = "general"
verses = ["LEV.1.1-17"]
atlas_section = "Leviticus code unit (this project's own sectioning, CC0 -- no external PD source claimed): Leviticus 1, the burnt offering."
ref_note = "General-kind: ritual law, no single dateable moment or place of its own."

