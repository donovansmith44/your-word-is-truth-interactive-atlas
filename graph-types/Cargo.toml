[package]
name = "atlas-graph-types"
version = "0.17.0" # A-PROVENANCE: `SECTION_SCHEMA_VERSION` 26 -> 27 (core gains the `provenance_title` table: each provenance id with the title of the source it names, compiled from data/curated/sources.toml) -- MINOR under 0.x. (0.16.0 = A-F39: every table a section file holds is under its logical hash -- `section_index` derives the label, edge_index and edge_count rows once for the writer and the dump, `logical_dump_section` takes a `SectionIndex`, `logical_dumps` is new, and `version_root` and `GraphPublisher::publish` answer a `Result` with `IndexError`; no schema bump, every logical hash and the root move (F-39) -- MINOR under 0.x. (0.15.0 = A-LICENSE-BOC: `SECTION_SCHEMA_VERSION` 25 -> 26 (the concord section serves the 1921 Triglot only: its non-Triglot units leave and its labels and derived tables are rewritten, F-39) -- MINOR under 0.x. (0.14.0 = A-NOBLURB: `SECTION_SCHEMA_VERSION` 24 -> 25 (core loses the `place_history_blurb` table and `place_default`'s `blurb` column) -- MINOR under 0.x. (0.13.0 = F2-2: `SECTION_SCHEMA_VERSION` 23 -> 24 (a citation of a span is labelled by the span; the label table sits outside the logical hash, F-39, so the schema moves the root) -- MINOR under 0.x. (0.12.0 = F2-1: `GraphQuery::references` (required: every backend answers a text unit's compiled reference), `Graph::references`; `SECTION_SCHEMA_VERSION` 22 -> 23 (`verse` and `concord_unit` gain `reference`) -- MINOR under 0.x. (0.11.0 = FIX2S: `SECTION_SCHEMA_VERSION` 21 -> 22 (every section gains the compiled `edge_count` table) -- MINOR under 0.x. (0.10.0 = F6-r4b: `node::label` and `NodeData` removed (a node's label is compiled only by `atlas_graph::labels`, from the reader-facing name); `SECTION_SCHEMA_VERSION` 20 -> 21 -- MINOR under 0.x. (0.9.0 = F6-r4: `SECTION_SCHEMA_VERSION` 19 -> 20 (core gains `polity_reign` and `place_default`) -- MINOR under 0.x. (0.8.0 = F6-r2: `GraphQuery::{labels, edge}` (required: every backend answers a compiled label per position and an edge record by id), `Graph::{labels, edges_by_id, positions, edge_records}`, `EdgeRecord.meta`, `EdgeKind::display_label`, `EdgeId::recorded_kind`; `SECTION_SCHEMA_VERSION` 18 -> 19 -- MINOR under 0.x. (0.7.0 = CONTRACT-2: `Partners` renamed `Spouses` (`spouse-of`); `ParentOf` carries a typed `Parentage` and a justification (`EdgeMeta::Parentage`); `Brethren` (`brethren-of`) appended last to the relations and `RowFamily::ALL` (28 -> 29); `LexiconEntry.domains` removed (MACULA dropped); `section_of_justified_by` replaced by `section_of_row` + `section_of_cross_ref` (cross_refs split per row by citing corpus); `MentionedEntity::node_id`; `SECTION_SCHEMA_VERSION` 15 -> 18 -- MINOR under 0.x (public items renamed and removed, closed enums grew). (0.6.0 = ADMIT-PERF-1: ADMIT-PERF-1: `assert_answers_match` sweeps positions across cores (std::thread::scope, no new dependency) and so requires `Sync` of its candidate -- a tightened bound on one public fn, MINOR under 0.x; every implementation in this workspace already satisfied it. (0.4.0 = D5: three row families (ParentOf, Partners, Participates), two directed + one symmetric relation appended, Person payload widened (first/last year, eternal + grounds) -- MINOR (closed enums grew). (0.3.0 = LEX-1: RowFamily::Occurs (a closed enum grew: MINOR under 0.x), Graph::occurs, Section::SHIPPED gains Lexicon (the root moves once). (0.2.1 = DB-4b: Graph::extra_tables; 0.2.0 = DB-3: the one coordinated MINOR (spec 9) -- five port methods, LexiconEntry, Occurs.)))))))))))
edition = "2021"
description = "The Explorable Graph type system — compiling base point for the 2026-08-22 design specs. No dependencies; the compiler is the reviewer."

# Batch M-A (controller ruling 1): joined into the server/ workspace as a
# member (one workspace, one lockfile) -- the standalone-workspace
# detachment above this comment is retired now that the parked HOTFIX-7
# tree is no longer a concern for this crate. Its own law tests still run
# in isolation via `cargo test -p atlas-graph-types`.

[dependencies]
serde = { version = "1", optional = true, default-features = false }
utoipa = { version = "6.0.0", optional = true }

# DB-2a: the ONE switch. OFF (default) = every observable byte is exactly
# what it was before the relational-artifact work began -- 64-bit
# DefaultHasher pids, debug-format canonical bytes, the `dfcf6ee4c2a39965`
# version root. ON = SHA-256-128 content addresses over canonical JSON.
# An empty feature list is the point: no optional dependency hides here.
#
# THE TWO GATES ARE RUN FROM THIS DIRECTORY:
#
#     cd graph-types && cargo test                      # OFF (default)
#     cd graph-types && cargo test --features canon-ids # ON
#
# DB-4a: the atlas workspace is ON -- every `server/` member declares
# `atlas-graph-types = { path, features = ["canon-ids"] }`, so
# `cargo test --workspace` from `server/` builds the ON state. The default
# stays OFF because the map-generator sibling depends on this crate as a
# path dependency and still reads `ContentHash` as a u64; deleting the OFF
# paths is DB-5's call, once it has migrated.
[dev-dependencies]
serde_json = "1"

[features]
canon-ids = []
serde = ["dep:serde"]
openapi = ["dep:utoipa"]
