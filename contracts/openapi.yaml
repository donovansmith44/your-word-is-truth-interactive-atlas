    get:
      tags:
      - reading
      summary: 'One verse in full: its text, who wrote its book, the events it belongs to, its cross references with previews, and the catechism items citing it.'
      description: |-
        `{vref}` is `BOOK.CHAPTER.VERSE`, such as `JHN.3.16`; any other shape is
        `bad_ref`, and a well-formed reference this atlas holds no text for is
        `not_found`.
      operationId: verse
      parameters:
      - name: vref
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerseDetail'
        '400':
          description: The reference, window or query could not be read; the body's `code` is `bad_ref`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Nothing in this atlas answers to that reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: The request was well formed but this atlas's own data for it is incomplete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/xrefs/{sref}:
    get:
      tags:
      - reading
      summary: 'The cross references of a verse or a span, strongest first: each target, how strongly it is attested, and a preview of the text it points at.'
      description: |-
        `{sref}` is `BOOK.CHAPTER.VERSE` or a same-chapter span such as `GEN.1.1-5`;
        a book-only or chapter-only reference is `bad_ref`. A reference with no
        recorded cross references answers an empty list.
      operationId: xrefs
      parameters:
      - name: sref
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CrossRef'
        '400':
          description: The reference, window or query could not be read; the body's `code` is `bad_ref`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Nothing in this atlas answers to that reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: The request was well formed but this atlas's own data for it is incomplete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /health:
    get:
      tags:
      - meta
      summary: Reports that the server is up, as the plain text `ok`.
      operationId: health
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string
components:
  schemas:
    Anchor:
      type: object
      description: 'A stretch of a unit''s text that stands for something the graph holds, half-open: the text from `start` up to but not including `end`, both counted in characters (Unicode scalar values, not bytes) into the unit''s text.'
      required:
      - start
      - end
      - kind
      - node
      properties:
        end:
          type: integer
          minimum: 0
        kind:
          $ref: '#/components/schemas/EdgeKind'
        node:
          $ref: '#/components/schemas/NodeRef'
        start:
          type: integer
          minimum: 0
      additionalProperties: false
    BibleRef:
      allOf:
      - $ref: '#/components/schemas/TextRef'
      - type: object
        required:
        - book
        - chapter
        - verse
        properties:
          book:
            $ref: '#/components/schemas/BookId'
          chapter:
            type: integer
            format: int32
            minimum: 0
          verse:
            type: integer
            format: int32
            minimum: 0
      description: A verse of the Bible.
      unevaluatedProperties: false
    BookDetail:
      type: object
      description: Who wrote one book of the Bible, where, and when; the place and the years are absent where they are not recorded.
      required:
      - author
      properties:
        author:
          type: string
        write_place:
          oneOf:
          - $ref: '#/components/schemas/NodeRef'
          - type: 'null'
        written:
          oneOf:
          - $ref: '#/components/schemas/TimeRange'
          - type: 'null'
      additionalProperties: false
    BookId:
      type: string
      description: A book of the Bible, by its canon code.
      enum:
      - GEN
      - EXO
      - LEV
      - NUM
      - DEU
      - JOS
      - JDG
      - RUT
      - 1SA
      - 2SA
      - 1KI
      - 2KI
      - 1CH
      - 2CH
      - EZR
      - NEH
      - EST
      - JOB
      - PSA
      - PRO
      - ECC
      - SNG
      - ISA
      - JER
      - LAM
      - EZK
      - DAN
      - HOS
      - JOL
      - AMO
      - OBA
      - JON
      - MIC
      - NAM
      - HAB
      - ZEP
      - HAG
      - ZEC
      - MAL
      - MAT
      - MRK
      - LUK
      - JHN
      - ACT
      - ROM
      - 1CO
      - 2CO
      - GAL
      - EPH
      - PHP
      - COL
      - 1TH
      - 2TH
      - 1TI
      - 2TI
      - TIT
      - PHM
      - HEB
      - JAS
      - 1PE
      - 2PE
      - 1JN
      - 2JN
      - 3JN
      - JUD
      - REV
    BookMeta:
      type: object
      description: Who wrote one book of the Bible, where, and when.
      required:
      - author
      properties:
        author:
          type: string
          description: The book's author, as this atlas records him.
        write_from:
          type:
          - integer
          - 'null'
          format: int32
          description: The earliest year it is dated to, negative for BC; absent when undated.
        write_place:
          type:
          - string
          - 'null'
          description: Where it was written, absent when that is not recorded.
        write_to:
          type:
          - integer
          - 'null'
          format: int32
          description: The latest year it is dated to; absent when undated.
      additionalProperties: false
    CanonBook:
      type: object
      description: |-
        One book of the canon: its code, its name, and how many verses each of its
        chapters holds.
      required:
      - code
      - name
      - chapters
      properties:
        chapters:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
          description: The verse count of each chapter, in order.
        code:
          type: string
          description: The three-letter code, such as `GEN`.
        name:
          type: string
          description: The book's full name.
      additionalProperties: false
    CatechismDetail:
      type: object
      description: 'One catechism item''s own words and their explanation: the chief part it belongs to, the question the explanation answers, and where in Scripture its words are written, where it quotes any.'
      required:
      - part_title
      - explanation_heading
      - explanation
      properties:
        explanation:
          type: string
        explanation_heading:
          type: string
        part_title:
          type: string
        text:
          type:
          - string
          - 'null'
        where_written:
          type:
          - string
          - 'null'
      additionalProperties: false
    CatechismItem:
      type: object
      description: |-
        One catechism item in full, with the chief part of the catechism it sits
        under.
      required:
      - id
      - name
      - part_title
      - explanation_heading
      - explanation
      - verses
      properties:
        explanation:
          type: string
        explanation_heading:
          type: string
          description: The question the explanation answers, such as "What does this mean?".
        id:
          type: string
        name:
          type: string
        part_title:
          type: string
          description: The chief part this item belongs to, such as Baptism.
        text:
          type:
          - string
          - 'null'
          description: |-
            The item's own words -- a commandment, a petition, an article -- absent for
            an item that has none.
        verses:
          type: array
          items:
            $ref: '#/components/schemas/CatechismProofVerse'
        where_written:
          type:
          - string
          - 'null'
          description: |-
            Where in Scripture the item's own words are written, absent when it quotes
            none.
      additionalProperties: false
    CatechismProofVerse:
      type: object
      description: |-
        One proof verse of a catechism item, carrying the verse in full rather than
        a preview.
      required:
      - vref
      - text
      properties:
        question:
          type:
          - string
          - 'null'
          description: |-
            The question this verse was cited under, absent when the item cites it
            directly.
        text:
          type: string
        vref:
          type: string
      additionalProperties: false
    CatechismRef:
      type: object
      description: |-
        One catechism item citing a verse or a span: enough to name it and to fetch
        it in full.
      required:
      - id
      - name
      - provenance
      properties:
        id:
          type: string
        name:
          type: string
        provenance:
          type: array
          items:
            type: string
          description: |-
            The sources behind this response's catechism citations. Every element of one
            response carries the same set; `/api/sources` names each id.
        question:
          type:
          - string
          - 'null'
          description: |-
            The question the verse was cited under, absent when the item cites it
            directly.
      additionalProperties: false
    Chapter:
      type: object
      description: One chapter of Scripture, verse by verse.
      required:
      - ref
      - book
      - chapter
      - verses
      properties:
        book:
          type: string
          description: The book's full name.
        chapter:
          type: integer
          format: int32
          minimum: 0
        ref:
          type: string
        verses:
          type: array
          items:
            $ref: '#/components/schemas/Verse'
      additionalProperties: false
    ConcordRef:
      allOf:
      - $ref: '#/components/schemas/TextRef'
      - type: object
        required:
        - part
        - article
        - paragraph
        properties:
          article:
            type: integer
            format: int32
            minimum: 0
          paragraph:
            type: integer
            format: int32
            minimum: 0
          part:
            type: integer
            format: int32
            minimum: 0
      description: A paragraph of the Book of Concord.
      unevaluatedProperties: false
    Confidence:
      type: string
      description: How a claim was arrived at.
      enum:
      - CanonicalText
      - Curated
      - Imported
      - Derived
    Contents:
      type: object
      description: One corpus's contents, as a tree two levels deep.
      required:
      - corpus
      - version
      - roots
      properties:
        corpus:
          $ref: '#/components/schemas/Corpus'
        roots:
          type: array
          items:
            $ref: '#/components/schemas/ContentsRoot'
        version:
          type: string
          description: A stamp identifying the data set this tree was read from.
      additionalProperties: false
    ContentsChild:
      type: object
      description: 'A second-level entry: a chapter of a book, or an article of a document.'
      required:
      - id
      - title
      - kind
      - ref
      - locus
      - count
      properties:
        count:
          type: integer
          description: 'How many members it holds: verses of a chapter, paragraphs of an article.'
          minimum: 0
        id:
          type: string
        kind:
          $ref: '#/components/schemas/ContentsChildKind'
        locus:
          $ref: '#/components/schemas/TextRef'
        ref:
          type: string
          description: |-
            The reference to open for this entry: `GEN.1` for a chapter, or an
            article's first paragraph, such as `BoC 7.2.1`.
        title:
          type: string
      additionalProperties: false
    ContentsChildKind:
      type: string
      description: |-
        Whether a second-level entry of a corpus's contents is a chapter of a book
        or an article of a document. The contents tree goes no deeper than this.
      enum:
      - chapter
      - article
    ContentsRoot:
      type: object
      description: |-
        A top-level entry: a book of the Bible, or a document of the Book of
        Concord.
      required:
      - id
      - title
      - kind
      - ref
      - locus
      - children
      properties:
        children:
          type: array
          items:
            $ref: '#/components/schemas/ContentsChild'
          description: The entry's chapters, or its articles.
        group:
          oneOf:
          - $ref: '#/components/schemas/Testament'
            description: |-
              Which half of the canon the book belongs to; absent for a Concord document,
              which belongs to neither.
          - type: 'null'
        id:
          type: string
        kind:
          $ref: '#/components/schemas/ContentsRootKind'
        locus:
          $ref: '#/components/schemas/TextRef'
        ref:
          type: string
          description: 'The reference to open when this entry is chosen: its first child''s.'
        title:
          type: string
      additionalProperties: false
    ContentsRootKind:
      type: string
      description: |-
        Whether a top-level entry of a corpus's contents is a book of the Bible
        or a document of the Book of Concord.
      enum:
      - book
      - document
    Contract:
      type: object
      description: The schema versions of the data behind this server's responses.
      required:
      - manifest_schema
      - section_schema_version
      properties:
        manifest_schema:
          type: integer
          format: int32
          description: The schema version of the compiled data set the responses are read from.
          minimum: 1
        section_schema_version:
          type: integer
          format: int32
          description: The schema version of the individual sections that data set is made of.
          minimum: 1
      additionalProperties: false
    Corpus:
      type: string
      description: |-
        A body of text this API serves a reading spine for: Scripture, or the
        Book of Concord.
      enum:
      - bible
      - concord
    CrossRef:
      type: object
      description: |-
        One cross reference: where it points, how strongly it is attested, and a
        look at the text there.
      required:
      - target
      - votes
      - preview
      - provenance
      properties:
        preview:
          type: string
          description: The text of the target's first verse.
        provenance:
          type: array
          items:
            type: string
          description: |-
            The sources behind this response's cross references. Every element of one
            response carries the same set; `/api/sources` names each id.
        target:
          type: string
          description: 'The reference pointed at: one verse, or a span.'
        votes:
          type: integer
          format: int32
          description: How many readers voted for this reference. Higher sorts first.
      additionalProperties: false
    DateClaim:
      type: object
      description: A date something is claimed to have happened at, the verses the claim rests on, the event it rests on where it names one, and the note that qualifies it where the date is not Scripture's own; the label is marked `c. ` where the claim carries a note.
      required:
      - when
      - label
      - verses
      properties:
        event:
          oneOf:
          - $ref: '#/components/schemas/NodeRef'
          - type: 'null'
        label:
          type: string
        note:
          type:
          - string
          - 'null'
        verses:
          type: array
          items:
            $ref: '#/components/schemas/TextSpan'
        when:
          $ref: '#/components/schemas/TimeRange'
      additionalProperties: false
    EdgeElement:
      allOf:
      - $ref: '#/components/schemas/Element'
      - type: object
        required:
        - edge
        properties:
          edge:
            $ref: '#/components/schemas/EdgeRecord'
      description: The edge an id names, as its own record.
      unevaluatedProperties: false
    EdgeEntry:
      type: object
      description: 'One neighbour, with the edge that joins it and what that edge records: `neighbour` is what the edge leads to, a node or, on a `justifies` page, the edge the node grounds; `votes` only on a cross reference, `narrative` only on a narrative''s succession, `loci` on an attestation (for `attested-in`, the runs of verses its account reads on without a break; for `attests`, the verse itself) and on a mention (each occurrence of the name in the verse as a span of its words, absent where the name is not found among the verse''s words), `note` only on an attestation, `parentage` only on a parent-of edge. A page lists an edge once however many rows record it.'
      required:
      - edge
      - neighbour
      properties:
        edge:
          $ref: '#/components/schemas/EdgeRef'
        loci:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TextSpan'
        narrative:
          oneOf:
          - $ref: '#/components/schemas/NarrativeId'
          - type: 'null'
        neighbour:
          $ref: '#/components/schemas/PositionRef'
        note:
          type:
          - string
          - 'null'
        parentage:
          oneOf:
          - $ref: '#/components/schemas/Parentage'
          - type: 'null'
        votes:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      additionalProperties: false
    EdgeKind:
      type: string
      description: 'A relation between two nodes, named in the direction it is travelled: the label one page of a node''s neighbours is asked for by.'
      enum:
      - contains
      - member-of
      - attested-in
      - attests
      - follows-in
      - precedes-in
      - dated-by
      - dates
      - located-at
      - site-of
      - mentions
      - mentioned-in
      - cites
      - cited-by
      - quotes
      - quoted-by
      - confesses
      - confessed-in
      - fulfilled-in
      - fulfills
      - prefigures
      - prefigured-by
      - named-after
      - namesake-of
      - justified-by
      - justifies
      - comments-on
      - commented-on-by
      - spoken-by
      - speech-of
      - spoken-at
      - site-of-speech
      - derived-from
      - derives
      - occurs-in
      - words
      - parent-of
      - child-of
      - participates-in
      - participants
      - authored-by
      - authored
      - shows
      - shown-on
      - analogous-to
      - catechism-link
      - corresponds-to
      - parallel
      - temporal-adjacency
      - spouse-of
      - brethren-of
    EdgePage:
      type: object
      description: One page of a node's neighbours of a single kind.
      required:
      - kind
      - entries
      - version
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/EdgeEntry'
        kind:
          $ref: '#/components/schemas/EdgeKind'
        next:
          type:
          - integer
          - 'null'
          description: Pass this back as `cursor` for the following page; absent on the last page.
          minimum: 0
        version:
          type: string
          description: A stamp identifying the data set this page was read from.
      additionalProperties: false
    EdgePosition:
      allOf:
      - $ref: '#/components/schemas/PositionRef'
      - type: object
        required:
        - edge
        properties:
          edge:
            $ref: '#/components/schemas/EdgeRef'
      description: 'An edge''s far end when it is another edge: a `justifies` page names the edge the node grounds.'
      unevaluatedProperties: false
    EdgeRecord:
      type: object
      description: 'One edge of the graph: its id, the kind it is recorded in, its compiled label, its two ends in that direction, the source that asserts it (absent for an edge derived from the grounds of the edge it justifies), what it records (`votes` on a cross reference, `narrative` on a narrative''s succession, `parentage` on a parent-of edge), and how many neighbours it has of each kind.'
      required:
      - id
      - kind
      - label
      - subject
      - object
      - edge_summary
      properties:
        edge_summary:
          type: array
          items:
            $ref: '#/components/schemas/EdgeSummaryEntry'
        id:
          type: string
        kind:
          $ref: '#/components/schemas/EdgeKind'
        label:
          type: string
        narrative:
          oneOf:
          - $ref: '#/components/schemas/NarrativeId'
          - type: 'null'
        object:
          $ref: '#/components/schemas/PositionRef'
        parentage:
          oneOf:
          - $ref: '#/components/schemas/Parentage'
          - type: 'null'
        provenance:
          type:
          - string
          - 'null'
        subject:
          $ref: '#/components/schemas/PositionRef'
        votes:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      additionalProperties: false
    EdgeRef:
      type: object
      description: 'A reference to an edge: its id, which the page of either end carries for this same connection and the element read answers, the kind it is recorded in, and its compiled label.'
      required:
      - id
      - kind
      - label
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/EdgeKind'
        label:
          type: string
      additionalProperties: false
    EdgeSummaryEntry:
      type: object
      description: How many neighbours of one kind something has.
      required:
      - kind
      - count
      properties:
        count:
          type: integer
          minimum: 0
        kind:
          $ref: '#/components/schemas/EdgeKind'
      additionalProperties: false
    Element:
      type: object
      description: 'One answer of the element read: the node or the edge an id names, or the id itself where it names nothing. `element` says which shape follows.'
      required:
      - element
      properties:
        element:
          type: string
          enum:
          - node
          - edge
          - missing
      additionalProperties: true
      discriminator:
        mapping:
          edge: '#/components/schemas/EdgeElement'
          missing: '#/components/schemas/MissingElement'
          node: '#/components/schemas/NodeElement'
        propertyName: element
    ElementPage:
      type: object
      description: 'The elements asked for, in the order their ids were given: `elements[i]` answers the i-th id. `version` stamps the data set they were read from.'
      required:
      - elements
      - version
      properties:
        elements:
          type: array
          items:
            $ref: '#/components/schemas/Element'
        version:
          type: string
      additionalProperties: false
    Era:
      type: object
      description: 'A named stretch of this atlas''s timeline: its first and last years (negative for BC) and the same years labelled.'
      required:
      - id
      - name
      - from_year
      - to_year
      - window
      properties:
        from_year:
          type: integer
          format: int32
        id:
          $ref: '#/components/schemas/EraId'
        name:
          type: string
        to_year:
          type: integer
          format: int32
        window:
          $ref: '#/components/schemas/TimeRange'
      additionalProperties: false
    EraId:
      type: string
      description: The id of one Era node.
    ErrorBody:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorInner'
      additionalProperties: false
    ErrorCode:
      type: string
      description: |-
        Why this API refused a request: the one word a consumer branches on, beside
        which the message is prose for a reader.
      enum:
      - bad_ref
      - bad_kind
      - bad_scope
      - bad_window
      - bad_corpus
      - bad_dir
      - too_many
      - not_found
      - internal
    ErrorInner:
      type: object
      required:
      - code
      - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
      additionalProperties: false
    EventAnalogue:
      type: object
      description: |-
        One event whose account resembles another's -- similar in form or in content,
        never a second account of the same happening.
      required:
      - id
      - title
      - provenance
      properties:
        id:
          type: string
        provenance:
          type: string
          description: |-
            The id of the source that asserts the resemblance. A resemblance is a claim
            of its own, so this is neither event's own source.
        title:
          type: string
      additionalProperties: false
    EventDetail:
      type: object
      description: What is recorded about one event or titled passage. `when` is absent for a titled passage, which has no date; each section, the superscription and the note are absent where none is recorded.
      required:
      - kind
      properties:
        acts_section:
          type:
          - string
          - 'null'
        atlas_section:
          type:
          - string
          - 'null'
        kind:
          $ref: '#/components/schemas/EventKind'
        kjv_superscription:
          type:
          - string
          - 'null'
        ref_note:
          type:
          - string
          - 'null'
        robertson_section:
          type:
          - string
          - 'null'
        when:
          oneOf:
          - $ref: '#/components/schemas/TimeRange'
          - type: 'null'
      additionalProperties: false
    EventId:
      type: string
      description: The id of one Event node.
    EventKind:
      type: string
      description: |-
        Which kind of container this is: an `event`, something that happened at a
        date, or a `general` titled passage, which has none.
      enum:
      - event
      - general
    EventPage:
      type: object
      description: One event, or one titled passage, in full.
      required:
      - id
      - title
      - kind
      - places
      - witnesses
      - provenance
      properties:
        acts_section:
          type:
          - string
          - 'null'
          description: |-
            The section of the outline of Acts this event falls in, absent when it has
            none.
        analogues:
          type: array
          items:
            $ref: '#/components/schemas/EventAnalogue'
          description: |-
            Events whose accounts resemble this one without being accounts of it.
            Omitted when there are none.
        atlas_section:
          type:
          - string
          - 'null'
          description: |-
            The titled section of this atlas's own outline of Scripture, absent when it
            has none.
        id:
          type: string
        kind:
          $ref: '#/components/schemas/EventKind'
        kjv_superscription:
          type:
          - string
          - 'null'
          description: |-
            The superscription the King James Version prints over this passage, absent
            when it prints none.
        mentioned_in:
          type: array
          items:
            type: string
          description: |-
            The verses that mention this event without narrating it, in canonical order.
            Omitted when there are none.
        mentions_provenance:
          type: array
          items:
            type: string
          description: |-
            The sources behind the verses that mention this event. Omitted when there are
            none.
        places:
          type: array
          items:
            $ref: '#/components/schemas/PlaceRef'
        provenance:
          type: string
          description: The id of the source that asserts this event; `/api/sources` names it.
        ref_note:
          type:
          - string
          - 'null'
          description: |-
            A note on how this event's date and grouping were arrived at, absent when
            none was needed.
        robertson_section:
          type:
          - string
          - 'null'
          description: |-
            The section of Robertson's Harmony of the Gospels this event falls in, absent
            when it has none.
        title:
          type: string
        when:
          oneOf:
          - $ref: '#/components/schemas/YearSpan'
            description: The years the event spans; absent for a titled passage that has no date.
          - type: 'null'
        witnesses:
          type: array
          items:
            $ref: '#/components/schemas/EventWitness'
          description: The passages that narrate this event, one per book. Always at least one.
        witnesses_provenance:
          type: array
          items:
            type: string
          description: |-
            The sources behind the passages that narrate this event, for this event
            rather than for the corpus. Omitted when there are none.
      additionalProperties: false
    EventWitness:
      type: object
      description: |-
        One book's account of an event: the passage it narrates the event in, and any
        note on the citation.
      required:
      - book
      - verse_groups
      properties:
        book:
          type: string
          description: The book's three-letter code, such as `MAT`.
        ref_note:
          type:
          - string
          - 'null'
          description: |-
            A note on how THIS account is cited -- not the event's own note about how its
            date and grouping were arrived at. Absent when the account needed none.
        robertson_section:
          type:
          - string
          - 'null'
          description: |-
            The section of Robertson's Harmony of the Gospels this account falls in, sent
            only where it differs from the event's own. Absent otherwise.
        verse_groups:
          type: array
          items:
            $ref: '#/components/schemas/VerseGroup'
          description: The verses of this account, grouped by chapter.
      additionalProperties: false
    Heading:
      type: object
      description: |-
        The pericope heading that belongs above one verse: the container it names,
        its title, that container's kind, and whether this verse merely continues
        coverage that began in an earlier chapter rather than opening it.
      required:
      - event_id
      - title
      - kind
      - is_continuation
      properties:
        event_id:
          type: string
          description: |-
            The id of the event or titled passage that covers this verse and gives the
            heading its words; `/api/event/{id}` fetches it.
        is_continuation:
          type: boolean
          description: |-
            True when this verse carries on coverage that began in an earlier chapter
            rather than opening it, so a reader can render it as a continued heading.
        kind:
          $ref: '#/components/schemas/EventKind'
        title:
          type: string
          description: The heading as a reader sees it.
      additionalProperties: false
    History:
      type: object
      description: |-
        What is known about a place's name and existence over time, resolved for the
        years asked about.
      required:
      - display_name
      properties:
        blurb:
          type:
          - string
          - 'null'
          description: A short description of the place in those years, absent when none applies.
        destroyed:
          oneOf:
          - $ref: '#/components/schemas/PlaceDateClaim'
            description: When the place was destroyed, absent when that is not recorded.
          - type: 'null'
        display_name:
          type: string
          description: |-
            The name this place bore in the years asked about, falling back to its
            default name when no period name applies.
        established:
          oneOf:
          - $ref: '#/components/schemas/PlaceDateClaim'
            description: When the place was founded, absent when that is not recorded.
          - type: 'null'
      additionalProperties: false
    KretzmannChapter:
      type: object
      description: Every verse of one chapter that carries commentary, in canon order.
      required:
      - verses
      - version
      properties:
        verses:
          type: array
          items:
            $ref: '#/components/schemas/KretzmannChapterVerse'
        version:
          type: string
          description: A stamp identifying the data set this commentary was read from.
      additionalProperties: false
    KretzmannChapterItem:
      type: object
      description: 'One commentary item: the id that fetches its prose, and its heading.'
      required:
      - id
      properties:
        heading:
          type:
          - string
          - 'null'
          description: Absent for an item with no heading of its own.
        id:
          type: string
      additionalProperties: false
    KretzmannChapterVerse:
      type: object
      description: |-
        One verse's commentary items, in document order. Only verses with at least
        one item appear at all.
      required:
      - verse
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KretzmannChapterItem'
        verse:
          type: integer
          format: int32
          minimum: 0
      additionalProperties: false
    LandMask:
      type: object
      description: |-
        The coastline geometry border washes are clipped against, so no polity's
        colour spills into open sea.
      required:
      - rings
      properties:
        rings:
          type: array
          items:
            type: array
            items:
              $ref: '#/components/schemas/Point'
          description: Closed rings of [latitude, longitude] points, in degrees.
      additionalProperties: false
    Landmark:
      type: object
      description: |-
        An always-on map label: a water, a mountain or a region, drawn at one point
        and never interactive.
      required:
      - name
      - kind
      - lat
      - lon
      properties:
        kind:
          $ref: '#/components/schemas/LandmarkKind'
        lat:
          type: number
          format: double
          description: Latitude in degrees, north positive.
        lon:
          type: number
          format: double
          description: Longitude in degrees, east positive.
        name:
          type: string
        size:
          oneOf:
          - $ref: '#/components/schemas/LandmarkSize'
            description: |-
              A size hint for a label meant to stay readable when zoomed out; absent for
              most landmarks.
          - type: 'null'
      additionalProperties: false
    LandmarkKind:
      type: string
      description: Which sort of always-on map label this is.
      enum:
      - water
      - mountain
      - region
    LandmarkSize:
      type: string
      description: How large a landmark's label is drawn, smallest first.
      enum:
      - sm
      - md
      - lg
    MissingElement:
      allOf:
      - $ref: '#/components/schemas/Element'
      - type: object
        required:
        - id
        properties:
          id:
            type: string
      description: An id that reads as a node's or an edge's but names nothing this atlas holds.
      unevaluatedProperties: false
    Narrative:
      type: object
      description: |-
        A journey or storyline through the atlas: an ordered chain of events the map
        draws as a run of arrows.
      required:
      - id
      - name
      - color
      - legs
      properties:
        color:
          type: string
          description: The colour its arrows are drawn in.
        id:
          type: string
        legs:
          type: array
          items:
            type: string
          description: The ids of its events, in order, never running backwards in time.
        name:
          type: string
      additionalProperties: false
    NarrativeAdjacentEvent:
      type: object
      description: |-
        An event next to the one asked about: enough to show it, and the id to travel
        to it with.
      required:
      - id
      - label
      - places
      - verse_groups
      properties:
        id:
          type: string
        label:
          type: string
        places:
          type: array
          items:
            type: string
          description: The ids of the places it touches.
        verse_groups:
          type: array
          items:
            $ref: '#/components/schemas/VerseGroup'
          description: The passages it is narrated in, grouped by book and chapter.
      additionalProperties: false
    NarrativeEventPositions:
      type: object
      description: |-
        Where one event sits in time: in each narrative it belongs to, and in the
        atlas's whole chronology.
      required:
      - narrative
      properties:
        narrative:
          type: array
          items:
            $ref: '#/components/schemas/NarrativePosition'
        timeline:
          oneOf:
          - $ref: '#/components/schemas/TimelinePosition'
            description: The event's place in the whole chronology; absent for an event with no date.
          - type: 'null'
      additionalProperties: false
    NarrativeId:
      type: string
      description: The id of one Narrative node.
    NarrativePosition:
      type: object
      description: One event's place in one narrative, with the legs on either side of it.
      required:
      - narrative_id
      - narrative_name
      - event_id
      - event_label
      properties:
        event_id:
          type: string
        event_label:
          type: string
        following:
          oneOf:
          - $ref: '#/components/schemas/NarrativeAdjacentEvent'
            description: The leg after this one; absent at the narrative's last leg.
          - type: 'null'
        narrative_id:
          type: string
        narrative_name:
          type: string
        prior:
          oneOf:
          - $ref: '#/components/schemas/NarrativeAdjacentEvent'
            description: The leg before this one; absent at the narrative's first leg.
          - type: 'null'
      additionalProperties: false
    NodeElement:
      allOf:
      - $ref: '#/components/schemas/Element'
      - type: object
        required:
        - node
        properties:
          node:
            $ref: '#/components/schemas/NodeRecord'
      description: The node an id names, as its own record.
      unevaluatedProperties: false
    NodeKind:
      type: string
      description: What kind of thing one node of this atlas stands for.
      enum:
      - TextUnit
      - Container
      - Event
      - Narrative
      - Place
      - Person
      - Anchor
      - Era
      - Polity
      - CatechismItem
      - Source
      - Translation
      - PeopleGroup
      - CommentaryItem
      - LexiconEntry
      - Map
    NodePosition:
      allOf:
      - $ref: '#/components/schemas/PositionRef'
      - type: object
        required:
        - node
        properties:
          node:
            $ref: '#/components/schemas/NodeRef'
      description: An edge's far end when it is a node.
      unevaluatedProperties: false
    NodeRecord:
      type: object
      description: |-
        One node of the graph at a glance: what it is, what to call it, where it
        came from, and what it connects to.
      required:
      - id
      - kind
      - label
      - provenance
      - edge_summary
      - version
      properties:
        book:
          oneOf:
          - $ref: '#/components/schemas/BookDetail'
          - type: 'null'
        catechism:
          oneOf:
          - $ref: '#/components/schemas/CatechismDetail'
          - type: 'null'
        description:
          type:
          - string
          - 'null'
          description: |-
            Public-domain dictionary or commentary prose about this node, absent when
            none is recorded. Never invented.
        edge_summary:
          type: array
          items:
            $ref: '#/components/schemas/EdgeSummaryEntry'
          description: |-
            How many neighbours this node has of each kind, listing only the kinds it
            has any of.
        event:
          oneOf:
          - $ref: '#/components/schemas/EventDetail'
          - type: 'null'
        id:
          type: string
        kind:
          $ref: '#/components/schemas/NodeKind'
        label:
          type: string
        person:
          oneOf:
          - $ref: '#/components/schemas/PersonLife'
            description: Life facts, present only for a person.
          - type: 'null'
        place:
          oneOf:
          - $ref: '#/components/schemas/PlaceDetail'
          - type: 'null'
        provenance:
          type: string
          description: The id of the source that asserts this node; `/api/sources` names it.
        version:
          type: string
          description: A stamp identifying the data set this record was read from.
      additionalProperties: false
    NodeRef:
      type: object
      description: 'A reference to a node: enough to show it, and the id to fetch it with.'
      required:
      - id
      - kind
      - label
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/NodeKind'
        label:
          type: string
      additionalProperties: false
    Parentage:
      type: string
      description: 'How a parent stands to a child. Every parent-of row is natural unless Scripture declares otherwise: God the Father begets the Son from eternity, the Virgin Mary bore Him, Joseph was His father as was supposed, and God created Adam and Eve.'
      enum:
      - natural
      - eternal
      - virgin
      - legal
      - created
    PersonLife:
      type: object
      description: What is recorded about one person's life.
      required:
      - eternal
      - eternal_grounds
      - also_called
      properties:
        also_called:
          type: array
          items:
            type: string
          description: Other names this person is known by.
        birth:
          oneOf:
          - $ref: '#/components/schemas/Year'
          - type: 'null'
        death:
          oneOf:
          - $ref: '#/components/schemas/Year'
            description: The year of death where one is recorded.
          - type: 'null'
        eternal:
          type: boolean
          description: |-
            True for a person Scripture presents as eternal, who therefore carries no
            years at all.
        eternal_grounds:
          type: array
          items:
            type: string
          description: The verses on which that is claimed.
        first:
          oneOf:
          - $ref: '#/components/schemas/Year'
            description: |-
              The earliest year at which this person is mentioned -- the span of mentions,
              never a lifespan.
          - type: 'null'
        gender:
          type:
          - string
          - 'null'
          description: Absent when the source records none.
        last:
          oneOf:
          - $ref: '#/components/schemas/Year'
            description: The latest year at which this person is mentioned.
          - type: 'null'
      additionalProperties: false
    PersonRef:
      type: object
      description: A person the graph attests at a verse -- never a name matched against the text -- with the id to read and the name to show for it.
      required:
      - id
      - name
      properties:
        id:
          type: string
        name:
          type: string
      additionalProperties: false
    PlaceDateClaim:
      type: object
      description: A date this atlas claims for a place, with the verses it rests on.
      required:
      - when
      - verses
      properties:
        event:
          oneOf:
          - $ref: '#/components/schemas/EventId'
            description: |-
              The event this founding or fall is, when the verses attest one; absent for a
              claim inferred from later references rather than narrated.
          - type: 'null'
        note:
          type:
          - string
          - 'null'
          description: |-
            A qualifier such as `traditional`, shown as a leading "c." on the date;
            absent when the date needs none.
        verses:
          type: array
          items:
            type: string
          description: The verses supporting the claim.
        when:
          $ref: '#/components/schemas/YearSpan'
          description: The year claimed, or the range; a single year is a span whose ends are equal.
      additionalProperties: false
    PlaceDetail:
      type: object
      description: Where one place is (latitude north positive, longitude east positive), the name a reader of the King James Version knows it by, its plain canonical name only where that differs, and when it was founded and fell, where that is recorded.
      required:
      - lat
      - lon
      - display_name
      properties:
        canonical_name:
          type:
          - string
          - 'null'
        destroyed:
          oneOf:
          - $ref: '#/components/schemas/DateClaim'
          - type: 'null'
        display_name:
          type: string
        established:
          oneOf:
          - $ref: '#/components/schemas/DateClaim'
          - type: 'null'
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
      additionalProperties: false
    PlacePage:
      type: object
      description: |-
        One place: where it is, the events that happened there, and what is known
        about its name and its history.
      required:
      - id
      - name
      - lat
      - lon
      - events
      properties:
        canonical_name:
          type:
          - string
          - 'null'
          description: |-
            The place's plain canonical name, present only when the name being shown is
            a period name or a translation's own wording and so differs from it.
        description:
          type:
          - string
          - 'null'
          description: |-
            Public-domain dictionary prose about the place, absent when none is
            recorded. Never invented.
        events:
          type: array
          items:
            $ref: '#/components/schemas/SceneEvent'
        history:
          oneOf:
          - $ref: '#/components/schemas/History'
            description: Absent for a place with no curated history.
          - type: 'null'
        id:
          type: string
        lat:
          type: number
          format: double
          description: Latitude in degrees, north positive.
        lon:
          type: number
          format: double
          description: Longitude in degrees, east positive.
        name:
          type: string
      additionalProperties: false
    PlaceRef:
      type: object
      description: 'A place named by something else on this response: its id, to read or to target on the map, and the name to show for it.'
      required:
      - id
      - name
      properties:
        id:
          type: string
        name:
          type: string
      additionalProperties: false
    Point:
      type: array
      items:
        type: number
      description: 'One point of a border: latitude then longitude, in degrees.'
      maxItems: 2
      minItems: 2
    Polities:
      type: object
      description: The polity borders in view for the span of years asked about.
      required:
      - polities
      properties:
        polities:
          type: array
          items:
            $ref: '#/components/schemas/Polity'
      additionalProperties: false
    Polity:
      type: object
      description: |-
        One era of one polity's border. The `id` and `color_key` are the polity's
        and hold across every era row it contributes; the name, the years and the
        rings belong to this era alone.
      required:
      - id
      - name
      - from
      - to
      - reign
      - rings
      - color_key
      properties:
        color_key:
          type: integer
          format: int32
          description: A number fixed per polity, so its eras can be coloured consistently.
          minimum: 0
        fall:
          oneOf:
          - $ref: '#/components/schemas/PolityDelta'
            description: The event that ended this polity for good, absent when none is recorded.
          - type: 'null'
        from:
          type: integer
          format: int32
          description: The first year of this era, negative for BC.
        id:
          $ref: '#/components/schemas/PolityId'
        name:
          type: string
          description: The polity's name during this era.
        reign:
          $ref: '#/components/schemas/TimeRange'
        rings:
          type: array
          items:
            type: array
            items:
              $ref: '#/components/schemas/Point'
          description: |-
            This era's border, as closed rings of [latitude, longitude] points, in
            degrees.
        to:
          type: integer
          format: int32
          description: The last year of this era.
        transition:
          oneOf:
          - $ref: '#/components/schemas/PolityDelta'
            description: The event that opened this era, absent when none is recorded.
          - type: 'null'
      additionalProperties: false
    PolityDelta:
      type: object
      description: |-
        The event at one boundary of a polity's era: its rise, a change of its
        borders, or its fall.
      required:
      - event
      - verses
      - ref_note
      properties:
        event:
          type: string
          description: A short description of what happened.
        ref_note:
          type: string
          description: The sources actually consulted for this event.
        verses:
          type: array
          items:
            type: string
          description: |-
            The verses grounding it. May be empty for an event history records but no
            single verse pinpoints; never a fabricated reference.
      additionalProperties: false
    PolityId:
      type: string
      description: The id of one Polity node.
    PositionRef:
      type: object
      description: 'What an edge leads to: a node, or, where one relation grounds another, the edge it grounds. `position` says which shape follows.'
      required:
      - position
      properties:
        position:
          type: string
          enum:
          - node
          - edge
      additionalProperties: true
      discriminator:
        mapping:
          edge: '#/components/schemas/EdgePosition'
          node: '#/components/schemas/NodePosition'
        propertyName: position
    ProvenanceEntry:
      type: object
      description: |-
        The join between a provenance id as records carry it and the source that
        names, describes and licenses it.
      required:
      - id
      - source
      - confidence
      properties:
        confidence:
          $ref: '#/components/schemas/Confidence'
        id:
          type: string
          description: The provenance id exactly as a record carries it.
        locator:
          type:
          - string
          - 'null'
          description: |-
            What inside the named source this id draws on, absent when the source's own
            description already says.
        source:
          type: string
          description: The id of the source this is a claim by.
      additionalProperties: false
    QuietPlace:
      type: object
      description: |-
        A place this atlas knows an event at, drawn on the map but not lit for the
        span asked about.
      required:
      - id
      - display_name
      - lat
      - lon
      - total_events
      properties:
        display_name:
          type: string
          description: The name to show, resolved for the same span the lit places use.
        existence_from:
          oneOf:
          - $ref: '#/components/schemas/Year'
            description: The year this place was founded, where that is recorded; absent otherwise.
          - type: 'null'
        existence_to:
          oneOf:
          - $ref: '#/components/schemas/Year'
            description: The year it ceased to exist, where that is recorded; absent otherwise.
          - type: 'null'
        id:
          type: string
        lat:
          type: number
          format: double
          description: Latitude in degrees, north positive.
        lon:
          type: number
          format: double
          description: Longitude in degrees, east positive.
        merged_ids:
          type: array
          items:
            type: string
          description: |-
            The ids of other records for this same place, folded into this one. Omitted
            when there are none.
        total_events:
          type: integer
          format: int32
          description: |-
            How many events touch this place in any year. A count for the span asked
            about would always be zero, which is what makes the place quiet.
          minimum: 0
      additionalProperties: false
    Scene:
      type: object
      description: |-
        The map at one moment of enquiry: which places are lit, which are only
        present, and which arrows run between them.
      required:
      - mode
      - places
      - quiet_places
      - arrows
      - narratives
      properties:
        arrows:
          type: array
          items:
            $ref: '#/components/schemas/SceneArrow'
          description: The movements narratives draw between the places in view.
        mode:
          $ref: '#/components/schemas/SceneMode'
        narratives:
          type: array
          items:
            $ref: '#/components/schemas/SceneNarrative'
          description: The narratives with at least one leg in view.
        places:
          type: array
          items:
            $ref: '#/components/schemas/ScenePlace'
          description: The places something in view happens at.
        quiet_places:
          type: array
          items:
            $ref: '#/components/schemas/QuietPlace'
          description: |-
            Every other place this atlas knows an event at: present on the map but not
            lit. Always sent, and always empty for a passage.
        ref:
          type:
          - string
          - 'null'
          description: The passage asked about; absent when a span of years was asked about instead.
        window:
          oneOf:
          - $ref: '#/components/schemas/TimeRange'
            description: The span of years asked about; absent when a passage was asked about instead.
          - type: 'null'
      additionalProperties: false
    SceneArrow:
      type: object
      description: |-
        One leg of a narrative drawn on the map: a movement from one place to the
        next.
      required:
      - narrative
      - color
      - from_place
      - to_place
      - from_event
      - to_event
      - order
      properties:
        color:
          type: string
          description: The colour that narrative is drawn in.
        from_event:
          type: string
          description: The id of the event at the starting place.
        from_place:
          type: string
          description: The id of the place the movement starts from.
        narrative:
          type: string
          description: The id of the narrative this leg belongs to.
        order:
          type: integer
          format: int32
          description: This leg's position along the narrative, counting from its first.
          minimum: 0
        to_event:
          type: string
          description: The id of the event at the arriving place.
        to_place:
          type: string
          description: The id of the place it arrives at.
      additionalProperties: false
    SceneEvent:
      type: object
      description: 'One event at a place: when it happened, and where it is narrated.'
      required:
      - id
      - label
      - when
      - verse_groups
      properties:
        id:
          type: string
        label:
          type: string
        verse_groups:
          type: array
          items:
            $ref: '#/components/schemas/VerseGroup'
          description: The passages narrating it, grouped by book and chapter.
        when:
          $ref: '#/components/schemas/TimeRange'
          description: The years the event spans.
      additionalProperties: false
    SceneMode:
      type: string
      description: |-
        Which question a scene answers: what was happening in a span of years,
        or where a passage happens.
      enum:
      - time
      - scripture
    SceneNarrative:
      type: object
      description: One narrative with at least one leg in view.
      required:
      - id
      - name
      - color
      - legs_in_scene
      properties:
        color:
          type: string
          description: The colour its arrows are drawn in.
        id:
          type: string
        legs_in_scene:
          type: integer
          format: int32
          description: How many of its legs are in view.
          minimum: 0
        name:
          type: string
      additionalProperties: false
    ScenePlace:
      type: object
      description: One lit place on the map, with the events that light it.
      required:
      - id
      - name
      - display_name
      - lat
      - lon
      - brightness
      - events
      properties:
        brightness:
          type: integer
          format: int32
          description: |-
            How brightly to draw this place, from how much of what is in view happens
            here.
          maximum: 255
          minimum: 0
        display_name:
          type: string
          description: |-
            The name to show: the one this place bore in the span asked about, or its
            default name when no period name applies.
        events:
          type: array
          items:
            $ref: '#/components/schemas/SceneEvent'
        existence_from:
          oneOf:
          - $ref: '#/components/schemas/Year'
            description: The year this place was founded, where that is recorded; absent otherwise.
          - type: 'null'
        existence_to:
          oneOf:
          - $ref: '#/components/schemas/Year'
            description: The year it ceased to exist, where that is recorded; absent otherwise.
          - type: 'null'
        id:
          type: string
        lat:
          type: number
          format: double
          description: Latitude in degrees, north positive.
        lon:
          type: number
          format: double
          description: Longitude in degrees, east positive.
        merged_ids:
          type: array
          items:
            type: string
          description: |-
            The ids of other records for this same place, folded into this one. Omitted
            when there are none.
        name:
          type: string
          description: The place's default name.
      additionalProperties: false
    SourceCategory:
      type: object
      description: One heading the sources are grouped under.
      required:
      - id
      - label
      properties:
        id:
          type: string
          description: The key a source's `category` points at.
        label:
          type: string
      additionalProperties: false
    SourceEntry:
      type: object
      description: |-
        One source this atlas is built from: what it is, what was built from it, and
        how it is licensed.
      required:
      - id
      - category
      - title
      - what_it_is
      - what_we_built
      - license
      - licenses_row_key
      properties:
        category:
          type: string
          description: The id of the heading this source is grouped under.
        id:
          type: string
        license:
          type: string
          description: The licence it is used under, quoted rather than paraphrased.
        licenses_row_key:
          type: string
          description: |-
            A key that ties this entry to its row in the project's licence file, so the
            two cannot drift apart. Not meant to be displayed.
        link:
          type:
          - string
          - 'null'
          description: Where to find the source, absent when it has no public home.
        title:
          type: string
          description: The source's own name.
        what_it_is:
          type: string
          description: What the source is, in a sentence or two.
        what_we_built:
          type: string
          description: What this atlas built from it.
      additionalProperties: false
    SourcesDocument:
      type: object
      description: |-
        Everything this atlas is built from: the sources, the headings they are
        grouped under, and the ids that tie individual records back to a source.
      required:
      - categories
      - sources
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/SourceCategory'
        provenances:
          type: array
          items:
            $ref: '#/components/schemas/ProvenanceEntry'
          description: |-
            The join from the provenance id a record carries to the source that asserts
            it.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceEntry'
      additionalProperties: false
    Testament:
      type: string
      description: 'Which half of the canon a book belongs to: the Old Testament, or the New.'
      enum:
      - OT
      - NT
    TextPoint:
      type: object
      description: 'A place in a corpus''s text: a unit, and where one word of it is named, that word''s position in the unit''s base text counting from zero; without a word the point is the unit''s own edge, so a span it bounds takes the unit whole.'
      required:
      - unit
      properties:
        unit:
          $ref: '#/components/schemas/TextRef'
        word:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
      additionalProperties: false
    TextRef:
      type: object
      description: One unit of a corpus's text, named by the corpus it belongs to.
      required:
      - corpus
      properties:
        corpus:
          type: string
          enum:
          - bible
          - concord
      additionalProperties: true
      discriminator:
        mapping:
          bible: '#/components/schemas/BibleRef'
          concord: '#/components/schemas/ConcordRef'
        propertyName: corpus
    TextScope:
      type: string
      description: |-
        How much text one window of `/api/text` covers: the units around the
        reference asked for, or the whole chapter that reference names.
      enum:
      - verse
      - chapter
    TextSpan:
      type: object
      description: A stretch of text, from one point through another, both included.
      required:
      - from
      - to
      properties:
        from:
          $ref: '#/components/schemas/TextPoint'
        to:
          $ref: '#/components/schemas/TextPoint'
      additionalProperties: false
    TextUnit:
      type: object
      description: |-
        One unit of a reading spine: a verse of Scripture, or a paragraph of the
        Book of Concord.
      required:
      - ref
      - locus
      - text
      - words_of_christ
      - anchors
      - edge_summary
      properties:
        anchors:
          type: array
          items:
            $ref: '#/components/schemas/Anchor'
        edge_summary:
          type: array
          items:
            $ref: '#/components/schemas/EdgeSummaryEntry'
          description: |-
            How many neighbours this unit has of each kind, so a page can tell which
            units lead somewhere without asking after each one.
        heading:
          oneOf:
          - $ref: '#/components/schemas/UnitHeading'
          - type: 'null'
        locus:
          $ref: '#/components/schemas/TextRef'
        ref:
          type: string
        text:
          type: string
        words_of_christ:
          type: array
          items:
            $ref: '#/components/schemas/WordsOfChristSpan'
          description: |-
            The spans of `text` that are the words of Christ, in order. Always empty
            outside Scripture.
      additionalProperties: false
    TextWindow:
      type: object
      description: A window of one corpus's reading spine.
      required:
      - units
      - version
      properties:
        next:
          type:
          - string
          - 'null'
          description: |-
            The reference one step further on in the direction travelled; absent at the
            end of the corpus.
        units:
          type: array
          items:
            $ref: '#/components/schemas/TextUnit'
        version:
          type: string
          description: A stamp identifying the data set this window was read from.
      additionalProperties: false
    TimeRange:
      type: object
      description: 'A span of years, both ends included, with the label a reader sees for it: an era both ends share is named once, as in `1450 – 1400 BC`, `5 BC – AD 30` or, for a single year, `AD 33`.'
      required:
      - from
      - to
      - label
      properties:
        from:
          $ref: '#/components/schemas/Year'
        label:
          type: string
        to:
          $ref: '#/components/schemas/Year'
      additionalProperties: false
    TimelinePosition:
      type: object
      description: |-
        Where an event sits in the atlas's whole chronology, whatever narratives it
        belongs to.
      properties:
        following:
          oneOf:
          - $ref: '#/components/schemas/NarrativeAdjacentEvent'
          - type: 'null'
        prior:
          oneOf:
          - $ref: '#/components/schemas/NarrativeAdjacentEvent'
          - type: 'null'
      additionalProperties: false
    UnitHeading:
      type: object
      description: 'The pericope heading above a verse: the event or titled passage that covers it, whose label is the heading''s words; `is_continuation` is true where this verse carries on coverage that began in an earlier chapter rather than opening it, so a reader can render it as a continued heading.'
      required:
      - event
      - kind
      - is_continuation
      properties:
        event:
          $ref: '#/components/schemas/NodeRef'
        is_continuation:
          type: boolean
        kind:
          $ref: '#/components/schemas/EventKind'
      additionalProperties: false
    Verse:
      type: object
      description: 'One verse: its text, and what the graph attests at it.'
      required:
      - verse
      - text
      - places
      - persons
      - xref_count
      - words_of_christ
      properties:
        heading:
          oneOf:
          - $ref: '#/components/schemas/Heading'
            description: |-
              The heading that belongs above this verse, present only where the verse opens
              one.
          - type: 'null'
        persons:
          type: array
          items:
            $ref: '#/components/schemas/PersonRef'
          description: The people this verse names. Empty for most verses.
        places:
          type: array
          items:
            $ref: '#/components/schemas/PlaceRef'
          description: The places this verse names, in a stable order. Empty for most verses.
        text:
          type: string
        verse:
          type: integer
          format: int32
          minimum: 0
        words_of_christ:
          type: array
          items:
            $ref: '#/components/schemas/WordsOfChristSpan'
          description: |-
            The spans of `text` that are the words of Christ, in order. Empty for most
            verses.
        xref_count:
          type: integer
          description: How many cross references start at this verse; 0 for most of them.
          minimum: 0
      additionalProperties: false
    VerseDetail:
      type: object
      description: One verse in full, with everything the graph attaches to it.
      required:
      - ref
      - text
      - words_of_christ
      - book_meta
      - events
      - cross_refs
      - catechism
      - provenance
      - cross_refs_provenance
      - catechism_provenance
      properties:
        book_meta:
          $ref: '#/components/schemas/BookMeta'
          description: Who wrote this verse's book, where and when.
        catechism:
          type: array
          items:
            $ref: '#/components/schemas/CatechismRef'
          description: The catechism items citing this verse. Empty for most verses.
        catechism_provenance:
          type: array
          items:
            type: string
          description: The sources behind the catechism citations above.
        cross_refs:
          type: array
          items:
            $ref: '#/components/schemas/CrossRef'
          description: This verse's cross references, most strongly attested first.
        cross_refs_provenance:
          type: array
          items:
            type: string
          description: |-
            The sources behind the cross references above. Always present, and empty when
            there are none.
        events:
          type: array
          items:
            $ref: '#/components/schemas/VerseEvent'
          description: The events and titled passages this verse belongs to, oldest first.
        provenance:
          type: string
          description: The id of the source this verse's text comes from; `/api/sources` names it.
        ref:
          type: string
        text:
          type: string
        words_of_christ:
          type: array
          items:
            $ref: '#/components/schemas/WordsOfChristSpan'
          description: |-
            The spans of `text` that are the words of Christ, in order. Empty for most
            verses.
      additionalProperties: false
    VerseEvent:
      type: object
      description: One event or titled passage a verse belongs to.
      required:
      - id
      - label
      - verse_groups
      - places
      - kind
      - provenance
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/EventKind'
        label:
          type: string
        places:
          type: array
          items:
            type: string
          description: The ids of the places it touches.
        provenance:
          type: string
          description: |-
            The id of the source that asserts the event this verse belongs to;
            `/api/sources` names it.
        verse_groups:
          type: array
          items:
            $ref: '#/components/schemas/VerseGroup'
          description: The passages it is narrated in, grouped by book and chapter.
        when:
          oneOf:
          - $ref: '#/components/schemas/YearSpan'
            description: The years the event spans; absent for a titled passage that has no date.
          - type: 'null'
      additionalProperties: false
    VerseGroup:
      type: object
      description: A run of verses from one chapter of one book.
      required:
      - book
      - chapter
      - verses
      - count
      properties:
        book:
          type: string
          description: The book's three-letter code, such as `GEN`.
        chapter:
          type: integer
          format: int32
          minimum: 0
        count:
          type: integer
          format: int32
          description: How many verses the group covers in all.
          minimum: 0
        verses:
          type: array
          items:
            type: string
          description: The verse numbers and ranges covered, such as `3` or `3-5`.
      additionalProperties: false
    WindowDir:
      type: string
      description: |-
        Which way a window runs from the reference it is anchored on: onward from that
        reference, or backward to it.
      enum:
      - onward
      - backward
    WordsOfChristSpan:
      type: object
      description: |-
        One span of the words of Christ within a verse's text: character offsets into
        it, half-open, so the span is the text from `start` up to but not including
        `end`.
      required:
      - start
      - end
      properties:
        end:
          type: integer
          minimum: 0
        start:
          type: integer
          minimum: 0
      additionalProperties: false
    Year:
      type: object
      description: A year, negative for BC, with the label a reader sees for it, such as `1447 BC` or `AD 30`.
      required:
      - value
      - label
      properties:
        label:
          type: string
        value:
          type: integer
          format: int32
      additionalProperties: false
    YearSpan:
      type: object
      description: |-
        A span of years on this atlas's scale: negative for BC, positive for AD, with
        no year zero. A single year is a span whose ends are equal.
      required:
      - from_year
      - to_year
      properties:
        from_year:
          type: integer
          format: int32
        to_year:
          type: integer
          format: int32
      additionalProperties: false
tags:
- name: meta
  description: 'What this server is: whether it is up, the schema versions of the data it answers from, this document itself, and the sources every answer is drawn from.'
- name: map
  description: 'The map: what is in view for a span of years or at a passage, the polity borders and eras behind it, and the coastline and landmarks it is drawn over.'
- name: reading
  description: 'Scripture as it is read: a chapter verse by verse, one verse in full, and the cross references a verse carries.'
- name: catechism
  description: 'The catechism: one item in full, and the items that cite a passage.'
- name: places
  description: 'One place: where it is, what happened there, and the name and history it bore in the period asked about.'
- name: events
  description: 'What happened: one event in full, every narrative this atlas tells, and the narrative legs an event belongs to.'
- name: graph
  description: 'This atlas as a graph: one node''s record, nodes and edges by id many at once, one page of the neighbours of a node or an edge, and a window of a corpus''s reading spine.'
- name: contents
  description: One corpus's table of contents, two levels deep.
