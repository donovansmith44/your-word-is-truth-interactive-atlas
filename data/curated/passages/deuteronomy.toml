[[event]]
id = "deu_death_of_moses"
label = "The death of Moses"
from_year = -1451
to_year = -1451
places = ["mount-nebo"]
verses = ["DEU.34.1-12"]
atlas_section = "Deuteronomy pericope (this project's own sectioning, CC0 -- no external PD source claimed): Deuteronomy 34, Moses's own view of the promised land from Nebo, his death, burial, and epitaph, closing the Torah. Authored fresh, deliberately NOT an atlas-sections.toml enrichment of the pre-existing theo-129 (same title/content) -- see that file's own header note on the genuine pre-existing data anomaly (a stray GEN.34.1 verse) this batch's own real ETL run caught as a within-layer anchor collision against gen_dinah_shechem."
ref_note = "Matches theo-129's own -1452 (this batch's own -1451 for 'the fortieth year,' one year prior to Israel's own crossing of the Jordan -1451->-1450 in the traditional reckoning this batch's own Numbers/Deuteronomy containers use -- a one-year rounding difference from theo-129's pre-existing -1452, immaterial at this atlas's year-granular resolution). Place: 'the mountain of Nebo, to the top of Pisgah' (34:1), matching theo-129's own place mapping (mount-nebo)."
