# Batch M requirement 1: this era's own FALL -- the fall of Nineveh (612
# BC) to the combined Medes/Neo-Babylonians. Not narrated as a discrete
# scene in the OT historical books, but the SUBJECT of the entire book of
# Nahum, whose closing verses address "the king of Assyria" directly in
# the past-collapse tense. Verses read directly against the compiled KJV
# text before citing -- note this app's own canonical code is NAM (not the
# more common OSIS "NAH"), confirmed against data/compiled/canon.json
# before citing.
[era.fall]
event = "The Medes and Neo-Babylonians destroy Nineveh"
verses = ["NAM.3.18", "NAM.3.19"]
ref_note = "Nahum 3:18-19 (KJV, verified against the compiled text) -- the whole book of Nahum is a prophecy of Nineveh's own destruction, traditionally dated 612 BC; these closing verses address the king of Assyria's own ruin directly"
