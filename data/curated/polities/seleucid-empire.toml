# Batch M requirement 1: this era's own RISE -- Parthia's own eastern
# conquests (Mithridates I taking Media/Mesopotamia from the mid-2nd
# century BC) and Tigranes of Armenia's own inroads that shrink the empire
# down to Antioch and a handful of Syrian cities. Hellenistic-era secular
# history, not Scripture (Parthia itself is later named in Acts 2:9, but
# that is about Pentecost, centuries after and unrelated to these SPECIFIC
# 2nd-century-BC conquests). Honestly disclosed as general history rather
# than an invented citation. FIX ROUND (self-caught live): originally
# mis-attached to the PRECEDING era ("Seleucid Empire") by TOML's own
# array-of-tables rule -- moved here, to the era it actually describes the
# start of -- see assyria.toml's own identical fix for the full story.
[era.transition]
event = "Parthian and Armenian conquests reduce the Seleucid realm to a rump state"
verses = []
ref_note = "general Hellenistic-era historical knowledge (Parthia's own mid-2nd-century BC eastward conquests under Mithridates I; Tigranes of Armenia's own later inroads); no specific source consulted this session; not scripture-narrated"

# Batch M requirement 1: this era's own FALL -- Pompey's annexation of
# Syria as a Roman province (64/63 BC, this era's own to=-64 year), ending
# the dynasty. Roman/Hellenistic secular history -- 1 Maccabees, which
# would narrate the Seleucid decline in most detail, is outside the KJV's
# 66-book canon. Honestly disclosed as general history rather than an
# invented citation.
[era.fall]
event = "Pompey annexes Syria as a Roman province, ending Seleucid rule"
verses = []
ref_note = "general Roman/Hellenistic historical knowledge (Pompey's own 64/63 BC settlement of the East); no specific source consulted this session; 1 Maccabees, the fullest narrative source for the Seleucid decline, is outside the KJV's 66-book canon"
