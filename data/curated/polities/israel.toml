# The United Monarchy (Saul, David, Solomon): "from Dan to Beersheba" --
# the full Israelite heartland west of the Jordan, plus Gilead/Ammon/Moab
# across the Jordan as David's own tributary holdings. Fix round 1 (M3):
# fetched en.wikisource.org/wiki/1911_Encyclopaedia_Britannica/Palestine and
# .../Jews 2026-08-20 to ground this era. Palestine confirms "Dan to
# Beersheba" numerically -- the Hebrews' own "indication of the normal
# north-and-south limits of their land" -- glossing Dan's own latitude near
# the Litani's mouth (33 deg 20' N); this ring's own northern tip (33.25)
# already sits almost exactly there -- shape confirmed, not moved. Jews
# separately notes Solomon's own WIDER political hegemony "extended from
# the Euphrates to the border of Egypt" (echoing 1 Kings 4:21's tributary
# reach) -- deliberately NOT what this ring draws: the ring stays the core
# settled kingdom plus its own Transjordan tributary belt, not Solomon's
# much larger and more historically-disputed maximal-hegemony claim.
