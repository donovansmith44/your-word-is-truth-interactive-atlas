antitype_passage = { from = "HEB.11.17", to = "HEB.11.19" }
note = "the offering of Isaac"
text = "By faith Abraham, when he was tried, offered up Isaac: and he that had received the promises offered up his only begotten son... accounting that God was able to raise him up, even from the dead; from whence also he received him in a figure."

[[typology]]
type_passage = { from = "EXO.25.40" }
antitype_passage = { from = "HEB.8.5" }
note = "the tabernacle pattern"
text = "Who serve unto the example and shadow of heavenly things, as Moses was admonished of God when he was about to make the tabernacle: for, See, saith he, that thou make all things according to the pattern shewed to thee in the mount."

[[typology]]
