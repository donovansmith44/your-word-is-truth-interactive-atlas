kind = "general"
verses = ["ROM.12.9-21"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 12:9-21, a chain of exhortations on genuine love -- rejoicing with those who rejoice, blessing persecutors, and 'overcome evil with good.'"

[[event]]
id = "rom_subjection_to_the_higher_powers"
label = "Subjection to the higher powers"
kind = "general"
verses = ["ROM.13.1-7"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 13:1-7, submission to civil authority as 'ordained of God,' and the payment of tribute, custom, fear, and honour that is due."

[[event]]
id = "rom_love_the_fulfilling_of_the_law"
label = "Love, the fulfilling of the law; putting on the Lord Jesus Christ"
kind = "general"
verses = ["ROM.13.8-14"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 13:8-14, love as the summary of the commandments, and the eschatological exhortation to 'cast off the works of darkness' since 'the night is far spent.'"

[[event]]
id = "rom_the_weak_and_the_strong"
label = "The weak and the strong: not judging one another in doubtful things"
kind = "general"
verses = ["ROM.14.1-23"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 14, one sustained argument on conscience in matters of food and days -- 'let every man be fully persuaded in his own mind' -- kept as a single chapter-length unit per the text's own continuous discourse."

[[event]]
id = "rom_bearing_the_infirmities_of_the_weak"
