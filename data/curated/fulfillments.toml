# EDGE-1a ("Prophecy & typology: the seed data" -- batch-edge1a-brief.md):
# owner order (2026-08-23, verbatim): "we also need a couple more edges:
# one for Christological types, and one for prophecy/fulfillment." This
# file is the fulfillment half (decision 1a): explicit-formula rows only --
# the NT ITSELF states fulfillment with a formula ("that it might be
# fulfilled which was spoken by the prophet...", "this day is this
# scripture fulfilled", "then was fulfilled", or the twin identity-formula
# "he that was spoken of by the prophet... saying"). Every row below was
# hand-verified against the real committed KJV text (data/raw/kjv.json) at
# authoring time -- both the fulfillment passage's own formula wording AND
# the prophecy passage's own wording -- never assumed from memory. KJV
# INERRANCY DIRECTIVE: fulfillment is stated as FACT throughout ("fulfilled
# in", never "Matthew applies...").
#
# ONE array-of-tables (parsed by `atlas_etl::curated::parse_fulfillments`;
# loaded by `atlas_etl::compile::compile`):
#
# [[fulfillment]]
#   prophecy      { from, to? } -- the OT passage (canonical dot-form verse
#                  refs, `to` optional, defaulting to `from`), the
#                  TIGHTEST range the fulfillment passage's own quoted
#                  words span.
#   fulfillment    { from, to? } -- the NT passage: the verse(s) carrying
#                  the fulfillment formula itself, extended to include the
#                  quoted words when the quote continues past the formula
#                  verse. This passage SELF-ATTESTS as the row's own
#                  Ground::Scripture (`atlas_graph::fulfillment_adapter`'s
#                  own job) -- the same "the NT fulfillment formulas... make
#                  the fulfillment passage itself the natural Ground"
#                  `atlas_graph_types::edge::Fulfills`'s own doc comment
#                  states.
#   text           the KJV formula quote itself (required -- every row this
#                  batch ships carries one; register is FACT, never hedged).
#
# MULTI-SOURCE SPLITS, disclosed: several NT passages the brief's own
# illustrative list names as ONE locus actually invoke TWO distinct OT
# sources in immediate sequence (JHN 12:38 then 12:39-40; JHN 19:36 then
# 19:37; ACT 1:16's own formula resolved by its own quote at 1:20, itself
# citing two different psalms). `Fulfills` is a strict one-prophecy-to-
# one-fulfillment text-to-text edge (graph-types is EXTEND-ONLY this
# batch), so each such case became TWO (or more) rows rather than one row
# straining to hold two OT sources, or a dropped half. The batch report has
# the full pair-by-pair reasoning for every judgment call (JHN 12:39-40's
# own "said again" vs. literal "fulfilled"; JHN 19:28-29's narrated-action
# anchor; PSA.69.4 vs. PSA.35.19 for JHN 15:25; ACT 1:16-20's own
# formula-then-quote span).
#
# HAND-VERIFIED SKIPS (brief: "verify... not this list; SKIP... report
# skips with reasons" -- typology's own instruction, applied here on the
# same Sin-guard principle): MAT 2:23 ("spoken by the prophetS", plural, no
# single quotable verse -- a genuinely contested referent, never a NT
# quotation of one OT text); MAT 5:18/24:34/26:54/26:56 (generic
# "the scripture(s)"/"all things", no specific OT citation at all); JHN
# 17:12 (the formula appears with NO OT text quoted anywhere in reach --
# unlike every other row here, there are no "quoted words" to anchor a
# prophecy locus to); LUK 24:44 (the referent is "the law of Moses, and...
# the prophets, and... the psalms" -- the WHOLE OT canon, not a locatable
# passage; not representable as a single BibleLocusRange without either
# spanning the entire canon or picking an arbitrary illustrative subset the
# text itself does not specify).

[[fulfillment]]
prophecy = { from = "ISA.7.14" }
fulfillment = { from = "MAT.1.22", to = "MAT.1.23" }
text = "Now all this was done, that it might be fulfilled which was spoken of the Lord by the prophet, saying, Behold, a virgin shall be with child, and shall bring forth a son, and they shall call his name Emmanuel, which being interpreted is, God with us."

[[fulfillment]]
prophecy = { from = "HOS.11.1" }
fulfillment = { from = "MAT.2.15" }
text = "And was there until the death of Herod: that it might be fulfilled which was spoken of the Lord by the prophet, saying, Out of Egypt have I called my son."

[[fulfillment]]
prophecy = { from = "JER.31.15" }
fulfillment = { from = "MAT.2.17", to = "MAT.2.18" }
text = "Then was fulfilled that which was spoken by Jeremy the prophet, saying, In Rama was there a voice heard, lamentation, and weeping, and great mourning, Rachel weeping for her children, and would not be comforted, because they are not."

[[fulfillment]]
prophecy = { from = "ISA.40.3" }
fulfillment = { from = "MAT.3.3" }
text = "For this is he that was spoken of by the prophet Esaias, saying, The voice of one crying in the wilderness, Prepare ye the way of the Lord, make his paths straight."

