  /api/polities:
    get:
      tags:
      - map
      summary: 'The polity borders in view for a span of years: one row per era of a polity whose own years overlap the span.'
      description: |-
        `from` and `to` are years on this atlas's scale -- negative for BC, no year
        zero -- and both are required, with `from` no later than `to`; anything else
        is `bad_window`. Rows come ordered by polity and then oldest era first, so a
        border change paints older beneath newer. A span no era overlaps answers an
        empty list.
      operationId: polities
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: integer
          format: int32
      - name: to
        in: query
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          content:
