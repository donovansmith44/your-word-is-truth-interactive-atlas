# --- David's Flight from Saul ---
# BATCH HOTFIX-6 (graph-wide chronology audit, owner live reports #8/#9,
# 2026-08-22 -- "this is a lie... i'm sure these errors are graph-wide"):
# every from_year/to_year below was RE-DATED. Controller-verified root
# cause: this whole 9-event chain was authored ~48 years LATE relative to
# this atlas's own declared Ussher scale -- a wrong-anchor calibration
# error at original authoring time, the same defect class NT calibration
# (nt_calibration.rs) already fixed for the Theographic import. Re-dated
# onto data/curated/chronology-anchors.toml: df_ramah (persecution begins)
# through df_ziklag are a UNIFORM -48-year shift of each event's own
# pre-fix year (verified exact: -1014-48=-1062 .. -1010-48=-1058, matching
# the brief's own "Ziklag ~-1058" anchor value exactly) -- the chain's own
# RELATIVE spacing (already correct; not touched) simply lands on the
# correct absolute years once the whole chain's own wrong anchor is
# corrected. df_hebron is the one exception: pre-fix it read the SAME year
# as df_ziklag (-1010, both), a second, compounding error (conflating
# "given Ziklag" with "anointed at Hebron," years apart in the real
# narrative -- 1 Samuel 27:7's own "a full year and four months," then
# Saul's death, 1 Samuel 31, THEN Hebron, 2 Samuel 2) -- corrected directly
# against the anchor table's own explicit "david-hebron" = -1055 row
# (Ussher), not by the uniform shift, which would have left it wrongly
# co-dated with Ziklag again. See batch-hotfix6-report.md for the full
# audit table.
# places: brief guessed "ramah", but geo ancient.jsonl collides into 9
# entries (a common town name). ramah-1/4/7/9 share coords (31.8543,
# 35.2316, Ramah of Benjamin, Samuel's home town); of these, only
# ramah-4's verse_links carry the 1 Samuel narrative including 1SA.19.18/
