name = "Kingdom of Israel (United Monarchy)"
from = -1050
to = -931
ref_note = "fetched en.wikisource.org/wiki/1911_Encyclopaedia_Britannica/Palestine and .../Jews 2026-08-20 (fix round 1, M3): Palestine confirms 'Dan to Beersheba' numerically (Dan near the Litani's mouth, 33 deg 20' N) -- this ring's own northern tip (33.25) already matches, confirmed unchanged; Jews notes Solomon's wider hegemony reaching the Euphrates, deliberately NOT drawn here (this ring is the core settled kingdom, not that much larger, disputed maximal claim)"
rings = [
  [
    [32.83, 34.95], [32.95, 35.0], [33.05, 35.1], [33.15, 35.3], [33.25, 35.5], [33.25, 35.65], [33.15, 35.8],
