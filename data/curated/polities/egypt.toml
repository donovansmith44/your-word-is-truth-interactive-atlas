# New Kingdom (the Egyptian Empire): the Exodus-era Egypt of Thutmose III /
# Ramesses II, reaching south into Nubia past the Fourth Cataract and north
# along the Canaan/Phoenician coast -- the era the "1600 BC - 900 BC"
# spanning-window screenshot is built to show shrinking back down to the
# next era's Nile-only footprint. Fix round 1 (M3): fetched
# en.wikisource.org/wiki/1911_Encyclopaedia_Britannica/Egypt/3_History
# 2026-08-20 -- its own account of "Tethmosis" (Thutmose III) states the
# Nubian province of Cush he set up "extended from Napata just below the
# Fourth Cataract on the south to El Kab in the north"; the ring's southern
# tip was extended from ~20.0N to ~18.6N (near Napata) to actually reach
# that attested frontier, a real adjustment, not merely a confirmation. The
# same article also names Thutmose III's own campaign reaching Carchemish/
# across the Euphrates -- a single high-water-mark raid, not the empire's
# sustained vassal frontier, so the drawn northern/eastern edge stays at
