  /api/node/{id}/edges:
    get:
      tags:
      - graph
      summary: One page of the neighbours of a node or of an edge, of a single kind, each with the edge that joins them.
      description: '`{id}` takes the same form `/api/node/{id}` does, or an edge''s id as an edge page carries it. The required `kind` is an edge label such as `cites` or `cited-by`; anything else is `bad_kind`, an unrecognised id is `bad_ref`, and an id naming nothing is `not_found`. `limit` defaults to 20 and caps at 200; pass the response''s `next` back as `cursor` for the following page, and its absence is the last page. A `limit` or `cursor` that does not read as a whole number is not refused: it leaves its default standing.'
      operationId: node_edges
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: kind
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/EdgeKind'
      - name: cursor
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgePage'
        '400':
          description: The reference, window or query could not be read; the body's `code` says which (`bad_ref`, `bad_kind`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Nothing in this atlas answers to that reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: The request was well formed but this atlas's own data for it is incomplete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/openapi.yaml:
    get:
      tags:
      - meta
      summary: This API's own OpenAPI document, as YAML.
      description: |-
        A consumer reads the contract off the running server rather than out of the
        repository the server was built from.
      operationId: openapi_yaml
      responses:
        '200':
          content:
            application/yaml:
              schema:
                type: string
  /api/place/{id}:
    get:
      tags:
      - places
      summary: 'One place: where it is, the events that happened there oldest first, and its curated history where it has one.'
      description: |-
        `{id}` is a place id handed back by another response; an id naming no place
        is `not_found`. The optional `from` and `to` years choose the period whose
        name and description the history reports -- give both or neither, and giving
        neither simply leaves the place's default name in place. One year alone, a year
        that is not a year, and a span that ends before it starts are each `bad_window`.
      operationId: place
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: to
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacePage'
        '400':
          description: The reference, window or query could not be read; the body's `code` is `bad_window`.
          content:
            application/json:
              schema:
