# Batch F2, requirement 3: the file -> catechism-item mapping table for the
# ingested brain-fuel/catechism repo (https://github.com/brain-fuel/catechism,
# pinned at commit 0be24fee92e6333f817c4c2a08f99cf7c5274295 -- see
# data/fetch-raw.ps1 and LICENSES.md for the full fetch/provenance record).
# Hand-checkable, by design: one [[file]] row per INGESTED resources/*.yaml
# file, naming the catechism item (data/curated/catechism.toml, [[part.item]]
# id) its own numbered questions attach to.
#
# 37 of the repo's ~45 files are ingested here. 7 were DELIBERATELY DEFERRED
# (fetched -- data/raw/ carries all of them -- but not modeled as questions
# this batch, same disclosed-not-forgotten treatment Batch F already gave
# the Preface/Daily-Prayers/Table-of-Duties appendices).
#
# PARTS-1 (2026-08-30) CLOSED that deferral: every one of the seven is now
# ingested by `catechism-part-mapping.toml`, which attaches them to chief
# PARTS rather than to items -- parts are graph nodes now
# (`NodePayload::CatechismPart`), so the "no existing item to attach to"
# reason each row gives below no longer holds. The list stays here, with
# its original reasons intact, because it records WHY they waited:
#   - resources/01-What-Is-Christianity.yaml       (no existing item to attach to)
#   - resources/02.0-The-Ten-Commandments.yaml      (part-overview content, not one commandment)
#   - resources/03.0-The-Apostles'-Creed.yaml       (part-overview content, not one article)
#   - resources/04.0-The-Lord's-Prayer.yaml         (part-overview content, not one petition)
#   - resources/05.0-The-Means-of-Grace.yaml        (no existing item -- Means of Grace isn't a
#                                                     Batch F chief part on its own)
#   - resources/06-Daily-Prayers.yaml               (appendix, already deferred by Batch F)
#   - resources/07-The-Table-of-Duties.yaml         (appendix, already deferred by Batch F)
# The svebilius/ directory (the Svebilius Catechism explanation text, en/fin)
# is likewise out of scope this batch per the brief -- noted here again for
# completeness, ingested nothing.
#
# Two files need a curator judgment call, both disclosed here AND in
# batch-f2-report.md:
#   - resources/02.9-10-The-Ninth-and-Tenth-Commandments.yaml covers BOTH
#     commandments in one undifferentiated set of questions (no per-question
#     split signal in the source itself -- confirmed by reading every
#     question title, none of which names "house" vs. "wife/servants/cattle"
#     specifically). Attached here to commandment-9 only, so the two
#     commandments don't show byte-identical repo content twice; commandment-10
#     is still reachable via its own Deuteronomy 5 parallel supplement
#     (data/curated/catechism-deut5.toml, requirement 5b).
#   - resources/05.2.1-Confession-and-Absolution.yaml DOES have a clear
#     thematic split (personal confession/examination vs. the absolution
#     pronouncement and the Office of the Keys) -- overridden per-question
#     below rather than dumped on one item, so confession-2 (previously
#     unreachable from any verse) becomes reachable too.

