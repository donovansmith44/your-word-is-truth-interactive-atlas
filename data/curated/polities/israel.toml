# Batch M requirement 1: this era's own RISE -- the kingdom divides under
# Rehoboam/Jeroboam (1 Kings 12); Israel rejects the house of David and
# crowns Jeroboam. Verses read directly against the compiled KJV text
# before citing. See judah.toml's own "Kingdom of Judah" era for the SAME
# moment from the southern kingdom's own side.
