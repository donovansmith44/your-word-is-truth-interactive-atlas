# --- Babylon -------------------------------------------------------------
# No name entry: "Babel" (Hebrew) and "Babylon" (Greek-derived) are the
# same underlying name rendered through different KJV source languages, not
# a historical rename -- Daniel and Jeremiah (written centuries after
# Genesis, during and after the exile) still call it "Babylon", so curating
# a Babel->Babylon swap would misrepresent a translation convention as a
# renaming event. No established/destroyed either: Genesis gives no year
# for Babel's founding, and Babylon's 539 BC fall to Cyrus was a change of
# ruler, not a destruction -- the city continues to appear in later events
# (e.g. ret_babylon, -538) after that date.
[[place]]
id = "babylon-1"

  [[place.blurb]]
  text = "Nimrod's kingdom began at Babel, where the builders of a great tower were scattered when God confused their language."
  from = -4004
  to = -2167
  breadth = "era"

  [[place.blurb]]
  text = "Jerusalem's exiles wept by Babylon's rivers, remembering the city they had lost, until the kingdom itself fell to the Medes and Persians."
  from = -586
  to = -539
  breadth = "era"

  [[place.blurb]]
  text = "Cyrus of Persia decreed that the exiles could return home and rebuild the LORD's house in Jerusalem."
  from = -538
  to = -536
  breadth = "era"
