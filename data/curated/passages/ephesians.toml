# Batch W5 (whole-Bible titled verse containers, fifth run). Ephesians.
# KIND POLICY (applies across this whole W5 slice, stated here once, per
# the master brief's own requirement 2, "KIND DISCIPLINE"): every
# container in this file is GENERAL-kind (undated, placeless) -- a
# letter's own teaching content is not a datable occurrence, and Theographic's
# own dated "X writes Y" EVENT nodes (where any exist) are a DIFFERENT
# identity from these content containers -- never merged into them, never
# given a fabricated dated twin. See batch-w5-report.md for the full
# reconciliation sweep against the real compiled events.json.
#
# GRANULARITY: Ephesians' own two-part shape -- doctrine (1-3, God's own
# eternal purpose in Christ and the church) then duty (4-6, the walk that
# purpose produces) -- subdivided at real paragraph seams; the letter's own
# two prayer-doxologies (1:15-23, 3:14-21) are each kept as their own unit.

[[event]]
id = "eph_salutation"
label = "Salutation to the saints at Ephesus, and the faithful in Christ Jesus"
kind = "general"
verses = ["EPH.1.1-2"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Ephesians 1:1-2, Paul's own opening greeting to the saints at Ephesus."

[[event]]
id = "eph_blessed_with_every_spiritual_blessing"
label = "Blessed with every spiritual blessing: chosen, adopted, redeemed, sealed"
kind = "general"
verses = ["EPH.1.3-14"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Ephesians 1:3-14, the letter's own opening doxology -- chosen before the foundation of the world, adopted as sons, redeemed through Christ's own blood, and 'sealed with that holy Spirit of promise.'"

[[event]]
id = "eph_pauls_prayer_the_eyes_of_understanding"
label = "Paul's own prayer: the eyes of understanding enlightened; Christ head over all things to the church"
kind = "general"
verses = ["EPH.1.15-23"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Ephesians 1:15-23, Paul's own prayer that the Ephesians' own 'eyes of your understanding' be enlightened, closing on Christ 'head over all things to the church, which is his body.'"

[[event]]
id = "eph_quickened_together_with_christ"
