note = "FIX ROUND 2, CRITICAL FINDING C-1 (independent review, 2026-08-22): this row previously read -444, citing 'Ussher's Annals of the World' -- but -444 is a MODERN reckoning (Artaxerxes' 20th year from the conventional 465/464 BC accession), not Ussher's own actual figure, and the controller's own brief (whose requirement-1 example list originally seeded '-444') has disclosed that seed as its own error, ledgered against the brief, not this batch. TWO independent, doctrine-clean derivations both land on -454: (a) PRIMARY SOURCE -- Ussher's Annals, paragraph 1227 (marginal date '3550c AM, 4260 JP, 454 BC'): 'In the same 20th year of the king, in the month Nisan, Nehemiah's turn came to serve as cupbearer... and obtained permission from the king to be the governor of Judah and to rebuild Jerusalem. Neh 2:1-6.' Paragraph 1234 (same '454 BC' marker block): 'the wall was finished in 52 days, on the 25th day of the 6th month called Elul' (Neh 6:15, this anchor's own second citation). Confirmed word-for-word identical against TWO independently uploaded archive.org scans (archive.org/details/james-usher-annals-of-the-world and archive.org/details/AnnalsOfTheWorld, both retrieved 2026-08-22), the same two-independent-copies standard LICENSES.md already applies to Robertson/Crockett -- see 'Ussher's Annals of the World' there. (b) INTERNAL ARITHMETIC on this atlas's own declared scale: ezra-returns (above) = -467, Artaxerxes' 7th year (Ezra 7:7-8); Nehemiah's own commission is explicitly the SAME king's 20th year (Neh 2:1), 13 years later (uncontested across chronological schools) -- (-467) - 13 = -454. Both paths agree exactly; shipped with both cited, per the controller's own tie-break rule. The bound event (ret_jerusalem_wall) and its own dependents (ret_susa and the neh_* cluster in data/curated/passages/nehemiah.toml) were HAND-RE-DATED this round (not deferred) -- this is a citation-accuracy correction to a value that was never genuinely Ussher's own in the first pl