# judah.toml -- Judah; shapes are approximate, drawn for recognizability.
# One polity id spanning the southern kingdom's whole biblical arc: a
# kingdom, then a tiny Persian-period province, then (after growing again
# under the Hasmoneans and Herod) an expanded client kingdom -- the id
# stays "judah" throughout so the plate keeps one hue across every rename.
id = "judah"

# The (southern) Kingdom of Judah after the division: the hill country
# around Jerusalem and Hebron, down to Beersheba and the Negev fringe --
# smaller than Israel to its north (see israel.toml). Ends with
# Nebuchadnezzar's destruction of Jerusalem (586 BC); no separate Judah
# polity exists during the Exile itself (see babylon.toml's own
# "Neo-Babylonian Empire" era for what actually governs this land then).
# Fix round 1 (M3): fetched
# en.wikisource.org/wiki/1911_Encyclopaedia_Britannica/Judah 2026-08-20 --
# confirms Judah's own three physical divisions (central hill-country from
# Hebron north through Jerusalem, the western lowland/Shephelah, and the
# southern steppes/Negeb) matching this ring's shape; it also notes the
# frontier with Israel to the north was itself "a very ambiguous frontier"
# even in ancient sources (per the companion Palestine article), so this
# ring's own dividing line against israel.toml is not claimed to be any
# more precise than the sources themselves are.
