antitype_passage = { from = "HEB.9.23", to = "HEB.9.24" }
note = "the tabernacle pattern"
text = "It was therefore necessary that the patterns of things in the heavens should be purified with these; but the heavenly things themselves with better sacrifices than these. For Christ is not entered into the holy places made with hands, which are the figures of the true; but into heaven itself."

[[typology]]
