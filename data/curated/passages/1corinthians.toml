# Batch W5 (whole-Bible titled verse containers, fifth run). 1 Corinthians.
# KIND POLICY (applies across this whole W5 slice, stated here once, per
# the master brief's own requirement 2, "KIND DISCIPLINE"): every
# container in this file is GENERAL-kind (undated, placeless) -- a
# letter's own teaching content is not a datable occurrence, and Theographic's
# own dated "X writes Y" EVENT nodes (where any exist) are a DIFFERENT
# identity from these content containers -- never merged into them, never
# given a fabricated dated twin. See batch-w5-report.md for the full
# reconciliation sweep against the real compiled events.json.
#
# GRANULARITY: 1 Corinthians answers a series of discrete pastoral questions
# (divisions, immorality, lawsuits, marriage, idol meat, worship order,
# resurrection) -- its own "now concerning..." markers (7:1, 7:25, 8:1,
# 12:1, 16:1) supply real, text-native topic seams throughout. 10:23-11:1
# is kept as one container spanning the chapter break (11:1's own 'be ye
# followers of me, even as I also am of Christ' closes the ch10 argument on
# doing all to the glory of God, not opening the ch11 head-covering topic
# that begins at 11:2) -- a literary-structure fact, not textual criticism.

[[event]]
id = "1co_salutation"
label = "Salutation to the church of God at Corinth"
kind = "general"
verses = ["1CO.1.1-3"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): 1 Corinthians 1:1-3, Paul's own opening greeting, with Sosthenes, to the church of God at Corinth."

