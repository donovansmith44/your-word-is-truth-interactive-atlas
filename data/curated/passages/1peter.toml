# Batch W5 (whole-Bible titled verse containers, fifth run). 1 Peter.
# KIND POLICY (applies across this whole W5 slice, stated here once, per
# the master brief's own requirement 2, "KIND DISCIPLINE"): every
# container in this file is GENERAL-kind (undated, placeless) -- a
# letter's own teaching content is not a datable occurrence, and Theographic's
# own dated "X writes Y" EVENT nodes (where any exist) are a DIFFERENT
# identity from these content containers -- never merged into them, never
# given a fabricated dated twin. See batch-w5-report.md for the full
# reconciliation sweep against the real compiled events.json.
#
# GRANULARITY: 1 Peter's own real seams -- salutation and the living hope,
# the call to holiness, the church as a holy priesthood, household duties,
# suffering after Christ's own pattern, and closing instructions to elders
# and the flock.

[[event]]
id = "1pe_salutation_and_the_living_hope"
label = "Salutation; a living hope; the salvation the prophets searched for"
kind = "general"
verses = ["1PE.1.1-12"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): 1 Peter 1:1-12, Peter's own greeting to the elect 'strangers scattered' through Asia Minor, blessing God for begetting 'a lively hope by the resurrection of Jesus Christ,' a salvation the prophets 'enquired and searched diligently' after."

