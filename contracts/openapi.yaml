  /api/event/{id}:
    get:
      tags:
      - events
      summary: 'One event in full: its title and date, where it happened, the passages that narrate it, the verses that only mention it, and the events whose accounts resemble it.'
      description: |-
        `{id}` is an event id handed back by another response; an id naming no event
        is `not_found`. A titled passage with no date carries no `when`.
      operationId: event
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '404':
          description: Nothing in this atlas answers to that reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: The request was well formed but this atlas's own data for it is incomplete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/kretzmann/chapter/{cref}:
    get:
      tags:
      - reading
      summary: 'Kretzmann''s commentary for one chapter: the items on each verse that has any, in document order.'
      description: |-
        `{cref}` is `BOOK.CHAPTER`, such as `PSA.119`; a book-only or verse-shaped
        segment is `bad_ref`. A chapter with no commentary answers an empty `verses`
        list. Each item's `id` fetches its prose from `/api/node/{id}`.
      operationId: kretzmann_chapter
      parameters:
      - name: cref
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KretzmannChapter'
        '400':
          description: The reference, window or query could not be read; the body's `code` is `bad_ref`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Nothing in this atlas answers to that reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: The request was well formed but this atlas's own data for it is incomplete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/land-mask:
    get:
      tags:
      - map
      summary: The coastline geometry border washes are clipped against, so no polity's colour spills into open sea.
      operationId: land_mask
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandMask'
  /api/landmarks:
    get:
      tags:
      - map
      summary: The always-on map labels -- waters, mountains and regions -- each with the point it is drawn at.
      operationId: landmarks
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Landmark'
  /api/narrative/event/{id}:
    get:
      tags:
      - events
      summary: 'Where one event sits in time: its neighbours in each narrative it is a leg of, and its neighbours in the whole chronology.'
      description: |-
        `{id}` is an event id handed back by another response; an id naming no event
        is `not_found`. An event that is a leg of no narrative answers an empty
        `narrative` list, and one with no date carries no `timeline` at all.
      operationId: narrative_event_positions
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NarrativeEventPositions'
        '404':
          description: Nothing in this atlas answers to that reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: The request was well formed but this atlas's own data for it is incomplete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/narratives:
    get:
      tags:
      - map
      summary: 'Every narrative in this atlas: its name, the colour its arrows are drawn in, and the ordered events it runs through.'
      operationId: narratives
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Narrative'
  /api/node/{id}:
    get:
      tags:
      - graph
      summary: 'One node of the graph at a glance: what it is, what to call it, where it came from, and how many neighbours it has of each kind.'
      description: |-
        `{id}` is `Kind:identifier` -- `Place:hazor-1`, `Event:ab_ur`,
        `Person:aaron_1` -- or `text-unit:BOOK.CHAPTER.VERSE` for a verse of
        Scripture and `text-unit:BoC PART.ARTICLE.PARAGRAPH` for a paragraph of the
        Book of Concord. An id of no recognised kind is `bad_ref`; one that names no
        node is `not_found`.
      operationId: node_record
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeRecord'
        '400':
          description: The reference, window or query could not be read; the body's `code` is `bad_ref`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Nothing in this atlas answers to that reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: The request was well formed but this atlas's own data for it is incomplete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/node/{id}/edges:
    get:
      tags:
      - graph
      summary: One page of the neighbours of a node or of an edge, of a single kind, each with the edge that joins them.
      description: '`{id}` takes the same form `/api/node/{id}` does, or an edge''s id as an edge page carries it. The required `kind` is an edge label such as `cites` or `cited-by`; anything else is `bad_kind`, an unrecognised id is `bad_ref`, and an id naming nothing is `not_found`. `limit` defaults to 20 and is clamped to the server''s largest page; pass the response''s `next` back as `cursor` for the following page, and its absence is the last page; its `previous` is absent on the first page alone, which has no page before it, and every other page names the `cursor` of the page of the same `limit` before it, the second page naming the first page''s own `cursor`, 0. Leaving `cursor` out reads at 0: both are the first page, one page under two spellings. A `limit` or `cursor` that does not read as a whole number is not refused: it leaves its default standing.'
      operationId: node_edges
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: kind
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/EdgeKind'
      - name: cursor
        in: query
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgePage'
        '400':
          description: The reference, window or query could not be read; the body's `code` says which (`bad_ref`, `bad_kind`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Nothing in this atlas answers to that reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: The request was well formed but this atlas's own data for it is incomplete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/openapi.yaml:
    get:
      tags:
      - meta
      summary: This API's own OpenAPI document, as YAML.
      description: |-
        A consumer reads the contract off the running server rather than out of the
        repository the server was built from.
      operationId: openapi_yaml
      responses:
        '200':
          content:
            application/yaml:
              schema:
                type: string
  /api/polities:
    get:
      tags:
      - map
      summary: 'The polity borders in view for a span of years: one row per era of a polity whose own years overlap the span.'
      description: |-
        `from` and `to` are years on this atlas's scale -- negative for BC, no year
        zero -- and both are required, with `from` no later than `to`; anything else
        is `bad_window`. Rows come ordered by polity and then oldest era first, so a
        border change paints older beneath newer. A span no era overlaps answers an
        empty list.
      operationId: polities
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: integer
          format: int32
      - name: to
        in: query
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Polities'
        '400':
          description: The reference, window or query could not be read; the body's `code` is `bad_window`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Nothing in this atlas answers to that reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: The request was well formed but this atlas's own data for it is incomplete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/scene:
    get:
      tags:
      - map
      summary: 'The map for a span of years: the places events light up in that span, the quiet places around them, and the arrows narratives draw between them.'
      description: |-
        `from` and `to` are years on this atlas's scale -- negative for BC, no year
        zero -- and both are required, with `from` no later than `to`; anything else
        is `bad_window`. A span no event falls in composes an empty scene rather
        than failing.
      operationId: scene_time
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: integer
          format: int32
      - name: to
        in: query
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scene'
        '400':
          description: The reference, window or query could not be read; the body's `code` is `bad_window`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Nothing in this atlas answers to that reference.
          content:
            application/json:
              schema:
