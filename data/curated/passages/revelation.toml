# Batch W5 (whole-Bible titled verse containers, fifth run -- the LAST book
# of the whole W-series; when this file lands, all 66 canonical books are
# declared, per the master brief's own "Scale protocol" and this batch's
# own req 4, THE COMPLETION MILESTONE). Revelation.
# KIND POLICY (applies across this whole W5 slice, stated here once, per
# the master brief's own requirement 2, "KIND DISCIPLINE"): every
# container in this file is GENERAL-kind (undated, placeless) -- a
# letter's own teaching content is not a datable occurrence, and Theographic's
# own dated "X writes Y" EVENT nodes (where any exist) are a DIFFERENT
# identity from these content containers -- never merged into them, never
# given a fabricated dated twin. See batch-w5-report.md for the full
# reconciliation sweep against the real compiled events.json.
#
# GRANULARITY: per-vision units, per the master brief's own named grouping
# for this book -- "the seven letters individually (REV.2-3), throne room,
# seals, trumpets, the woman/dragon/beasts, bowls, Babylon, the millennium
# and judgment, new Jerusalem." Each named grouping above is represented by
# one or more containers at the text's own real scene-breaks within it (the
# seven letters individually, exactly as named; the trumpet septet split at
# its own real narrative interludes -- ch7's sealing/multitude scene, then
# ch10-11's angel/little-book/two-witnesses scene, both genuinely
# interrupting the trumpet sequence before it resumes -- while the seal
# septet and the bowl septet, each textually UNinterrupted within their own
# one chapter, are each kept as one container). PROVENANCE: REV.1.1 itself
# functions as a real, text-native title for the whole book (the source of
# its own traditional English name, "Revelation") -- unlike every other
# epistle's own opening self-identification in this whole W5 slice, quoted
# here verbatim as this book's own sole kjv_superscription in the entire
# slice; every other container in this file is atlas_section, our own CC0
# sectioning, per this batch's own req 2 expectation ("epistles have almost
# no canon-text titles... atlas_section provenance nearly everywhere").

[[event]]
id = "rev_prologue_and_greeting"
label = "The Revelation of Jesus Christ, which God gave unto him, to shew unto his servants things which must shortly come to pass; and he sent and signified it by his angel unto his servant John:"
kind = "general"
verses = ["REV.1.1-8"]
kjv_superscription = "REV.1.1, quoted verbatim in full (public domain KJV text, per LICENSES.md's own 'KJV text' row) -- the book's own real, traditional-name-supplying title/superscription, phrased as a transmission chain (God to Christ to his angel to John) rather than a bare title clause, but functioning identically; the whole verse is quoted (an 'exact match,' not a trimmed prefix) since it carries no internal sentence-final punctuation to trim to. Distinct from the vision content proper, which begins at 1:9 ('I was in the Spirit on the Lord's day...'); this container's own remaining verses (1:2-8) carry the rest of the prologue -- John's own greeting to the seven churches and the Alpha-and-Omega self-declaration."

[[event]]
id = "rev_vision_of_the_son_of_man"
label = "John's own vision of the Son of man among the seven candlesticks"
kind = "general"
verses = ["REV.1.9-20"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Revelation 1:9-20, John on Patmos 'in the Spirit on the Lord's day,' the vision of one like the Son of man amid seven golden candlesticks, and the vision's own interpretation -- 'the seven stars are the angels of the seven churches... the seven candlesticks... are the seven churches.'"

