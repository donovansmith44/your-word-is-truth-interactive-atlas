# A [[text_marker]] names a paragraph-marker span (by its id, less the
# "-acontent" suffix) whose label is really words of the page: the site
# encoded a Scripture verse number as a marker. Its label is read as text, so
# it neither opens a paragraph nor leaves the verse number out.

[[text_marker]]
document = "epitome"
