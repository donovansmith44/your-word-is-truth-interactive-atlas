atlas_section = "Deuteronomy pericope (this project's own sectioning, CC0 -- no external PD source claimed): Deuteronomy 6-11, the Shema ('Hear, O Israel'), the command to destroy the Canaanite nations, the warning against forgetting the LORD in prosperity, the golden calf recalled, and the choice of blessing or curse."
ref_note = "Same traditional year, continuing the same discourse. Place: Moab."

[[event]]
id = "deu_worship_idolatry_laws"
