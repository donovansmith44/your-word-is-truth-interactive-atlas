  /api/scene:
    get:
      tags:
      - map
      summary: 'The map for a span of years: the places events light up in that span, the quiet places around them, and the arrows narratives draw between them.'
      description: |-
        `from` and `to` are years on this atlas's scale -- negative for BC, no year
        zero -- and both are required, with `from` no later than `to`; anything else
        is `bad_window`. A span no event falls in composes an empty scene rather
        than failing.
      operationId: scene_time
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: integer
          format: int32
      - name: to
        in: query
        required: true
        schema:
          type: integer
          format: int32
      responses:
