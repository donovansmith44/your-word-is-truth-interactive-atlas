ref_note = "Same dated setting as zec_the_question_of_fasting (its own direct, formally-marked answer). Place: Jerusalem, explicit throughout."

# --- Part 2: undated (9:1-14:21, the two 'burdens'), GENERAL-kind --------

[[event]]
id = "zec_burden_1_judgment_on_the_nations"
label = "The burden of the word of the Lord in the land of Hadrach"
kind = "general"
verses = ["ZEC.9.1-8"]
atlas_section = "Zechariah pericope (this project's own sectioning, CC0 -- no external PD source claimed): Zechariah 9:1-8, the first of two 'burden' oracles opening this book's own second part -- judgment on Hadrach, Damascus, Hamath, Tyre, Sidon, and the Philistine cities, with a remnant of Ekron becoming 'as a Jebusite,' and the Lord's own promise to encamp about his house."
ref_note = "GENERAL-kind: oracle, no date of its own claimed, per this file's own header note. The 'burden' formula (9:1) is not cleanly separable into a short title clause the way Nahum's/Habakkuk's own superscriptions are (it runs directly into 'and Damascus shall be the rest thereof'), so this container's own title is this project's own CC0 phrasing, not a kjv_superscription."

