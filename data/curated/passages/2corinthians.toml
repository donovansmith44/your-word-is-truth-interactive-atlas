# Batch W5 (whole-Bible titled verse containers, fifth run). 2 Corinthians.
# KIND POLICY (applies across this whole W5 slice, stated here once, per
# the master brief's own requirement 2, "KIND DISCIPLINE"): every
# container in this file is GENERAL-kind (undated, placeless) -- a
# letter's own teaching content is not a datable occurrence, and Theographic's
# own dated "X writes Y" EVENT nodes (where any exist) are a DIFFERENT
# identity from these content containers -- never merged into them, never
# given a fabricated dated twin. See batch-w5-report.md for the full
# reconciliation sweep against the real compiled events.json.
#
# GRANULARITY: 2 Corinthians moves through three real, text-marked
# movements -- Paul's own defence of his ministry and change of plans
# (1-7), the collection for Jerusalem (8-9), and his own final defence
# against the "super-apostles" (10-13) -- each subdivided at its own
# natural paragraph seams. 6:14-7:1 is kept as one container spanning the
# chapter break (7:1's own 'having therefore these promises' concludes the
# 6:14-18 exhortation to separation, not a fresh topic) -- a literary-
# structure fact, not textual criticism.

[[event]]
id = "2co_salutation"
label = "Salutation to the church of God at Corinth, with all the saints in Achaia"
kind = "general"
verses = ["2CO.1.1-2"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): 2 Corinthians 1:1-2, Paul's own opening greeting, with Timothy, to the church at Corinth and all the saints in Achaia."

