  /api/sources:
    get:
      tags:
      - meta
      summary: Every source this atlas is built from, and how each one is licensed.
      description: |-
        `categories` are the headings the `sources` are grouped under, and
        `provenances` join the provenance id that rides on an individual record
        back to the source that asserts it.
      operationId: sources
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcesDocument'
  /api/text:
    get:
      tags:
      - graph
      summary: 'A window of one corpus''s reading spine: the units of text around the one a reference names, and the reference that continues the window.'
      description: |-
        `ref` is `BOOK.CHAPTER.VERSE`, or `BoC PART.ARTICLE.PARAGRAPH` when
        `corpus=concord` (`corpus` is `bible` unless given, anything else is
        `bad_corpus`); a malformed reference is `bad_ref` and one naming nothing in
        the corpus is `not_found`. `n` defaults to 1 and caps at 500, and
        `dir=backward` ends the window at `ref` instead of starting it there; a `dir`
        that is neither is `bad_dir`. An `n` that does not read as a whole number is
        not refused: it leaves the default standing. `scope=chapter` covers the whole
        chapter named instead, and takes neither `n` nor `dir=backward` -- that
        combination is `bad_dir`, and a `scope` outside the two is `bad_scope`. A
        chapter is a Scripture reading and nothing else: `scope=chapter` with
        `corpus=concord` is `bad_scope`, because the Book of Concord is read by the
        article and an article's paragraph count is no fixed span; a Concord caller
        asks for the paragraphs it wants with `n` instead. The response's `next` is the
        reference one step further on, absent at the end of the corpus.
      operationId: text_window
      parameters:
      - name: ref
        in: query
        required: true
        schema:
          type: string
      - name: n
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: dir
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/WindowDir'
      - name: scope
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TextScope'
      - name: corpus
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Corpus'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextWindow'
        '400':
          description: The reference, window or query could not be read; the body's `code` says which (`bad_ref`, `bad_dir`, `bad_scope`, `bad_corpus`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Nothing in this atlas answers to that reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: The request was well formed but this atlas's own data for it is incomplete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
