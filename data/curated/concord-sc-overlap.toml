# Batch CORP-2a, decision 4 (SC-OVERLAP, owner-approved design): the Small
# Catechism lives in the graph TWICE by history -- the catechism adapter's
# own CatechismItem nodes (data/curated/catechism.toml, the six chief
# parts, Wikisource-sourced 1921 Bente-Dau) and now the Small Catechism's
# OWN paragraphs as Concord TextUnits (bookofconcord.org-sourced, SAME
# 1921 Bente-Dau translation). These are NOT merged and NOT
# duplicated-away: this file is the CURATED, HAND-VERIFIED alignment
# between them -- one row per CatechismItem, naming the Concord
# (part=7 "small-catechism", article, paragraph) position(s) whose text IS
# that item (its `text` question plus its `explanation` answer, matching
# `catechism.toml`'s own text+explanation shape for the identical
# content). `paragraphs` is a list because bookofconcord.org's own
# paragraph numbering is sometimes FINER than one CatechismItem: several
# Baptism/Altar items have their own separate "Where is this written?"
# follow-up as a SEPARATE source paragraph, so the item's own alignment
# is TWO Concord paragraphs, not one -- both listed, both become their own
# `CatechismLink` row (multiple loci per item is already how the EXISTING
# Bible-locus links work: one row per cited verse).
#
# ARTICLE NUMBERS below are the Concord parser's own 1-based position
# WITHIN the small-catechism document, AFTER the two non-confessional
# site-furniture articles are excluded (see `server/atlas-etl/src/
# concord.rs`'s own `is_skipped_article`): 1=preface, 2=ten-commandments,
# 3=the-creed, 4=the-lords-prayer, 5=the-sacrament-of-holy-baptism,
# 6=how-christians-confess, 7=the-sacrament-of-the-altar. (daily-prayers=8,
# table-of-duties=9, christian-questions-and-answers=10 carry no
# CatechismItem counterpart at all -- `catechism.toml`'s own documented
# scope is "the six chief parts... Daily Prayers/Table of Duties are out
# of scope," so those two Concord articles are simply unmatched, disclosed
# in the batch report, not an error.)
#
# HAND-VERIFICATION (decision 4: "the SC is small; hand-verify the
# mapping"): every row below was checked against the real, parsed
# bookofconcord.org paragraph text (`server/atlas-etl/tests/
# concord_real_data.rs` spot-checks several), confirming word-for-word
# agreement (modulo the disclosed straight/curly-quote transcription
# convention difference -- LICENSES.md's own "The Book of Concord"
# section) between each item's `catechism.toml` explanation and its
# aligned Concord paragraph(s). Two DISCLOSED wrinkles, not force-fit:
# - `confession-2` ("The Absolution") is NOT its own separate Concord
#   paragraph -- its exact wording ("As thou believest...Depart in
#   peace.") sits embedded within the LARGER article-6 paragraph 4 (the
#   full "Brief Form of Confession" Luther gives), which paragraph 4
#   alone also fully covers. Linked to paragraph 4 anyway (the wording
#   genuinely appears there) rather than left unmatched.
# - how-christians-confess (article 6) paragraphs 2 and 3 ("What sins
#   should we confess?" / "Which are these?") have NO CatechismItem
#   counterpart at all -- genuinely extra catechetical material
#   `catechism.toml`'s own curated scope never captured. Unmatched,
#   disclosed in the batch report, never invented a spurious item for.
#
# Total: 37 CatechismLink rows from 33 CatechismItems (baptism/altar's own
# split items account for the +4).

