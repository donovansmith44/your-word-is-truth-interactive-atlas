# The Hittite Empire at its height under Suppiluliuma I and successors:
# north-central Anatolia around the capital Hattusa, reaching south into
# Cilicia and northern Syria (toward Carchemish/Ugarit) -- the great power
# Egypt's New Kingdom rivaled and treatied with (the Battle of Kadesh, the
# Hittite-Egyptian peace treaty).
