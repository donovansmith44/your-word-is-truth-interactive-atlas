# Batch M requirement 1: this era's own RISE into the Neo-Assyrian Empire
# below -- Adad-nirari II/Ashurdan II's own resurgence beginning the
# empire's rapid 9th-8th-century expansion. Assyriology, not Scripture (the
# KJV text's own Assyria narrative doesn't begin until the empire is
# already a going concern, e.g. 2 Kings 15:19's "Pul the king of Assyria").
# Honestly disclosed as general history rather than an invented citation.
[era.transition]
event = "The Neo-Assyrian resurgence begins under Adad-nirari II"
verses = []
ref_note = "general Assyriological knowledge (the 10th-9th century BC resurgence that becomes the Neo-Assyrian Empire); no specific source consulted this session; not scripture-narrated at this specific boundary -- the KJV text's own Assyria narrative picks up later, once the empire already presses on Israel (e.g. 2 Kings 15:19)"

# The Neo-Assyrian Empire: 2 Kings' own great antagonist -- Tiglath-Pileser
# III, Shalmaneser V's fall of Samaria (722 BC), Sennacherib's siege of
# Jerusalem (701 BC) -- at its height under Esarhaddon/Ashurbanipal,
# reaching the Mediterranean coast (Tyre, Sidon), Egypt in the south,
# Cilicia/Anatolia in the north, and the Zagros/western Iran in the east.
# Ends with the fall of Nineveh (612 BC) and Harran (609 BC) to the
# Medes/Neo-Babylonians.
[[era]]
name = "Neo-Assyrian Empire"
from = -911
to = -609
ref_note = "fetched en.wikipedia.org/wiki/Neo-Assyrian_Empire 2026-08-19 for territorial extent (Mediterranean coast west, Egypt south, Cilicia/Anatolia north, Zagros/western Iran east)"
