# egypt.toml -- Egypt; shapes are approximate, drawn for recognizability.
# One polity id spanning its whole biblical history: the era NAME changes
# ("Egypt" -> "Ptolemaic Egypt") but the id stays "egypt" throughout, so the
# plate keeps one hue across the whole timeline (Batch B2: color_key hashes
# the id, not the era name).
id = "egypt"

# Old + Middle Kingdom (through the Second Intermediate Period): the
# classic core -- Nile valley from the First Cataract at Aswan down through
# the Delta fan, nothing beyond it. Fix round 1 (M3): fetched
# en.wikisource.org/wiki/1911_Encyclopaedia_Britannica/Egypt/3_History
# 2026-08-20 specifically to ground this era -- it confirms the First
# Cataract at Aswan as Egypt's classic southern limit and separately
# records that the MIDDLE KINGDOM'S OWN frontier under Senwosri III reached
# further south still ("marked the south frontier of his kingdom by a
# statue and stelae at Semna beyond the Second Cataract"). This ring is
# reused unchanged below for the Late Period era (whose own real extent, per
# the same article, contracted back to "the Nile valley proper" after the
# Empire fell), so it stays drawn at the more conservative, First-Cataract
# extent common to both eras rather than being pushed south to Semna on the
# strength of the Middle Kingdom's own, narrower, temporary high-water
# mark -- shape confirmed, not moved.
