  /api/narrative/event/{id}:
    get:
      tags:
      - events
      summary: 'Where one event sits in time: its neighbours in each narrative it is a leg of, and its neighbours in the whole chronology.'
      description: |-
        `{id}` is an event id handed back by another response; an id naming no event
        is `not_found`. An event that is a leg of no narrative answers an empty
        `narrative` list, and one with no date carries no `timeline` at all.
      operationId: narrative_event_positions
      parameters:
      - name: id
        in: path
        required: true
