# --- John -----------------------------------------------------------------

[[fulfillment]]
prophecy = { from = "ISA.53.1" }
fulfillment = { from = "JHN.12.38" }
text = "That the saying of Esaias the prophet might be fulfilled, which he spake, Lord, who hath believed our report? and to whom hath the arm of the Lord been revealed?"

# Second OT source in the SAME pericope (JHN 12:38-41): v39-40 continues
# with a second quotation ("Esaias said again"), and v41 seals BOTH
# quotations as one fulfillment claim -- "These things said Esaias, when he
# saw his glory, and spake of him."
[[fulfillment]]
prophecy = { from = "ISA.6.10" }
fulfillment = { from = "JHN.12.39", to = "JHN.12.40" }
text = "Therefore they could not believe, because that Esaias said again, He hath blinded their eyes, and hardened their heart; that they should not see with their eyes, nor understand with their heart, and be converted, and I should heal them -- \"these things said Esaias, when he saw his glory, and spake of him\" (JHN 12:41)."

[[fulfillment]]
prophecy = { from = "PSA.41.9" }
fulfillment = { from = "JHN.13.18" }
text = "I speak not of you all: I know whom I have chosen: but that the scripture may be fulfilled, He that eateth bread with me hath lifted up his heel against me."

# PSA.35.19 carries the identical clause ("hate me without a cause") and is
# a disclosed alternative candidate (batch report has the full reasoning);
# PSA.69.4 is chosen as the ground text here -- Psalm 69 is otherwise the
# dominant psalm this same Passion narrative draws on (vv. 21/25 below).
[[fulfillment]]
prophecy = { from = "PSA.69.4" }
fulfillment = { from = "JHN.15.25" }
text = "But this cometh to pass, that the word might be fulfilled that is written in their law, They hated me without a cause."

[[fulfillment]]
prophecy = { from = "PSA.22.18" }
fulfillment = { from = "JHN.19.24" }
text = "They said therefore among themselves, Let us not rend it, but cast lots for it, whose it shall be: that the scripture might be fulfilled, which saith, They parted my raiment among them, and for my vesture they did cast lots."

# The formula verse (19:28) names no quotation directly -- the fulfilling
# ACTION is narrated in the very next verse (the vinegar given for his
# thirst), which is what fulfills PSA.69.21 ("in my thirst they gave me
# vinegar to drink").
[[fulfillment]]
prophecy = { from = "PSA.69.21" }
fulfillment = { from = "JHN.19.28", to = "JHN.19.29" }
text = "Jesus knowing that all things were now accomplished, that the scripture might be fulfilled, saith, I thirst. Now there was set a vessel full of vinegar: and they filled a spunge with vinegar, and put it upon hyssop, and put it to his mouth."

[[fulfillment]]
prophecy = { from = "EXO.12.46" }
fulfillment = { from = "JHN.19.36" }
text = "For these things were done, that the scripture should be fulfilled, A bone of him shall not be broken."

[[fulfillment]]
prophecy = { from = "ZEC.12.10" }
fulfillment = { from = "JHN.19.37" }
text = "And again another scripture saith, They shall look on him whom they pierced."

# --- Luke -------------------------------------------------------------

# "This scripture" = the Isaiah passage Jesus had JUST read aloud
# (LUK 4:18-19, quoting ISA 61:1-2 -- "the acceptable year of the Lord" is
# the tightest whole-verse extent the quoted words span, into v2).
[[fulfillment]]
prophecy = { from = "ISA.61.1", to = "ISA.61.2" }
fulfillment = { from = "LUK.4.21" }
text = "And he began to say unto them, This day is this scripture fulfilled in your ears."

# --- Acts ---------------------------------------------------------------

# The formula (1:16) is answered by the quotation four verses later
# (1:20), which itself draws on TWO psalms -- one row per source, both
# sharing the SAME fulfillment span (the formula-through-quote unit).
[[fulfillment]]
prophecy = { from = "PSA.69.25" }
fulfillment = { from = "ACT.1.16", to = "ACT.1.20" }
text = "Men and brethren, this scripture must needs have been fulfilled, which the Holy Ghost by the mouth of David spake before concerning Judas... For it is written in the book of Psalms, Let his habitation be desolate, and let no man dwell therein."

[[fulfillment]]
prophecy = { from = "PSA.109.8" }
fulfillment = { from = "ACT.1.16", to = "ACT.1.20" }
text = "Men and brethren, this scripture must needs have been fulfilled, which the Holy Ghost by the mouth of David spake before concerning Judas... For it is written in the book of Psalms... and his bishoprick let another take."

[[fulfillment]]
prophecy = { from = "JOL.2.28", to = "JOL.2.32" }
fulfillment = { from = "ACT.2.16", to = "ACT.2.21" }
text = "But this is that which was spoken by the prophet Joel; And it shall come to pass in the last days, saith God, I will pour out of my Spirit upon all flesh: and your sons and your daughters shall prophesy."
