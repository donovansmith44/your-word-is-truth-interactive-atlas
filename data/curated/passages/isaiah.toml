# Batch W4 (whole-Bible titled verse containers, fourth run: the Prophets).
# Isaiah, in the SAME `[[event]]` schema every other `passages/*.toml` file
# uses. KIND POLICY: see obadiah.toml's own header note.
#
# RECONCILIATION: one pre-existing bare Theographic event touches this book
# -- `theo-217` ("Prophecies of Isaiah," all 1292 verses, -759). LAYER-0,
# not heading-worthy today; every container below stays well under the 0.8
# jaccard sweep floor against it (largest, 79/1292 = 0.061).
#
# ISAIAH 36-39 (2 Kings 18-20 || Isaiah 36-39, req 1b's own second NAMED
# CASE, Crockett sections 175-176): ALREADY FULLY WITNESSED by Batch W2's
# own six Kings-side containers (2ki_sennacherib_first_invasion,
# 2ki_rabshakeh_message, 2ki_hezekiahs_message_and_isaiahs_answer,
# 2ki_hezekiahs_prayer_and_deliverance, 2ki_hezekiah_illness_recovery,
# 2ki_hezekiah_babylonian_embassy) -- independently swept against the real
# compiled data before authoring: all 90 verses of Isaiah 36:1-39:8 are
# already claimed as ISA witness anchors on those six events, zero gaps.
# This file therefore does NOT author any new top-level container spanning
# 36-39 -- doing so would collide every one of those six witnesses' own
# anchors, the exact "shared container title must be TRUE AT EVERY ANCHOR"
# discipline batch-w3-report.md's own fix round 1 established. Every
# container below partitions the REMAINING 1202 verses of Isaiah (1202 =
# 1292 - 90) -- independently verified by a real script computing the
# expected verse set (all of Isaiah minus 36:1-39:8) against this file's
# own authored spans before it was ever run through the ETL: zero gaps,
# zero overlaps, zero duplication of the witnessed range.
#
# req 1b NAMED CASE (master brief: "Isaiah 2:2-4 || Micah 4:1-3"), BOTH
# SIDES this project's own to author: `isa_mountain_of_the_lords_house`
# (below, ISA.2.2-4) is the HOST; Micah's own witness row lives in
# data/curated/event-witnesses.toml (event_id =
# "isa_mountain_of_the_lords_house", book = "MIC", verses = ["MIC.4.1-3"]).
# micah.toml's own chapter-4 container deliberately begins at 4:4, not
# 4:1, to avoid a real anchor collision -- see that file's own header note.
# Hand-verified directly against the compiled KJV text (both ranges read in
# full before either side was authored) -- outside Crockett's own scope (a
# Samuel/Kings/Chronicles harmony, never Isaiah or Micah).
#
# GRANULARITY: the master brief's own named example genre -- "Isaiah's
# burdens per nation" (13-23) -- split one container per named burden
# (Babylon, Philistia, Moab, Damascus, Ethiopia, Egypt, the desert of the
# sea, Dumah, Arabia, the valley of vision, Tyre), not a chapter chunk.
# The Servant Songs (42:1-9 folded into its own wider chapter unit;
# 49:1-13/50:1-11/52:13-53:12 each their own container) and the six "woe"
# oracles (28-33) are likewise split by the text's own real formal markers
# ("woe to...", "the burden of...") rather than chapter boundaries, per the
# same "oracle units, not arbitrary chapter chunks" instruction.
#
# DATES (EVENT-kind rows only, three total): isa_isaiahs_call_vision
# reuses the pre-existing theo-218 ("Death of Uzziah," -758), matching
# 6:1's own explicit "in the year that king Uzziah died." isa_ahaz_and_
# the_sign_of_immanuel reuses theo-221 ("Reign of Ahaz," -743) -- a
# disclosed early-reign adjacency (the Syro-Ephraimite crisis narrated in
# ch7 is not independently dated more precisely anywhere in this app's own
# compiled data). isa_burden_of_philistia reuses theo-225 ("Death of
# Ahaz," -726), matching 14:28's own explicit "in the year that king Ahaz
# died was this burden." Every other container in this file is GENERAL-
# kind, undated, per this file's own header policy -- including
# isa_isaiah_walks_naked_as_a_sign (20:1-6), which DOES name a real,
# independently-known historical campaign (Sargon II's Tartan at Ashdod,
# 20:1) but has no reusable anchor anywhere in this app's own existing
# compiled data, so no date is fabricated for it.

[[event]]
id = "isa_superscription_and_the_lords_indictment"
label = "The vision of Isaiah the son of Amoz, which he saw concerning Judah and Jerusalem in the days of Uzziah, Jotham, Ahaz, and Hezekiah, kings of Judah."
kind = "general"
verses = ["ISA.1.1-20"]
kjv_superscription = "ISA.1.1, the book's own superscription, quoted verbatim (public domain KJV text, per LICENSES.md's own 'KJV text' row)."
ref_note = "Content: 'hear, O heavens, and give ear, O earth' -- the Lord's own indictment of a rebellious, sin-laden nation, and 'come now, and let us reason together' -- true repentance sought over empty sacrifice."

[[event]]
id = "isa_zion_purified_through_judgment"
label = "The faithful city become an harlot; Zion redeemed through judgment"
kind = "general"
verses = ["ISA.1.21-31"]
atlas_section = "Isaiah pericope (this project's own sectioning, CC0 -- no external PD source claimed): Isaiah 1:21-31, Jerusalem's own decline from a faithful city to a harlot's dwelling, judgment as the Lord's own purifying fire, and the promise: 'Zion shall be redeemed with judgment, and her converts with righteousness.'"

[[event]]
id = "isa_second_superscription"
label = "The word that Isaiah the son of Amoz saw concerning Judah and Jerusalem."
kind = "general"
verses = ["ISA.2.1"]
kjv_superscription = "ISA.2.1, a second, distinct superscription opening this book's own next major section, quoted verbatim (public domain KJV text, per LICENSES.md's own 'KJV text' row)."

[[event]]
id = "isa_mountain_of_the_lords_house"
label = "The mountain of the Lord's house exalted; nations turn swords into plowshares"
kind = "general"
verses = ["ISA.2.2-4"]
atlas_section = "Isaiah pericope (this project's own sectioning, CC0): Isaiah 2:2-4, the req 1b named parallel with Micah 4:1-3 -- 'in the last days... the mountain of the house of the Lord shall be established in the top of the mountains,' the nations streaming to it, and 'they shall beat their swords into plowshares, and their spears into pruninghooks: nation shall not lift up sword against nation, neither shall they learn war any more.'"
ref_note = "HOST of the req 1b Isaiah 2:2-4 || Micah 4:1-3 parallel -- see this file's own header note. Title is this project's own CC0 phrasing, not a literal kjv_superscription, since the two accounts' own wording genuinely differs in places ('all nations' ISA.2.2 vs 'people' MIC.4.1; 'Come ye' ISA.2.3 vs 'Come, and' MIC.4.2) -- the shared-title law requires a title TRUE AT EVERY ANCHOR, so a paraphrase honest to both, not a verbatim quote of either, is used."

