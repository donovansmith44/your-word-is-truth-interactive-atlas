# Batch W5 (whole-Bible titled verse containers, fifth and FINAL run: the
# epistles, Romans through Revelation -- see this file's own sibling files'
# headers and batch-w5-report.md for the full slice disclosure).
#
# KIND POLICY (applies across this whole W5 slice, stated here once, per
# the master brief's own requirement 2, "KIND DISCIPLINE"): every
# container in this file is GENERAL-kind (undated, placeless) -- a
# letter's own teaching content is not a datable occurrence, and Theographic's
# own dated "X writes Y" EVENT nodes (where any exist) are a DIFFERENT
# identity from these content containers -- never merged into them, never
# given a fabricated dated twin. See batch-w5-report.md for the full
# reconciliation sweep against the real compiled events.json.
#
# GRANULARITY: letter-structure units per the master brief's own req 2 --
# salutation, thanksgiving, argument/body units by real theme-boundary (not
# arbitrary chapter chunks), exhortation, closing. Romans' own argument
# (justification by faith / the place of Israel / the transformed life)
# divides at real paragraph seams throughout; 9:30-10:13 is kept as one
# container spanning the chapter break (9:30-33's own "Gentiles...attained
# to righteousness" opens the SAME sustained argument 10:1-13 completes,
# not a fresh topic at the chapter boundary) -- a literary-structure fact,
# not textual criticism.

[[event]]
id = "rom_salutation"
label = "Salutation: Paul, a servant of Jesus Christ, called to be an apostle"
kind = "general"
verses = ["ROM.1.1-7"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 1:1-7, Paul's own opening self-identification and apostolic calling, closing on the grace-and-peace greeting to the saints at Rome."

[[event]]
id = "rom_thanksgiving_and_longing_to_see_rome"
label = "Thanksgiving, and Paul's longing to come to Rome"
kind = "general"
verses = ["ROM.1.8-15"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 1:8-15, Paul's thanksgiving for the Romans' own faith 'spoken of throughout the whole world,' and his own long-held desire to visit them."

[[event]]
id = "rom_the_just_shall_live_by_faith"
label = "The gospel of God: the righteousness of God revealed, the just shall live by faith"
kind = "general"
verses = ["ROM.1.16-17"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 1:16-17, the letter's own thesis statement -- 'I am not ashamed of the gospel of Christ... the just shall live by faith.'"

[[event]]
id = "rom_the_wrath_of_god_against_gentile_ungodliness"
label = "The wrath of God revealed against the ungodliness of the Gentile world"
kind = "general"
verses = ["ROM.1.18-32"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 1:18-32, mankind's suppression of the truth known from creation, and God's own giving them up to a reprobate mind."

[[event]]
id = "rom_the_righteous_judgment_of_god"
label = "The righteous judgment of God, without respect of persons"
kind = "general"
verses = ["ROM.2.1-16"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 2:1-16, the self-righteous judge who does the same things he condemns, and God's own impartial judgment of Jew and Gentile alike 'according to his deeds.'"

[[event]]
id = "rom_the_jew_the_law_and_true_circumcision"
label = "The Jew, the law, and true circumcision of the heart"
kind = "general"
verses = ["ROM.2.17-29"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 2:17-29, the Jew who boasts in the law yet breaks it, and Paul's own definition of the true Jew -- 'circumcision is that of the heart, in the spirit.'"

[[event]]
id = "rom_the_whole_world_guilty_before_god"
label = "The whole world guilty before God: none righteous, no, not one"
kind = "general"
verses = ["ROM.3.1-20"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 3:1-20, the advantage of the Jew notwithstanding, both Jew and Gentile proved 'all under sin' by Paul's own catena of scripture citations, closing on 'by the law is the knowledge of sin.'"

[[event]]
id = "rom_the_righteousness_of_god_by_faith"
label = "The righteousness of God by faith in Jesus Christ, apart from the law"
kind = "general"
verses = ["ROM.3.21-31"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 3:21-31, righteousness 'without the law,' received through faith in Christ's own propitiatory blood, closing on 'we establish the law.'"

[[event]]
id = "rom_abraham_justified_by_faith"
label = "Abraham justified by faith, the father of all who believe"
kind = "general"
verses = ["ROM.4.1-25"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 4, Abraham's own faith 'counted unto him for righteousness' before circumcision or law, the pattern for every believer, closing on Christ 'raised again for our justification.'"

[[event]]
id = "rom_peace_with_god_through_christ"
label = "Peace with God and reconciliation through our Lord Jesus Christ"
kind = "general"
verses = ["ROM.5.1-11"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 5:1-11, the peace, access, and hope that follow justification by faith, and reconciliation to God 'by the death of his Son.'"

[[event]]
id = "rom_adam_and_christ"
label = "Adam and Christ: sin's entrance by one man, grace's abounding by one man"
kind = "general"
verses = ["ROM.5.12-21"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 5:12-21, the typology of Adam and Christ -- death reigning through the one man's offence, grace reigning through the One man's righteousness."

[[event]]
id = "rom_dead_to_sin_alive_to_god"
label = "Dead to sin, alive unto God: baptized into Christ's own death and resurrection"
kind = "general"
verses = ["ROM.6.1-14"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 6:1-14, believers buried with Christ by baptism into death and raised to walk in newness of life, closing 'ye are not under the law, but under grace.'"

[[event]]
id = "rom_servants_of_righteousness"
label = "Servants of righteousness: the wages of sin and the gift of God"
kind = "general"
verses = ["ROM.6.15-23"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 6:15-23, freedom from sin issuing in service to righteousness, closing on the letter's own famous antithesis -- 'the wages of sin is death; but the gift of God is eternal life.'"

[[event]]
id = "rom_freed_from_the_law_by_union_with_christ"
label = "Freed from the law by union with Christ"
kind = "general"
verses = ["ROM.7.1-6"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 7:1-6, the illustration of a wife bound to her husband only while he lives, applied to the believer's own death to the law 'by the body of Christ.'"

[[event]]
id = "rom_the_law_is_holy_the_war_within"
label = "The law is holy; the war between the flesh and the inward man"
kind = "general"
verses = ["ROM.7.7-25"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 7:7-25, Paul's own first-person account of sin's use of a holy law to produce death, and the cry 'O wretched man that I am! who shall deliver me' answered only 'through Jesus Christ our Lord.'"

[[event]]
id = "rom_life_in_the_spirit_no_condemnation"
label = "Life in the Spirit: no condemnation, and the adoption of sons"
kind = "general"
verses = ["ROM.8.1-17"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 8:1-17, 'no condemnation to them which are in Christ Jesus,' the Spirit of life setting free from the law of sin and death, and the Spirit's own witness that believers are 'heirs of God, and joint-heirs with Christ.'"

[[event]]
id = "rom_the_glory_to_be_revealed_and_the_love_of_god"
label = "The glory to be revealed, the Spirit's intercession, and the love of God from which nothing can separate us"
kind = "general"
verses = ["ROM.8.18-39"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 8:18-39, creation's own groaning for redemption, the Spirit's intercession 'with groanings which cannot be uttered,' and the closing crescendo -- neither death, nor life... 'shall be able to separate us from the love of God, which is in Christ Jesus our Lord.'"

[[event]]
id = "rom_pauls_sorrow_for_israel"
label = "Paul's own sorrow for his kinsmen after the flesh"
kind = "general"
verses = ["ROM.9.1-5"]
atlas_section = "pericope (this project's own sectioning, CC0 -- no external PD source claimed): Romans 9:1-5, Paul's own 'great heaviness and continual sorrow' for Israel, to whom belong 'the adoption, and the glory, and the covenants.'"

[[event]]
id = "rom_not_all_israel_is_israel"
